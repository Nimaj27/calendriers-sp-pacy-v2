<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#CC1D1D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calendriers SP">
  <title>Tournée Calendriers — SP Pacy</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png">

  <!-- Préchargement des modules volumineux et stables -->
  <link rel="modulepreload" href="./js/geoloc.js">
  <link rel="modulepreload" href="./js/carte.js">
  <link rel="modulepreload" href="./js/firebase.js">
</head>
<body>
  <div id="main">
    <div class="chargement-initial">
      <img src="./icons/icon-96.png" alt="" width="72" height="72">
      <p>Chargement de l'application…</p>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>

  <!-- Repli si les modules ne se chargent pas (navigateur trop ancien) -->
  <script nomodule>
    document.getElementById('main').innerHTML =
      '<div class="chargement-initial"><p>Ce navigateur est trop ancien pour cette application.' +
      '<br>Utilise Chrome, Safari ou Edge à jour.</p></div>';
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => { if (window.__surveillerMAJ) window.__surveillerMAJ(reg); })
          .catch(()=>{});
      });
    }
    // Filet de sécurité : si un module échoue, l'utilisateur doit le savoir
    window.addEventListener('error', (e) => {
      if (e.target && e.target.tagName === 'SCRIPT') {
        document.getElementById('main').innerHTML =
          '<div class="chargement-initial"><p>Un composant n\'a pas pu être chargé.' +
          '<br>Vérifie ta connexion puis recharge la page.</p>' +
          '<button onclick="location.reload()" class="btn btn--primary">Recharger</button></div>';
      }
    }, true);
  </script>
</body>
</html>
