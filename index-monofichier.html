// tournee.js — Logique métier tournée calendriers

const STATUT_PASSAGE = { DON:"don", OFFERT:"offert", REFUSE:"refuse", ABSENT:"absent", RELANCE:"relance" };
const STATUT_PASSAGE_LABEL = { don:"Don collecté", offert:"Calendrier offert", refuse:"A refusé", absent:"Absent", relance:"À relancer" };
const MODE_PAIEMENT = { ESPECES:"especes", CHEQUE:"cheque", CARTE:"carte" };

async function creerEquipe({ nom, membres=[], pin }) {
  if (!nom) throw new Error("Nom d'équipe obligatoire");
  if (!pin || !/^\d{4}$/.test(pin)) throw new Error("PIN doit être 4 chiffres");
  // L'unicité est structurelle : le PIN est l'identifiant du document
  const pris = await fsGet(COLLECTIONS.PINS, pin);
  if (pris) throw new Error("Ce PIN est déjà utilisé");
  const ref = await fsAdd(COLLECTIONS.EQUIPES, { nom, membres, actif:true });
  await fsSet(COLLECTIONS.PINS, pin, { equipeId: ref.id, nom });
  return ref;
}
async function mettreAJourEquipe(equipeId, data) {
  const { pin, ...champs } = data;
  if (pin !== undefined && pin !== null && pin !== '') {
    if (!/^\d{4}$/.test(pin)) throw new Error("PIN doit être 4 chiffres");
    const pris = await fsGet(COLLECTIONS.PINS, pin);
    if (pris && pris.equipeId !== equipeId) throw new Error("Ce PIN est déjà utilisé");
    // Retirer l'ancien code de cette équipe
    const tous = await fsGetAll(COLLECTIONS.PINS);
    for (const p of tous) {
      if (p.equipeId === equipeId && p.id !== pin) await fsDelete(COLLECTIONS.PINS, p.id);
    }
    await fsSet(COLLECTIONS.PINS, pin, { equipeId, nom: champs.nom || pris?.nom || '' });
  }
  if (Object.keys(champs).length) await fsUpdate(COLLECTIONS.EQUIPES, equipeId, champs);
}
async function supprimerEquipe(id) {
  const tous = await fsGetAll(COLLECTIONS.PINS);
  for (const p of tous) if (p.equipeId === id) await fsDelete(COLLECTIONS.PINS, p.id);
  return fsDelete(COLLECTIONS.EQUIPES, id);
}

// Table { equipeId → pin } — réservée aux administrateurs (règle "list")
async function lirePins() {
  const tous = await fsGetAll(COLLECTIONS.PINS);
  const map = {};
  for (const p of tous) map[p.equipeId] = p.id;
  return map;
}

// Migration : déplace les PIN encore stockés dans /equipes vers /pins
async function migrerPins() {
  const equipes = await fsGetAll(COLLECTIONS.EQUIPES);
  let deplaces = 0, conflits = 0;
  for (const e of equipes) {
    if (!e.pin) continue;
    const pris = await fsGet(COLLECTIONS.PINS, String(e.pin));
    if (pris && pris.equipeId !== e.id) { conflits++; continue; }
    await fsSet(COLLECTIONS.PINS, String(e.pin), { equipeId: e.id, nom: e.nom || '' });
    await fsUpdate(COLLECTIONS.EQUIPES, e.id, { pin: null });
    deplaces++;
  }
  return { deplaces, conflits, total: equipes.length };
}
async function lireEquipes() { return fsGetAll(COLLECTIONS.EQUIPES); }
async function lireEquipe(id) { return fsGet(COLLECTIONS.EQUIPES, id); }
function ecouterEquipes(callback) {
  return fsListen(COLLECTIONS.EQUIPES, (equipes) => {
    equipes.sort((a,b)=>a.nom.localeCompare(b.nom));
    callback(equipes);
  });
}

async function ajouterPassage({ secteurId, equipeId, equipeNom, adresse, statut, montant=0, modePaiement=null, nomDonateur="", note="", saisiPar="" }) {
  if (!secteurId||!equipeId) throw new Error("secteurId et equipeId obligatoires");
  if (!Object.values(STATUT_PASSAGE).includes(statut)) throw new Error("Statut invalide");
  if (statut===STATUT_PASSAGE.DON && montant<=0) throw new Error("Montant requis pour un don");
  // Le statut "offert" ne requiert aucun montant (calendrier donné sans contrepartie)
  const passage = await fsAdd(COLLECTIONS.PASSAGES, {
    secteurId, equipeId, equipeNom, adresse:adresse||"", statut,
    montant: statut===STATUT_PASSAGE.DON ? Number(montant) : 0,
    modePaiement: statut===STATUT_PASSAGE.DON ? modePaiement : null,
    nomDonateur, note, saisiPar, aRelancer: statut===STATUT_PASSAGE.ABSENT, datePassage: new Date().toISOString()
  });
  await recalculerTotauxSecteur(secteurId);
  return passage;
}
async function marquerRelance(passageId, secteurId) {
  await fsUpdate(COLLECTIONS.PASSAGES, passageId, { aRelancer:true, statut:STATUT_PASSAGE.RELANCE });
  await recalculerTotauxSecteur(secteurId);
}
// Vérifie si une adresse a déjà été saisie dans ce secteur (anti-doublon binôme)
// Retourne le passage existant le plus récent, ou null
async function verifierDoublonAdresse(secteurId, adresse) {
  if (!adresse || !adresse.trim()) return null;
  const passages = await fsQuery(COLLECTIONS.PASSAGES, where("secteurId","==",secteurId));
  const norm = (s) => (s||"").toLowerCase().replace(/[^a-z0-9]/g, "");
  const cible = norm(adresse);
  if (!cible) return null;
  const matches = passages.filter(p => norm(p.adresse) === cible);
  if (matches.length === 0) return null;
  return matches.sort((a,b)=>(b.datePassage||"").localeCompare(a.datePassage||""))[0];
}

async function modifierPassage(passageId, data) {
  const { secteurId, ...champs } = data;
  await fsUpdate(COLLECTIONS.PASSAGES, passageId, champs);
  if (secteurId) await recalculerTotauxSecteur(secteurId);
}

async function supprimerPassage(passageId, secteurId) {

}

async function statsGlobalesTournee() {
  const [passages, equipes, secteurs] = await Promise.all([
    fsGetAll(COLLECTIONS.PASSAGES), fsGetAll(COLLECTIONS.EQUIPES), fsGetAll(COLLECTIONS.SECTEURS)
  ]);
  let totalEspeces=0, totalCheques=0, totalCarte=0, nbDons=0, nbOfferts=0, nbRefus=0, nbAbsents=0, nbRelances=0;
  for (const p of passages) {
    if (p.statut==="don") { nbDons++; if(p.modePaiement==="especes") totalEspeces+=Number(p.montant||0); else if(p.modePaiement==="cheque") totalCheques+=Number(p.montant||0); else if(p.modePaiement==="carte") totalCarte+=Number(p.montant||0); }
    if (p.statut==="offert") nbOfferts++;
    if (p.statut==="refuse") nbRefus++;
    if (p.statut==="absent") nbAbsents++;
    if (p.statut==="relance") nbRelances++;
  }
  const nbCalendriers = nbDons + nbOfferts;   // calendriers distribués au total
  const totalCollecte = totalEspeces + totalCheques + totalCarte;
  const parEquipe = equipes.map(eq => {
    const eqPassages = passages.filter(p=>p.equipeId===eq.id);
    const montant = eqPassages.filter(p=>p.statut==="don").reduce((s,p)=>s+Number(p.montant||0),0);
    const nbRefusEq = eqPassages.filter(p=>p.statut==="refuse").length;
    const nbOffertsEq = eqPassages.filter(p=>p.statut==="offert").length;
    const nbDonsEq = eqPassages.filter(p=>p.statut==="don").length;
    return { ...eq, montant, nbPassages:eqPassages.length, nbRefus:nbRefusEq,
             nbOfferts:nbOffertsEq, nbCalendriers:nbDonsEq + nbOffertsEq };
  }).sort((a,b)=>b.montant-a.montant);
  const nbSecteursTermines = secteurs.filter(s=>s.statut==="termine").length;
  const nbSecteursTotal = secteurs.length;
  const avancement = nbSecteursTotal>0 ? Math.round((nbSecteursTermines/nbSecteursTotal)*100) : 0;
  return { totalCollecte, totalEspeces, totalCheques, totalCarte, nbDons, nbOfferts, nbCalendriers, nbRefus, nbAbsents, nbRelances, nbPassages:passages.length, nbSecteursTermines, nbSecteursTotal, avancement, parEquipe };
}

// Cellule CSV compatible Excel : double les guillemets et neutralise les
// préfixes interprétés comme des formules (=, +, -, @).
function celluleCSV(value) {
  let v = String(value ?? "");
  if (/^[=+\-@]/.test(v)) v = "'" + v;
  return `"${v.replaceAll('"', '""')}"`;
}

async function exporterBilanCSV() {
  const [passages, secteurs, equipes] = await Promise.all([fsGetAll(COLLECTIONS.PASSAGES), fsGetAll(COLLECTIONS.SECTEURS), fsGetAll(COLLECTIONS.EQUIPES)]);
  const secteurMap = Object.fromEntries(secteurs.map(s=>[s.id,s]));
  const ligne = (...vals) => vals.map(celluleCSV).join(";") + "\n";
  let csv = "BILAN PAR SECTEUR\n" + ligne("Secteur","Commune","Équipe","Statut","Total collecté (€)","Foyers visités","Absents");
  for (const s of secteurs) csv += ligne(s.nom, s.commune, s.equipNom||'-', s.statut, (s.totalCollecte||0).toFixed(2), s.nbFoyersVisites||0, s.nbFoyersAbsents||0);
  csv += "\n\nBILAN PAR ÉQUIPE\n" + ligne("Équipe","Membres","Montant collecté (€)","Nb passages");
  for (const e of equipes) {
    const eqP = passages.filter(p=>p.equipeId===e.id);
    const montant = eqP.filter(p=>p.statut==="don").reduce((s,p)=>s+Number(p.montant||0),0);
    csv += ligne(e.nom, (e.membres||[]).join(', '), montant.toFixed(2), eqP.length);
  }
  csv += "\n\nDÉTAIL DES PASSAGES\n" + ligne("Date","Équipe","Secteur","Commune","Adresse","Statut","Mode paiement","Montant (€)","Nom donateur","Note");
  const sorted = [...passages].sort((a,b)=>(a.datePassage||"").localeCompare(b.datePassage||""));
  for (const p of sorted) {
    const s = secteurMap[p.secteurId]||{};
    csv += ligne((p.datePassage||"").slice(0,10), p.equipeNom||'', s.nom||'', s.commune||'', p.adresse||'', p.statut, p.modePaiement||'', p.montant?Number(p.montant).toFixed(2):'0.00', p.nomDonateur||'', p.note||'');
  }
  csv += "\n\nFOYERS À RELANCER\n" + ligne("Équipe","Secteur","Commune","Adresse","Note");
  for (const p of passages.filter(p=>p.aRelancer)) {
    const s = secteurMap[p.secteurId]||{};
    csv += ligne(p.equipeNom||'', s.nom||'', s.commune||'', p.adresse||'', p.note||'');
  }
  return csv;
}
function telechargerCSV(csv, filename="bilan-tournee-calendriers.csv") {
  const bom = "\uFEFF";
  const blob = new Blob([bom+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}


// ── Effacement de tous les passages (nettoyage des saisies de test) ──
// Les secteurs et les équipes sont conservés ; seuls les passages sont
// supprimés et les totaux des secteurs remis à zéro.
async function effacerTousLesPassages() {
  const passages = await fsGetAll(COLLECTIONS.PASSAGES);
  let supprimes = 0, erreurs = 0;
  for (const p of passages) {
    try { await fsDelete(COLLECTIONS.PASSAGES, p.id); supprimes++; }
    catch(e) { erreurs++; }
  }
  // Remettre à zéro les compteurs de chaque secteur
  const secteurs = await fsGetAll(COLLECTIONS.SECTEURS);
  for (const s of secteurs) {
    try {
      await fsUpdate(COLLECTIONS.SECTEURS, s.id, {
        totalCollecte: 0, nbFoyersVisites: 0, nbFoyersAbsents: 0,
        nbCalendriers: 0, nbFoyersTotal: 0
      });
    } catch(e) { /* on continue */ }
  }
  return { supprimes, erreurs, secteurs: secteurs.length };
}

function getCouleurEquipe(equipeId, toutesLesEquipes) {

  const ids = toutesLesEquipes.map(e=>e.id).sort();
  const idx = ids.indexOf(equipeId);

}
const _contourCache = {};

// ── Turf.js pour le calcul d'enveloppe convexe ──
let _turfLoading = null;
function chargerTurf() {
  if (window.turf) return Promise.resolve();
  if (_turfLoading) return _turfLoading;
  _turfLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js";
    s.onload = () => res();
    s.onerror = () => rej(new Error("Turf.js indisponible"));
    document.head.appendChild(s);
  });
  return _turfLoading;
}

// ── Géocodage des rues via l'API Adresse (BAN) ──
const _geocodeCache = {};

// Centre approximatif de la zone couverte (Pacy-sur-Eure)
const CENTRE_ZONE = [1.383, 49.016]; // [lon, lat]
const RAYON_MAX_KM = 25;             // au-delà, on rejette le point (erreur de géocodage)

function distanceKm(a, b) {
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(b[1]-a[1]), dLon = toRad(b[0]-a[0]);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a[1]))*Math.cos(toRad(b[1]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

async function geocoderRue(rue, commune) {
  const key = `${rue}|${commune}`;
  if (_geocodeCache[key] !== undefined) return _geocodeCache[key];
  try {
    const q = encodeURIComponent(`${rue} ${commune}`);
    // API Géoplateforme (remplace api-adresse.data.gouv.fr, décommissionnée en janvier 2026)
    const url = `https://data.geopf.fr/geocodage/search?q=${q}&limit=1&lat=${CENTRE_ZONE[1]}&lon=${CENTRE_ZONE[0]}`;
    const res = await fetch(url);
    if (!res.ok) { _geocodeCache[key] = null; return null; }
    const data = await res.json();
    const f = data.features?.[0];
    if (!f) { _geocodeCache[key] = null; return null; }
    const coords = f.geometry?.coordinates;
    // Rejeter les résultats manifestement hors zone (mauvais géocodage)
    if (!coords || distanceKm(CENTRE_ZONE, coords) > RAYON_MAX_KM) {
      _geocodeCache[key] = null; return null;
    }
    _geocodeCache[key] = coords;
    return coords;
  } catch (e) {
    _geocodeCache[key] = null;
    return null;
  }
}

// ── Zone approximative = enveloppe convexe autour des rues géocodées ──
const SURFACE_MAX_KM2 = 60; // au-delà, la zone est jugée aberrante

async function calculerZoneApproximative(rues, commune) {
  if (!rues || rues.length === 0) return null;
  try { await chargerTurf(); } catch(e) { return null; }

  const points = [];
  const echantillon = rues.slice(0, 25); // limite pour ne pas saturer l'API

  for (const rue of echantillon) {
    const coords = await geocoderRue(rue, commune);
    if (coords) points.push(coords);
    // Petite pause pour éviter les 504 / rate-limit de l'API
    await new Promise(r => setTimeout(r, 30));
  }

  // Il faut assez de points fiables, sinon on retombe sur le contour communal
  if (points.length < 4) return null;

  try {
    const fc = turf.featureCollection(points.map(p => turf.point(p)));

    // Enveloppe CONCAVE : épouse la forme réelle des rues, réduit fortement
    // les chevauchements entre secteurs voisins (contrairement à l'enveloppe convexe).
    // maxEdge = longueur max d'une arête en km ; si trop petit, turf renvoie null,
    // on réessaie donc en élargissant progressivement.
    let hull = null;
    for (const maxEdge of [1.2, 1.8, 2.5]) {
      try {
        hull = turf.concave(fc, { maxEdge, units: "kilometers" });
        if (hull) break;
      } catch(e) { /* on tente la valeur suivante */ }
    }
    // Dernier recours : enveloppe convexe
    if (!hull) hull = turf.convex(fc);
    if (!hull) return null;

    // Buffer réduit (60 m au lieu de 120) pour limiter les recouvrements
    const zone = turf.buffer(hull, 0.10, { units:"kilometers" }) || hull;

    // Garde-fou : si la zone calculée est démesurée, on la rejette
    const aire = turf.area(zone) / 1e6; // m² → km²
    if (aire > SURFACE_MAX_KM2) {
      console.warn(`Zone rejetée (${Math.round(aire)} km²) pour ${commune}`);
      return null;
    }
    return zone;
  } catch (e) {
    return null;
  }
}

async function fetchContourCommune(codeInsee) {
  if (_contourCache[codeInsee]) return _contourCache[codeInsee];
  try {
    const res = await fetch(`https://geo.api.gouv.fr/communes/${codeInsee}?format=geojson&geometry=contour`);
    if (!res.ok) return null;
    const geojson = await res.json();
    _contourCache[codeInsee] = geojson;
    return geojson;
  } catch(e) { return null; }
}

      geojson = { type: "Feature", geometry: POLYGONES_SECTEURS[secteur.nom], properties: {} };
    }
    // 2. Sinon, géocodage à la volée pour les découpages non précalculés
    else if (communeDecoupee && secteur.rues && secteur.rues.length > 0) {
      geojson = await calculerZoneApproximative(secteur.rues, secteur.commune);
    }
    // 3. Sinon, contour communal officiel
    if (!geojson) geojson = await fetchContourCommune(codeInsee);
    if (!geojson) continue;
    const couleur=getCouleurEquipe(secteur.equipeId,equipes);
    // Communes découpées : bordure colorée + remplissage plus léger pour
    // que les éventuels chevauchements restent lisibles
    const style = communeDecoupee
      ? { color: couleur, weight: 2.5, opacity: 1,
          fillColor: couleur,
          fillOpacity: secteur.statut==="termine"?0.45:secteur.statut==="en_cours"?0.35:secteur.equipeId?0.25:0.12 }
      : { color: "#FFFFFF", weight: 2, opacity: 0.9,
          fillColor: couleur,
          fillOpacity: secteur.statut==="termine"?0.65:secteur.statut==="en_cours"?0.5:secteur.equipeId?0.4:0.15 };
    const layer=L.geoJSON(geojson,{ style });
    layer.bindPopup(`<div style="font-family:Inter,sans-serif;min-width:160px;"><strong>${secteur.nom}</strong><br><span style="color:#666">${secteur.commune}</span><br>👥 ${secteur.equipNom||'Non affecté'}<br><strong style="color:#16A34A">${Number(secteur.totalCollecte||0).toLocaleString('fr-FR')} €</strong></div>`);
    layer.addTo(map); layers.push(layer);
    const b=layer.getBounds(); if(b.isValid()) bounds.push(b);
  }
  if (bounds.length>0) { let ab=bounds[0]; bounds.forEach(b=>{ab=ab.extend(b);}); map.fitBounds(ab,{padding:[20,20]}); }
  return layers;
}
export async function afficherSecteurUnique(map, secteur) {
  let geojson = null;

  // 1. Polygone précalculé du secteur (Pacy, Ménilles, Saint-Aquilin)
  if (POLYGONES_SECTEURS[secteur.nom]) {
    geojson = { type: "Feature", geometry: POLYGONES_SECTEURS[secteur.nom], properties: {} };
  }
  // 2. Sinon, contour communal officiel
  if (!geojson) {
    const codeInsee = COMMUNES_INSEE[secteur.commune];
    if (!codeInsee) return null;
    geojson = await fetchContourCommune(codeInsee);
  }
  if (!geojson) return null;
  const couleur=secteur.couleur||"#CC1D1D";
  const layer=L.geoJSON(geojson,{style:{color:couleur,weight:3,fillColor:couleur,fillOpacity:0.3}});
  layer.addTo(map);
  const bounds=layer.getBounds(); if(bounds.isValid()) map.fitBounds(bounds,{padding:[30,30]});
  return layer;
}

// ── Détection du secteur contenant un point GPS ──────────────────
// Utilise les polygones précalculés (test point-dans-polygone, sans dépendance)
function pointDansPolygone(lon, lat, ring) {
  let dedans = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > lat) !== (yj > lat)) &&
        (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) dedans = !dedans;
  }
  return dedans;
}

function dansGeometrie(lon, lat, geom) {
  if (!geom) return false;
  const polys = geom.type === 'Polygon' ? [geom.coordinates]
              : geom.type === 'MultiPolygon' ? geom.coordinates : [];
  for (const poly of polys) {
    // poly[0] = contour extérieur, poly[1..] = trous
    if (pointDansPolygone(lon, lat, poly[0])) {
      let dansTrou = false;
      for (let k = 1; k < poly.length; k++) {
        if (pointDansPolygone(lon, lat, poly[k])) { dansTrou = true; break; }
      }
      if (!dansTrou) return true;
    }
  }
  return false;
}

// Cherche parmi une liste de secteurs celui qui contient la position
// Retourne { secteur, methode } — methode = 'polygone' | 'commune' | null
export async function secteurALaPosition(lat, lon, secteurs) {
  // 1. Polygones précalculés (Pacy, Ménilles, Saint-Aquilin) — instantané
  for (const s of secteurs) {
    const geom = POLYGONES_SECTEURS[s.nom];
    if (geom && dansGeometrie(lon, lat, geom)) {
      return { secteur: s, methode: 'polygone' };
    }
  }
  // 2. Contours communaux pour les autres secteurs
  const communes = [...new Set(secteurs.map(s => s.commune))];
  for (const commune of communes) {
    const code = COMMUNES_INSEE[commune];
    if (!code) continue;
    const gj = await fetchContourCommune(code);
    if (gj && dansGeometrie(lon, lat, gj.geometry || gj)) {
      // Si plusieurs secteurs partagent cette commune, on ne peut pas trancher
      const candidats = secteurs.filter(s => s.commune === commune);
      if (candidats.length === 1) return { secteur: candidats[0], methode: 'commune' };
      return { secteur: null, methode: 'commune', candidats };
    }
  }
  return { secteur: null, methode: null };
}

// historique.js — Historique multi-années

const COLLECTION_HISTORIQUE = "historique_saisons";
const SOUS_COLLECTION_ADRESSES = "adresses_chunks";
const TAILLE_CHUNK_ADRESSES = 300;
const TAILLE_BATCH_SUPPRESSION = 400; // marge sous la limite Firestore de 500 opérations

// Normalisation d'adresse, commune à l'archivage et à la consultation
function normAdresse(s) {
  return (s || '').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}

async function supprimerRefsParLots(refs) {
  let supprimes = 0;
  for (let i = 0; i < refs.length; i += TAILLE_BATCH_SUPPRESSION) {
    const batch = writeBatch(db);
    const lot = refs.slice(i, i + TAILLE_BATCH_SUPPRESSION);
    lot.forEach(ref => batch.delete(ref));
    await batch.commit();
    supprimes += lot.length;
  }
  return supprimes;
}

async function supprimerChunksAdresse(annee) {
  const snap = await getDocs(collection(db, COLLECTION_HISTORIQUE, String(annee), SOUS_COLLECTION_ADRESSES));
  return supprimerRefsParLots(snap.docs.map(d => d.ref));
}

async function lireChunksAdresse(annee) {
  const snap = await getDocs(collection(db, COLLECTION_HISTORIQUE, String(annee), SOUS_COLLECTION_ADRESSES));
  const adresses = {};
  for (const d of snap.docs) {
    const donnees = d.data()?.adresses || {};
    Object.assign(adresses, donnees);
  }
  return adresses;
}

async function archiverSaison(annee) {
  if (!annee || !/^\d{4}$/.test(String(annee))) throw new Error("Année invalide");
  const [secteurs, equipes, stats] = await Promise.all([lireSecteurs(), lireEquipes(), statsGlobalesTournee()]);

  // Détail par adresse : ce que chaque foyer a donné cette année-là
  const passages = await fsGetAll(COLLECTIONS.PASSAGES);
  const secteurNom = Object.fromEntries(secteurs.map(s => [s.id, s.nom]));
  const adresses = {};
  for (const p of passages) {
    const a = (p.adresse || '').trim();
    if (!a) continue;
    const clef = normAdresse(a);
    if (!clef) continue;
    // On conserve le passage le plus significatif (un don prime sur un refus)
    const existant = adresses[clef];
    const montant = p.statut === "don" ? Number(p.montant || 0) : 0;
    if (!existant || montant > (existant.m || 0)) {
      adresses[clef] = {
        a,
        s: p.statut,
        m: montant,
        sc: secteurNom[p.secteurId] || null
      };
    }
  }

  const entrees = Object.entries(adresses);
  const nbChunks = Math.ceil(entrees.length / TAILLE_CHUNK_ADRESSES);
  const snapshot = {
    annee: Number(annee),
    dateArchivage: new Date().toISOString(),
    totalCollecte: stats.totalCollecte,
    totalEspeces: stats.totalEspeces,
    totalCheques: stats.totalCheques,
    totalCarte: stats.totalCarte || 0,
    nbDons: stats.nbDons,
    nbPassages: stats.nbPassages,
    nbSecteursTotal: stats.nbSecteursTotal,
    nbSecteursTermines: stats.nbSecteursTermines,
    secteurs: secteurs.map(s => ({
      nom: s.nom, commune: s.commune, equipeNom: s.equipNom || null,
      totalCollecte: s.totalCollecte || 0, nbFoyersVisites: s.nbFoyersVisites || 0,
      nbFoyersAbsents: s.nbFoyersAbsents || 0, statut: s.statut
    })),
    equipes: stats.parEquipe.map(eq => ({ nom: eq.nom, montant: eq.montant, nbPassages: eq.nbPassages })),
    stockageAdresses: "chunks-v1",
    nbAdressesArchivees: entrees.length,
    nbChunksAdresses: nbChunks
  };

  // Écrire d'abord le résumé puis les chunks. Un ancien archivage de la même année
  // est nettoyé pour éviter de conserver des chunks obsolètes.
  await fsSet(COLLECTION_HISTORIQUE, String(annee), snapshot);
  await supprimerChunksAdresse(annee);
  for (let i = 0; i < entrees.length; i += TAILLE_CHUNK_ADRESSES) {
    const chunk = Object.fromEntries(entrees.slice(i, i + TAILLE_CHUNK_ADRESSES));
    const id = `chunk-${String(Math.floor(i / TAILLE_CHUNK_ADRESSES) + 1).padStart(4, '0')}`;
    await setDoc(doc(db, COLLECTION_HISTORIQUE, String(annee), SOUS_COLLECTION_ADRESSES, id), { adresses: chunk });
  }
  return { ...snapshot, adresses };
}

async function reinitialiserSaison() {
  const collections = [COLLECTIONS.SECTEURS, COLLECTIONS.EQUIPES, COLLECTIONS.PASSAGES, COLLECTIONS.PINS];
  const snaps = await Promise.all(collections.map(c => getDocs(collection(db, c))));
  const refs = snaps.flatMap(s => s.docs.map(d => d.ref));
  return supprimerRefsParLots(refs);
}

async function lireSaison(annee) { return fsGet(COLLECTION_HISTORIQUE, String(annee)); }

function comparerSaisons(a, b) {
  if (!a || !b) return null;
  const ecartTotal = a.totalCollecte - b.totalCollecte;
  const ecartPourcent = b.totalCollecte > 0 ? Math.round((ecartTotal / b.totalCollecte) * 1000) / 10 : null;
  const secteursB = Object.fromEntries((b.secteurs || []).map(s => [s.nom, s]));
  const comparaisonSecteurs = (a.secteurs || []).map(sA => {
    const sB = secteursB[sA.nom]; const ecart = sB ? sA.totalCollecte - sB.totalCollecte : null;
    const ecartPct = sB && sB.totalCollecte > 0 ? Math.round((ecart / sB.totalCollecte) * 1000) / 10 : null;
    return { nom:sA.nom, commune:sA.commune, montantA:sA.totalCollecte, montantB:sB?sB.totalCollecte:null, ecart, ecartPct, tendance:ecart===null?"nouveau":ecart>0?"hausse":ecart<0?"baisse":"stable" };
  });
  return { anneeA:a.annee, anneeB:b.annee, totalA:a.totalCollecte, totalB:b.totalCollecte, ecartTotal, ecartPourcent, comparaisonSecteurs:comparaisonSecteurs.sort((a,b)=>(b.ecart||0)-(a.ecart||0)), comparaisonEquipes:[] };
}

// ── Historique par adresse ───────────────────────────────────────
async function chargerHistoriqueAdresses() {
  const saisons = await lireToutesLesSaisons();
  const index = {};
  for (const s of saisons) {
    // Compatibilité avec les archives V1/V2 qui stockaient les adresses dans le document parent.
    const adresses = s.adresses || (s.stockageAdresses === "chunks-v1" ? await lireChunksAdresse(s.annee) : null);
    if (!adresses) continue;
    for (const [clef, d] of Object.entries(adresses)) {
      if (!index[clef]) index[clef] = [];
      index[clef].push({ annee: s.annee, adresse: d.a, statut: d.s, montant: d.m || 0, secteur: d.sc || null });
    }
  }
  for (const clef in index) index[clef].sort((a, b) => b.annee - a.annee);
  return index;
}

// Pour les sauvegardes complètes : réintègre les chunks d'adresse dans le JSON exporté.
async function exporterHistoriqueComplet() {
  const saisons = await lireToutesLesSaisons();
  return Promise.all(saisons.map(async s => {
    if (s.adresses || s.stockageAdresses !== "chunks-v1") return s;
    return { ...s, adresses: await lireChunksAdresse(s.annee) };
  }));
}

// Résumé court pour affichage : "2025 : 15 €" ou "2025 : refus"
function resumeHistorique(entrees) {
  if (!entrees || entrees.length === 0) return null;
  return entrees.map(e => {
    if (e.statut === "don")    return `${e.annee} : ${e.montant.toFixed(2).replace('.', ',')} €`;
    if (e.statut === "offert") return `${e.annee} : offert`;
    if (e.statut === "refuse") return `${e.annee} : refus`;
    return `${e.annee} : absent`;
  });
}

const PALIERS = [

];
function getPalier(pct) { return PALIERS.find(p=>pct>=p.seuil)||PALIERS[PALIERS.length-1]; }
function pourcentCompletionEquipe(equipeId, secteurs) {
  const s = secteurs.filter(s=>s.equipeId===equipeId);
  if (!s.length) return 0;
  return Math.round((s.filter(s=>s.statut==="termine").length/s.length)*100);
}
const BADGES = [
  { id:"pionnier",      icone:"🚀", nom:"Pionnier",          description:"Première équipe à clôturer un secteur",    test:(eq,ctx)=>ctx.premierATerminer===eq.id },
  { id:"top_collecteur",icone:"💰", nom:"Top collecteur",    description:"Équipe en tête du classement",             test:(eq,ctx)=>ctx.classement[0]?.id===eq.id&&ctx.classement[0]?.montant>0 },
  { id:"sans_faute",    icone:"🎯", nom:"Sans faute",        description:"Meilleur taux de dons (peu de refus)",     test:(eq,ctx)=>{ if(eq.nbPassages<5)return false; const t=eq.nbRefus/eq.nbPassages; return ctx.meilleurTauxRefus!==null&&t===ctx.meilleurTauxRefus&&t<0.15; } },
  { id:"serie_3",       icone:"🔥", nom:"Série de 3",        description:"3 secteurs ou plus terminés",              test:(eq,ctx)=>ctx.secteursTerminesParEquipe[eq.id]>=3 },
  { id:"palier_500",    icone:"🌟", nom:"Cap des 500€",      description:"A dépassé 500€ collectés",                 test:(eq)=>eq.montant>=500 },
  { id:"palier_1000",   icone:"💎", nom:"Cap des 1000€",     description:"A dépassé 1000€ collectés",                test:(eq)=>eq.montant>=1000 },
  { id:"complet",       icone:"🏁", nom:"Mission accomplie", description:"100% des secteurs assignés terminés",      test:(eq,ctx)=>ctx.pourcentParEquipe[eq.id]===100&&ctx.secteursParEquipe[eq.id]>0 }
];
function calculerBadges(parEquipe, secteurs, passages) {
  const classement = [...parEquipe].sort((a,b)=>b.montant-a.montant);
  const secteursTerminesParEquipe={}, secteursParEquipe={}, pourcentParEquipe={};
  parEquipe.forEach(eq=>{
    const s=secteurs.filter(s=>s.equipeId===eq.id);
    secteursParEquipe[eq.id]=s.length;
    secteursTerminesParEquipe[eq.id]=s.filter(s=>s.statut==="termine").length;
    pourcentParEquipe[eq.id]=pourcentCompletionEquipe(eq.id,secteurs);
  });
  const premierATerminer = secteurs.filter(s=>s.statut==="termine"&&s.dateFin).sort((a,b)=>new Date(a.dateFin)-new Date(b.dateFin))[0]?.equipeId||null;
  const tauxRefus = parEquipe.map(eq=>eq.nbPassages>=5?(eq.nbRefus||0)/eq.nbPassages:null).filter(t=>t!==null);
  const meilleurTauxRefus = tauxRefus.length>0?Math.min(...tauxRefus):null;
  const ctx = { classement, secteursTerminesParEquipe, secteursParEquipe, pourcentParEquipe, premierATerminer, meilleurTauxRefus };
  const resultats={};
  parEquipe.forEach(eq=>{ resultats[eq.id]=BADGES.filter(b=>{ try{return b.test(eq,ctx);}catch(e){return false;} }); });
  return resultats;
}
function detecterNouveauxBadges(avant, apres) {
  const nouveaux=[];
  for (const equipeId in apres) {
    const avantIds=(avant[equipeId]||[]).map(b=>b.id);
    apres[equipeId].forEach(badge=>{ if(!avantIds.includes(badge.id)) nouveaux.push({equipeId,badge}); });
  }
  return nouveaux;
}
function getPodium(parEquipe) { return [...parEquipe].sort((a,b)=>b.montant-a.montant).slice(0,3); }

// Chargement dynamique de jsPDF + autoTable (CDN, pas de dépendance serveur)

let _pdfLoading = null;
function chargerJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if (_pdfLoading) return _pdfLoading;
  _pdfLoading = new Promise((resolve, reject) => {
    const s1 = document.createElement("script");
    s1.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js";
    s1.onload = () => {
      const s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.8/jspdf.plugin.autotable.min.js";
      s2.onload = () => resolve();
      s2.onerror = () => reject(new Error("Impossible de charger jspdf-autotable"));
      document.head.appendChild(s2);
    };
    s1.onerror = () => reject(new Error("Impossible de charger jsPDF"));
    document.head.appendChild(s1);
  });
  return _pdfLoading;
}

const COULEUR_ROUGE = [204, 29, 29];

// ── Génère le PDF du bilan complet ──────────────────────────────

  y += 30;
  doc.setDrawColor(...COULEUR_ROUGE);
  doc.setLineWidth(0.8);
  doc.line(15, y, pageW - 15, y);
  y += 10;

  // ── Chiffres clés ──
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.setTextColor(...COULEUR_ARDOISE);
  doc.text("Chiffres cles", 15, y);
  y += 7;

  const cles = [

  doc.autoTable({

  doc.text("Bilan par equipe", 15, y);

  const lignesEquipes = (stats.parEquipe || [])
    .filter(eq => eq.nbPassages > 0 || eq.montant > 0)
    .map((eq, i) => [String(i + 1), eq.nom, fmtEuro(eq.montant), String(eq.nbPassages), String(eq.nbRefus || 0)]);

  if (lignesEquipes.length > 0) {
    doc.autoTable({
      startY: y + 2,
      head: [["#", "Equipe", "Collecte", "Passages", "Refus"]],
      body: lignesEquipes,
      theme: "striped",
      headStyles: { fillColor: COULEUR_ROUGE, textColor: [255, 255, 255], fontStyle: "bold", fontSize: 9 },
      styles: { fontSize: 9, cellPadding: 2 },
      columnStyles: { 0: { cellWidth: 10 }, 2: { halign: "right", fontStyle: "bold" }, 3: { halign: "center" }, 4: { halign: "center" } },
      margin: { left: 15, right: 15 }
    });
    y = doc.lastAutoTable.finalY + 12;
  } else {
    doc.setFont("helvetica", "italic");
    doc.setFontSize(9);
    doc.setTextColor(...COULEUR_GRIS);
    doc.text("Aucune equipe active pour le moment.", 15, y + 8);
    y += 16;
  }

  // ── Bilan par secteur (nouvelle page si besoin) ──
  if (y > 220) { doc.addPage(); y = 20; }
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.setTextColor(...COULEUR_ARDOISE);
  doc.text("Bilan par secteur", 15, y);

  const lignesSecteurs = [...(secteurs || [])]
    .sort((a, b) => (b.totalCollecte || 0) - (a.totalCollecte || 0))
    .map(s => [
      s.nom || "",
      s.commune || "",
      s.equipNom || "-",
      fmtEuro(s.totalCollecte),
      String(s.nbFoyersVisites || 0),
      String(s.nbFoyersAbsents || 0)
    ]);

  doc.autoTable({
    startY: y + 6,
    head: [["Secteur", "Commune", "Equipe", "Collecte", "Visites", "Absents"]],
    body: lignesSecteurs,
    theme: "striped",
    headStyles: { fillColor: COULEUR_ARDOISE, textColor: [255, 255, 255], fontStyle: "bold", fontSize: 9 },
    styles: { fontSize: 8, cellPadding: 1.8 },
    columnStyles: { 3: { halign: "right", fontStyle: "bold" }, 4: { halign: "center" }, 5: { halign: "center" } },
    margin: { left: 15, right: 15 }
  });
  y = doc.lastAutoTable.finalY + 12;

  // ── Foyers à relancer ──
  const relances = (passages || []).filter(p => p.aRelancer);
  if (relances.length > 0) {
    if (y > 230) { doc.addPage(); y = 20; }
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.setTextColor(...COULEUR_ARDOISE);
    doc.text(`Foyers a relancer (${relances.length})`, 15, y);

    const secteurMap = Object.fromEntries((secteurs || []).map(s => [s.id, s]));
    doc.autoTable({
      startY: y + 6,
      head: [["Equipe", "Secteur", "Commune", "Adresse", "Note"]],
      body: relances.map(p => {
        const s = secteurMap[p.secteurId] || {};
        return [p.equipeNom || "", s.nom || "", s.commune || "", p.adresse || "", p.note || ""];
      }),
      theme: "grid",
      headStyles: { fillColor: [234, 179, 8], textColor: [60, 40, 0], fontStyle: "bold", fontSize: 9 },
      styles: { fontSize: 8, cellPadding: 1.8 },
      margin: { left: 15, right: 15 }
    });
  }

  // ── Pied de page sur toutes les pages ──
  const nbPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= nbPages; i++) {
    doc.setPage(i);
    const pageH = doc.internal.pageSize.getHeight();
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(...COULEUR_GRIS);
    doc.text("Amicale des Sapeurs-Pompiers de Pacy-sur-Eure  -  SDIS 27", 15, pageH - 10);
    doc.text(`Page ${i} / ${nbPages}`, pageW - 15, pageH - 10, { align: "right" });
  }

  return doc;
}

// Vérifie la disponibilité de l'API Web Speech
function vocalDisponible() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

// ── Analyse une phrase dictée et en extrait les infos structurées ──
// Exemples reconnus :
//   "don 20 euros espèces"        → { statut:'don', montant:20, mode:'especes' }
//   "don de 15 euros par chèque"  → { statut:'don', montant:15, mode:'cheque' }
//   "don 30 carte bancaire"       → { statut:'don', montant:30, mode:'carte' }
//   "refus"                       → { statut:'refuse' }
//   "absent"                      → { statut:'absent' }
//   "absent à relancer"           → { statut:'absent', aRelancer:true }
//   "12 rue de la mairie don 10 euros" → { adresse:'12 rue de la mairie', statut:'don', montant:10 }
function analyserPhrase(texte) {
  if (!texte) return null;
  const t = texte.toLowerCase().trim();
  const res = { texteBrut: texte };

  // ── Statut ──
  if (/\b(refus|refuse|refusé|refuser|rien|pas de don)\b/.test(t)) {
    res.statut = "refuse";
  } else if (/\b(absent|absente|personne|pas la|pas là|vide)\b/.test(t)) {
    res.statut = "absent";
    if (/\b(relanc|repass|revenir|retour)\w*/.test(t)) res.aRelancer = true;
  } else if (/\b(don|donne|donné|payé|paie|paye|verse|versé|euros?|€)\b/.test(t)) {
    res.statut = "don";
  }

  // ── Adresse (extraite EN PREMIER pour ne pas confondre le n° de rue avec le montant) ──
  let resteTexte = t;
  const matchAdresse = t.match(/^(\d+\s+(?:bis\s+|ter\s+)?(?:rue|avenue|av|boulevard|bd|place|impasse|chemin|route|all[ée]e|square|lotissement|hameau|ferme|r[ée]sidence)\s+[a-zàâäéèêëïîôöùûüç'\s-]+?)(?=\s+(?:don|refus|absent|personne|rien)|$)/i);
  if (matchAdresse) {
    res.adresse = matchAdresse[1].trim();
    resteTexte = t.slice(matchAdresse[0].length).trim();
  } else {
    const matchNumSeul = t.match(/^(\d+)\s+(?=don|refus|absent|personne)/);
    if (matchNumSeul) {
      res.adresse = matchNumSeul[1];
      resteTexte = t.slice(matchNumSeul[0].length).trim();
    }
  }

  // ── Montant (cherché uniquement dans le reste, après l'adresse) ──
  // Gère "20", "20 euros", "vingt euros", "10,50", "10.50"
  const motsChiffres = {
    "zero":0,"zéro":0,"un":1,"une":1,"deux":2,"trois":3,"quatre":4,"cinq":5,
    "six":6,"sept":7,"huit":8,"neuf":9,"dix":10,"onze":11,"douze":12,"treize":13,
    "quatorze":14,"quinze":15,"seize":16,"vingt":20,"trente":30,"quarante":40,
    "cinquante":50,"soixante":60,"cent":100,"cents":100,"mille":1000
  };

  // D'abord chercher un nombre écrit en chiffres
  const matchNum = resteTexte.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:euros?|€)?/);
  if (matchNum) {
    res.montant = parseFloat(matchNum[1].replace(",", "."));
  } else {
    // Sinon tenter les nombres en lettres (simple : un seul mot ou "vingt cinq")
    const mots = resteTexte.split(/\s+/);
    let total = 0, trouve = false;
    for (let i = 0; i < mots.length; i++) {
      const m = mots[i].replace(/[^a-zàâäéèêëïîôöùûüç]/g, "");
      if (motsChiffres[m] !== undefined) {
        const val = motsChiffres[m];
        // "vingt cinq" = 25, "cent cinquante" = 150
        if (val >= 100 && total > 0) total *= val;
        else total += val;
        trouve = true;
      }
    }
    if (trouve && total > 0) res.montant = total;
  }

  // ── Mode de paiement ──
  if (/\b(ch[eè]que|cheques?)\b/.test(t))                        res.mode = "cheque";
  else if (/\b(carte|cb|bancaire|sumup|sum up)\b/.test(t))       res.mode = "carte";
  else if (/\b(esp[eè]ces?|liquide|cash|billet|pi[eè]ce)\w*\b/.test(t)) res.mode = "especes";

  return res;
}

// ── Lance l'écoute vocale ──────────────────────────────────────
// onResult(analyse, texteBrut) — appelé quand une phrase est reconnue
// onError(message) — appelé en cas d'erreur
// onStateChange(enEcoute) — appelé au début/fin d'écoute
function ecouterVocal({ onResult, onError, onStateChange }) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    onError && onError("La reconnaissance vocale n'est pas disponible sur ce navigateur.");
    return null;
  }

  const recognition = new SR();
  recognition.lang = "fr-FR";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { onStateChange && onStateChange(true); };
  recognition.onend   = () => { onStateChange && onStateChange(false); };

  recognition.onresult = (event) => {
    const texte = event.results[0][0].transcript;
    const analyse = analyserPhrase(texte);
    onResult && onResult(analyse, texte);
  };

  recognition.onerror = (event) => {
    const messages = {
      "no-speech":        "Aucune parole détectée, réessaie.",
      "audio-capture":    "Micro inaccessible. Vérifie les autorisations.",
      "not-allowed":      "Accès au micro refusé. Autorise-le dans les réglages du navigateur.",
      "network":          "Erreur réseau — la reconnaissance vocale nécessite une connexion.",
      "aborted":          null // annulation volontaire, pas d'erreur à afficher
    };
    const msg = messages[event.error];
    if (msg) onError && onError(msg);
    onStateChange && onStateChange(false);
  };

  try {
    recognition.start();
  } catch(e) {
    onError && onError("Impossible de démarrer l'écoute : " + e.message);
    return null;
  }

  return recognition;
}


// ── Rues partagées entre deux secteurs ───────────────────────────
// Syntaxe dans le champ "rues" : "Rue Aristide Briand [1,2,4,6,7]"
// Seuls les numéros listés appartiennent au secteur.
function parseRueEntry(entry) {
  const m = (entry || '').match(/^(.*?)\s*\[([^\]]*)\]\s*$/);
  if (!m) return { rue: (entry || '').trim(), numeros: null };
  return {
    rue: m[1].trim(),
    numeros: m[2].split(',').map(x => x.trim()).filter(Boolean)
  };
}

function normRueG(s) {
  return (s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}

// Distance en mètres entre deux points GPS (formule haversine)
function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Vérifie si la géolocalisation est disponible
function geolocDisponible() {
  return 'geolocation' in navigator;
}

// Récupère la position actuelle
function positionActuelle(options = {}) {
  return new Promise((resolve, reject) => {
    if (!geolocDisponible()) {
      reject(new Error("Géolocalisation non disponible sur cet appareil"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        precision: Math.round(pos.coords.accuracy)
      }),
      err => {
        const msgs = {
          1: "Accès à la position refusé. Autorise-le dans les réglages.",
          2: "Position indisponible. Vérifie que le GPS est activé.",
          3: "Recherche de position trop longue. Réessaie à l'extérieur."
        };
        reject(new Error(msgs[err.code] || "Erreur de géolocalisation"));
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000, ...options }
    );
  });
}

// Cherche les N adresses les plus proches d'une position
// commune : si précisée, limite la recherche à cette commune (plus rapide et pertinent)
function adressesProches(lat, lon, { commune = null, limite = 3, rayonMax = 300 } = {}) {
  const resultats = [];
  const communes = commune && GEO_ADRESSES[commune]
    ? { [commune]: GEO_ADRESSES[commune] }
    : GEO_ADRESSES;

  for (const [nomCommune, data] of Object.entries(communes)) {
    const rues = data.r;
    for (const [num, rueIdx, aLat, aLon] of data.p) {
      // Filtre grossier avant le calcul exact (optimisation)
      if (Math.abs(aLat - lat) > 0.004 || Math.abs(aLon - lon) > 0.006) continue;
      const d = distanceM(lat, lon, aLat, aLon);
      if (d <= rayonMax) {
        resultats.push({
          numero: num,
          rue: rues[rueIdx],
          commune: nomCommune,
          distance: Math.round(d),
          adresse: `${num} ${rues[rueIdx]}`
        });
      }
    }
  }

  resultats.sort((a, b) => a.distance - b.distance);
  return resultats.slice(0, limite);
}

// Recherche par texte (autocomplétion)
// Retourne les adresses correspondant à une saisie partielle
function chercherAdresses(saisie, { commune = null, limite = 8 } = {}) {
  const q = (saisie || '').toLowerCase().trim();
  if (q.length < 2) return [];

  // Extraire un éventuel numéro en début de saisie
  const mNum = q.match(/^(\d+[a-z]?)\s*(.*)$/);
  const numCherche = mNum ? mNum[1] : null;
  const texteRue = mNum ? mNum[2] : q;

  const resultats = [];
  const communes = commune && GEO_ADRESSES[commune]
    ? { [commune]: GEO_ADRESSES[commune] }
    : GEO_ADRESSES;

  for (const [nomCommune, data] of Object.entries(communes)) {
    const rues = data.r;
    // Trouver les rues qui correspondent au texte
    const ruesOk = new Set();
    rues.forEach((r, i) => {
      if (!texteRue || r.toLowerCase().includes(texteRue)) ruesOk.add(i);
    });
    if (ruesOk.size === 0) continue;

    for (const [num, rueIdx] of data.p) {
      if (!ruesOk.has(rueIdx)) continue;
      if (numCherche && !num.toLowerCase().startsWith(numCherche)) continue;
      resultats.push({
        numero: num, rue: rues[rueIdx], commune: nomCommune,
        adresse: `${num} ${rues[rueIdx]}`
      });
      if (resultats.length >= limite * 4) break;
    }
  }

  // Trier : numéro exact d'abord, puis par numéro croissant
  resultats.sort((a, b) => {
    const na = parseInt(a.numero) || 9999, nb = parseInt(b.numero) || 9999;
    if (a.rue !== b.rue) return a.rue.localeCompare(b.rue);
    return na - nb;
  });
  return resultats.slice(0, limite);
}

// Statistiques : nombre de foyers d'une rue ou d'une commune
function nbFoyers(commune, rue = null) {
  const data = GEO_ADRESSES[commune];
  if (!data) return 0;
  if (!rue) return data.p.length;
  const idx = data.r.indexOf(rue);
  if (idx === -1) return 0;
  return data.p.filter(p => p[1] === idx).length;
}

// Liste des numéros d'une rue (pour la liste à cocher)
function numerosDeRue(commune, rue, restriction = null) {
  const data = GEO_ADRESSES[commune];
  if (!data) return [];
  const cible = normRueG(rue);
  const idx = data.r.findIndex(r => normRueG(r) === cible);
  if (idx === -1) return [];
  let nums = data.p.filter(p => p[1] === idx).map(p => p[0]);
  if (Array.isArray(restriction)) {
    const ok = new Set(restriction.map(normRueG));
    nums = nums.filter(n => ok.has(normRueG(n)));
  }
  return [...new Set(nums)].sort((a, b) => (parseInt(a)||9999) - (parseInt(b)||9999));
}

// Nombre total de boîtes aux lettres d'un secteur (somme de ses rues)
// secteur : objet avec .commune et .rues[]
function nbFoyersSecteur(secteur) {
  if (!secteur || !secteur.commune) return 0;
  const data = GEO_ADRESSES[secteur.commune];
  if (!data) return 0;
  if (!secteur.rues || secteur.rues.length === 0) return data.p.length;

  // Construire la table : index de rue → liste de numéros autorisés (null = tous)
  const filtre = {};
  for (const entry of secteur.rues) {
    const { rue, numeros } = parseRueEntry(entry);
    const cible = normRueG(rue);
    data.r.forEach((r, i) => {
      if (normRueG(r) !== cible) return;
      if (numeros === null) { filtre[i] = null; }
      else if (filtre[i] !== null) {
        filtre[i] = [...(filtre[i] || []), ...numeros.map(normRueG)];
      }
    });
  }

  let n = 0;
  for (const p of data.p) {
    if (!(p[1] in filtre)) continue;
    const autorises = filtre[p[1]];
    if (autorises === null || autorises.includes(normRueG(p[0]))) n++;
  }
  return n;
}

// Liste les rues d'un secteur avec leur nombre de foyers, triées alphabétiquement
function ruesDuSecteur(secteur) {
  if (!secteur || !secteur.commune) return [];
  const data = GEO_ADRESSES[secteur.commune];
  if (!data) return [];

  // Filtre par rue, avec numéros autorisés éventuels
  const filtre = {};
  if (secteur.rues && secteur.rues.length > 0) {
    for (const entry of secteur.rues) {
      const { rue, numeros } = parseRueEntry(entry);
      const cible = normRueG(rue);
      data.r.forEach((r, i) => {
        if (normRueG(r) !== cible) return;
        if (numeros === null) filtre[i] = null;
        else if (filtre[i] !== null) filtre[i] = [...(filtre[i] || []), ...numeros.map(normRueG)];
      });
    }
  } else {
    data.r.forEach((_, i) => { filtre[i] = null; });
  }

  const compte = {};
  for (const p of data.p) {
    if (!(p[1] in filtre)) continue;
    const a = filtre[p[1]];
    if (a === null || a.includes(normRueG(p[0]))) compte[p[1]] = (compte[p[1]] || 0) + 1;
  }

  return Object.entries(compte)
    .map(([i, n]) => ({ rue: data.r[i], foyers: n, restriction: filtre[i] }))
    .sort((a, b) => a.rue.localeCompare(b.rue, 'fr'));
}

const CLE_INSTALL_REFUS = "sp_install_refuse";

// L'app tourne-t-elle déjà en mode installé ?
function dejaInstallee() {
  return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: minimal-ui)').matches
      || window.navigator.standalone === true;
}

function estIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// Chrome/Android fournit un événement d'installation ; iOS non.
let _promptInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _promptInstall = e;
  proposerInstallation();
});

function refusEnregistre() {
  const v = localStorage.getItem(CLE_INSTALL_REFUS);
  if (!v) return false;
  // On ne represente la proposition qu'après 14 jours
  return (Date.now() - Number(v)) < 14 * 86400000;
}

function fermerBanniere(memoriser) {
  if (memoriser) localStorage.setItem(CLE_INSTALL_REFUS, String(Date.now()));
  document.getElementById('install-banniere')?.remove();
}

function proposerInstallation() {
  if (dejaInstallee() || refusEnregistre()) return;
  if (document.getElementById('install-banniere')) return;
  // Ni prompt Android disponible, ni iOS → rien à proposer
  if (!_promptInstall && !estIOS()) return;

  const el = document.createElement('div');
  el.id = 'install-banniere';
  el.className = 'install-banniere';
  el.innerHTML = estIOS() && !_promptInstall
    ? `<div class="ib-corps">
         <img src="./icons/icon-96.png" alt="" class="ib-icone">
         <div class="ib-txt">
           <strong>Installer l'application</strong>
           <span>Appuie sur <b>Partager</b> ⬆️ puis <b>Sur l'écran d'accueil</b></span>
         </div>
       </div>
       <button class="ib-fermer" data-action="plus-tard">Plus tard</button>`
    : `<div class="ib-corps">
         <img src="./icons/icon-96.png" alt="" class="ib-icone">
         <div class="ib-txt">
           <strong>Installer l'application</strong>
           <span>Accès direct depuis l'écran d'accueil, même hors réseau</span>
         </div>
       </div>
       <div class="ib-actions">
         <button class="ib-installer" data-action="installer">Installer</button>
         <button class="ib-fermer" data-action="plus-tard">Plus tard</button>
       </div>`;

  document.body.appendChild(el);

  el.addEventListener('click', async (ev) => {
    const act = ev.target.dataset?.action;
    if (act === 'plus-tard') { fermerBanniere(true); return; }
    if (act === 'installer' && _promptInstall) {
      const p = _promptInstall;
      _promptInstall = null;
      fermerBanniere(false);
      try {
        await p.prompt();
        const choix = await p.userChoice;
        if (choix.outcome !== 'accepted') localStorage.setItem(CLE_INSTALL_REFUS, String(Date.now()));
      } catch(e) { /* l'utilisateur a fermé la boîte système */ }
    }
  });
}

// Sur iOS, aucun événement : on propose après quelques secondes d'utilisation
if (estIOS() && !dejaInstallee()) {
  setTimeout(proposerInstallation, 4000);
}

// Confirmation d'installation réussie
window.addEventListener('appinstalled', () => {
  fermerBanniere(false);
  localStorage.removeItem(CLE_INSTALL_REFUS);
});

let _registration = null;
let _banniereAffichee = false;

// Affiche le bandeau proposant de recharger
function proposerMiseAJour(worker) {
  if (_banniereAffichee) return;
  _banniereAffichee = true;

  const el = document.createElement('div');
  el.id = 'maj-banniere';
  el.className = 'maj-banniere';
  el.innerHTML = `
    <span class="mj-txt">✨ <strong>Nouvelle version disponible</strong></span>
    <div class="mj-actions">
      <button class="mj-recharger">Mettre à jour</button>
      <button class="mj-plus-tard">Plus tard</button>
    </div>`;
  document.body.appendChild(el);

  el.querySelector('.mj-recharger').addEventListener('click', () => {
    el.querySelector('.mj-recharger').textContent = 'Mise à jour…';
    // Demander au nouveau Service Worker de prendre la main immédiatement
    if (worker) worker.postMessage({ type: 'ACTIVER_MAINTENANT' });
    // Sécurité : recharger même si le message n'aboutit pas
    setTimeout(() => window.location.reload(), 1200);
  });

  el.querySelector('.mj-plus-tard').addEventListener('click', () => {
    el.remove();
    _banniereAffichee = false;
  });
}

// Surveille l'arrivée d'une nouvelle version
function surveillerMiseAJour(registration) {
  if (!registration) return;
  _registration = registration;

  // Une nouvelle version est déjà installée et attend
  if (registration.waiting && navigator.serviceWorker.controller) {
    proposerMiseAJour(registration.waiting);
  }

  // Une nouvelle version arrive pendant la session
  registration.addEventListener('updatefound', () => {});
  registration.onupdatefound = () => {
    const nouveau = registration.installing;
    if (!nouveau) return;
    nouveau.addEventListener('statechange', () => {
      if (nouveau.state === 'installed' && navigator.serviceWorker.controller) {
        proposerMiseAJour(nouveau);
      }
    });
  };

  // Vérifier périodiquement (toutes les 30 min) et au retour au premier plan
  const verifier = () => { registration.update().catch(() => {}); };
  setInterval(verifier, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') verifier();
  });
}

// Recharger la page dès que le nouveau Service Worker prend le contrôle
let _rechargeFaite = false;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_rechargeFaite) return;
    _rechargeFaite = true;
    window.location.reload();
  });
}

// Exposition pour le script d'enregistrement (hors module ES)
window.__surveillerMAJ = surveillerMiseAJour;

// notifications.js — Notifications locales (résumé quotidien)
// Amicale SP Pacy-sur-Eure — Tournée Calendriers
// ============================================================


const CLE_DERNIER_RESUME = "sp_dernier_resume";
const CLE_HEURE_RESUME   = "sp_heure_resume";
const HEURE_DEFAUT       = 20; // 20h

// ── Support et permission ────────────────────────────────────────
function dateLocaleISO(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function notifsDisponibles() {
  return "Notification" in window;
}

function notifsPermission() {
  if (!notifsDisponibles()) return "unsupported";
  return Notification.permission; // "default" | "granted" | "denied"
}

async function demanderPermissionNotifs() {
  if (!notifsDisponibles()) throw new Error("Notifications non supportées par ce navigateur");
  const perm = await Notification.requestPermission();
  return perm; // "granted" | "denied" | "default"
}

// ── Réglages (stockés localement par appareil) ──────────────────
function getHeureResume() {
  const h = localStorage.getItem(CLE_HEURE_RESUME);
  return h !== null ? Number(h) : HEURE_DEFAUT;
}

function setHeureResume(heure) {
  const h = Math.max(0, Math.min(23, Number(heure) || HEURE_DEFAUT));
  localStorage.setItem(CLE_HEURE_RESUME, String(h));
  return h;
}

function resumeDejaEnvoyeAujourdhui() {
  const dernier = localStorage.getItem(CLE_DERNIER_RESUME);
  const aujourdhui = dateLocaleISO();
  return dernier === aujourdhui;
}

function marquerResumeEnvoye() {
  localStorage.setItem(CLE_DERNIER_RESUME, dateLocaleISO());
}

// ── Construction du texte du résumé ─────────────────────────────
// stats : retour de statsGlobalesTournee()
// passages : liste complète des passages
function construireResume(stats, passages) {
  const aujourdhui = dateLocaleISO();
  const passagesDuJour = (passages || []).filter(p => (p.datePassage || "").slice(0, 10) === aujourdhui);

  let collecteDuJour = 0;
  let donsDuJour = 0;
  for (const p of passagesDuJour) {
    if (p.statut === "don") { collecteDuJour += Number(p.montant || 0); donsDuJour++; }
  }

  const fmt = (v) => Number(v || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2 }) + " €";

  const lignes = [
    `Aujourd'hui : ${fmt(collecteDuJour)} (${donsDuJour} don${donsDuJour > 1 ? "s" : ""}, ${passagesDuJour.length} passage${passagesDuJour.length > 1 ? "s" : ""})`,
    `Cumul tournée : ${fmt(stats.totalCollecte)}`,
    `Avancement : ${stats.nbSecteursTermines}/${stats.nbSecteursTotal} secteurs (${stats.avancement}%)`
  ];

  // Top 3 équipes du jour
  const parEquipeJour = {};
  for (const p of passagesDuJour) {
    if (p.statut === "don" && p.equipeNom) {
      parEquipeJour[p.equipeNom] = (parEquipeJour[p.equipeNom] || 0) + Number(p.montant || 0);
    }
  }
  const top = Object.entries(parEquipeJour).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (top.length > 0) {
    lignes.push("Top du jour : " + top.map(([nom, m], i) => `${i + 1}. ${nom} ${fmt(m)}`).join(" · "));
  }

  return {
    titre: `Tournée calendriers — ${fmt(collecteDuJour)} aujourd'hui`,
    corps: lignes.join("\n"),
    collecteDuJour,
    donsDuJour,
    nbPassagesJour: passagesDuJour.length,
    lignes
  };
}

// ── Affiche la notification système ─────────────────────────────
function afficherNotification(titre, corps, iconeBase64 = null) {
  if (!notifsDisponibles() || Notification.permission !== "granted") return false;
  try {
    const options = {
      body: corps,
      tag: "resume-quotidien-sp",   // remplace la précédente au lieu d'empiler
      requireInteraction: false,
      silent: false
    };
    if (iconeBase64) options.icon = iconeBase64;
    new Notification(titre, options);
    return true;
  } catch(e) {
    console.warn("Notification impossible :", e);
    return false;
  }
}

// ── Planificateur : vérifie toutes les minutes si l'heure est venue ──
// getDonnees : fonction async qui retourne { stats, passages }
// Retourne une fonction d'arrêt
function planifierResumeQuotidien(getDonnees, iconeBase64 = null) {
  let arrete = false;

  async function verifier() {
    if (arrete) return;
    if (Notification.permission !== "granted") return;
    if (resumeDejaEnvoyeAujourdhui()) return;

    const maintenant = new Date();
    const heureCible = getHeureResume();

    // On déclenche dès qu'on atteint ou dépasse l'heure cible
    if (maintenant.getHours() >= heureCible) {
      try {
        const { stats, passages } = await getDonnees();
        const resume = construireResume(stats, passages);
        const ok = afficherNotification(resume.titre, resume.corps, iconeBase64);
        if (ok) marquerResumeEnvoye();
      } catch(e) {
        console.warn("Erreur résumé quotidien :", e);
      }
    }
  }

  // Vérification immédiate puis toutes les minutes
  verifier();
  const interval = setInterval(verifier, 60000);

  return () => { arrete = true; clearInterval(interval); };
}

// ── Envoi manuel du résumé (bouton "Tester / Envoyer maintenant") ──
async function envoyerResumeMaintenant(getDonnees, iconeBase64 = null) {
  if (Notification.permission !== "granted") {
    const perm = await demanderPermissionNotifs();
    if (perm !== "granted") throw new Error("Permission refusée");
  }
  const { stats, passages } = await getDonnees();
  const resume = construireResume(stats, passages);
  const ok = afficherNotification(resume.titre, resume.corps, iconeBase64);
  if (!ok) throw new Error("Impossible d'afficher la notification");
  return resume;
}

const ACTIONS = {
  MODIFICATION: "modification",
  SUPPRESSION:  "suppression",
  FUSION:       "fusion",
  INHABITEE:    "inhabitee"
};

const ACTION_LABEL = {
  modification: "Correction",
  suppression:  "Suppression",
  fusion:       "Regroupement",
  inhabitee:    "Marqué inhabité"
};

// Résumé lisible d'un passage, pour garder une trace de ce qui a été touché
function resumer(p) {
  if (!p) return "";
  const bouts = [];
  if (p.adresse) bouts.push(p.adresse);
  if (p.statut === "don")         bouts.push(`don ${Number(p.montant || 0).toFixed(2)} €`);
  else if (p.statut === "offert") bouts.push("offert");
  else if (p.statut === "refuse") bouts.push("refus");
  else if (p.statut === "absent" || p.statut === "relance") bouts.push("absent");
  if (p.modePaiement) bouts.push(p.modePaiement);
  return bouts.join(" · ");
}

// Enregistre une entrée. N'échoue jamais bruyamment : la traçabilité ne doit
// pas empêcher un équipier de travailler si l'écriture échoue.
async function tracer(action, { avant = null, apres = null, contexte = "", auteur = null } = {}) {
  try {
    const a = auteur || {};
    await fsAdd(COLLECTIONS.JOURNAL, {
      action,
      date: new Date().toISOString(),
      parQui: a.membre || a.email || a.equipeNom || "inconnu",
      equipeNom: a.equipeNom || null,
      role: a.role || null,
      contexte,
      avant: avant ? resumer(avant) : null,
      apres: apres ? resumer(apres) : null,
      montantAvant: avant && avant.statut === "don" ? Number(avant.montant || 0) : 0,
      montantApres: apres && apres.statut === "don" ? Number(apres.montant || 0) : 0,
      secteurId: (apres && apres.secteurId) || (avant && avant.secteurId) || null
    });
  } catch (e) {
    console.warn("Journal indisponible :", e?.message || e);
  }
}

// Lecture, du plus récent au plus ancien
async function lireJournal({ limite = 300 } = {}) {
  const tout = await fsGetAll(COLLECTIONS.JOURNAL);
  return tout
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
    .slice(0, limite);
}

// Purge des entrées antérieures à une date (nettoyage de fin de saison)
async function purgerJournal(avantISO) {
  const tout = await fsGetAll(COLLECTIONS.JOURNAL);
  let n = 0;
  for (const e of tout) {
    if ((e.date || "") < avantISO) { await fsDelete(COLLECTIONS.JOURNAL, e.id); n++; }
  }
  return n;
}

// Vide entièrement le journal
async function viderJournal() {
  const tout = await fsGetAll(COLLECTIONS.JOURNAL);
  let n = 0;
  for (const e of tout) {
    try { await fsDelete(COLLECTIONS.JOURNAL, e.id); n++; } catch(err) { /* on continue */ }
  }
  return n;
}

// Écart financier cumulé induit par les corrections (indicateur de contrôle)
function ecartCumule(entrees) {
  return entrees.reduce((s, e) => s + ((e.montantApres || 0) - (e.montantAvant || 0)), 0);
}

// ── Utilitaires DOM ───────────────────────────────────────────
const $  = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
const show = (...els) => els.forEach(e => e && e.classList.remove("hidden"));
const hide = (...els) => els.forEach(e => e && e.classList.add("hidden"));

function toast(msg, type = "info") {
  const t = document.createElement("div");
  t.className = `toast toast--${type}`;
  t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function setLoading(btn, loading) {
  if (!btn) return;
  if (loading) { btn.dataset.orig = btn.textContent; btn.textContent = "…"; btn.disabled = true; }
  else { btn.textContent = btn.dataset.orig || btn.textContent; btn.disabled = false; }
}

// Échappement systématique des données affichées via innerHTML.
// Les valeurs venant de Firestore ou des saisies utilisateur ne doivent jamais
// être interprétées comme du HTML exécutable.
function h(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Argument JavaScript sûr lorsqu'une ancienne portion d'interface utilise encore
// un gestionnaire onclick inline. Le JSON est ensuite échappé pour l'attribut HTML.
function ja(value) {
  return h(JSON.stringify(String(value ?? "")));
}

function dateLocaleISO(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function heureLocale(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function formatMontant(val) {
  return Number(val || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2 }) + " €";
}

// ── Badge état réseau (hors-ligne / synchro) ──────────────────
function renderNetworkBadge() {
  return `<span id="network-badge" class="network-badge ${isOnline() ? 'network-badge--online' : 'network-badge--offline'}">${isOnline() ? '🟢 En ligne' : '🔴 Hors-ligne'}</span>`;
}

function bindNetworkBadge() {
  const badge = document.getElementById("network-badge");
  if (!badge) return () => {};
  return onNetworkChange((online) => {
    const b = document.getElementById("network-badge");
    if (!b) return;
    b.textContent = online ? '🟢 En ligne' : '🔴 Hors-ligne';
    b.className = `network-badge ${online ? 'network-badge--online' : 'network-badge--offline'}`;
    if (online) toast("Connexion rétablie — synchronisation en cours…", "success");
    else toast("Mode hors-ligne — tes saisies seront synchronisées au retour du réseau", "info");
  });
}

function stopUnsubs() {
  APP.unsubs.forEach(fn => fn && fn());
  APP.unsubs = [];
}

// ── Routing par hash ──────────────────────────────────────────
const ROUTES = {
  "#login":              renderLogin,
  "#dashboard":          renderDashboard,
  "#secteurs":           renderSecteurs,
  "#equipes":            renderEquipes,
  "#passages":           renderPassages,
  "#relances":           renderRelances,
  "#historique":         renderHistorique,
  "#classement":         renderClassement,
  "#statistiques":       renderStatistiques,
  "#journal":            renderJournal,
  "#config":             renderConfig,
  "#terrain":            renderTerrain,
  "#terrain-passages":   renderTerrainPassages
};

function naviguer(hash) {
  window.location.hash = hash;
}

window.addEventListener("hashchange", () => {
  const hash = window.location.hash || "#login";
  const fn   = ROUTES[hash];
  if (fn) fn();
  else renderLogin();
});

// ── Bootstrap ─────────────────────────────────────────────────
// Gérer le retour de redirection Google Auth
getLoginRedirect().then(async (result) => {
  if (result?.user) {
    const admin = await isAdmin(result.user.email);
    if (!admin) {
      toast("Accès refusé : email non autorisé", "error");
      await logoutGoogle();
    }
    // onAuth prend le relais pour router
  }
}).catch((e) => {
  if (e?.code !== "auth/no-auth-event") {
    console.warn("Redirect result error:", e?.message);
  }
});

onAuth(async (user) => {
  // ── Aucune session : en ouvrir une (anonyme) puis attendre le rappel ──
  if (!user) {
    try {
      await assurerSession();
      return;   // onAuth sera rappelé avec la session anonyme
    } catch(e) {
      toast("Impossible d'ouvrir une session. Vérifie ta connexion.", "error");
      naviguer("#login");
      return;
    }
  }

  // ── Session anonyme : c'est un équipier (ou un visiteur sur l'écran de connexion) ──
  if (user.isAnonymous) {
    const sessionEquipe = sessionStorage.getItem("equipe");
    if (sessionEquipe) {
      try {
        const eq = JSON.parse(sessionEquipe);
        APP.role = "equipier";
        APP.user = eq;
        APP.equipeId  = eq.id;
        APP.equipeNom = eq.nom;
        APP.membre    = sessionStorage.getItem("membre") || null;
        naviguer("#terrain");
        return;
      } catch(e) { sessionStorage.removeItem("equipe"); }
    }
    naviguer("#login");
    return;
  }

  // ── Session Google : vérifier les droits d'administration ──
  try {
    const admin = await isAdmin(user.email);
    if (admin) {
      APP.role = "admin";
      APP.user = user;
      demarrerPlanificateurResume();
      const hash = window.location.hash;
      naviguer(ROUTES[hash] && hash !== "#login" ? hash : "#dashboard");
      return;
    }
    toast("Accès refusé : " + user.email + " n'est pas administrateur.", "error");
    await logoutGoogle();
    await assurerSession();   // repasser en session anonyme pour l'accès équipier
  } catch(e) {
    toast("Erreur de vérification : " + e.message, "error");
    await logoutGoogle();
    await assurerSession();
  }
});

function bindLoginEvents() {
  // Tabs
  $$(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      $$(".tab-btn").forEach(b => b.classList.remove("tab-btn--active"));
      btn.classList.add("tab-btn--active");
      const tab = btn.dataset.tab;
      $$(".tab-panel").forEach(p => p.classList.add("hidden"));
      document.getElementById(`tab-${tab}`).classList.remove("hidden");
    });
  });

  // Google — signInWithPopup
  const btnGoogle = document.getElementById("btn-google");
  if (btnGoogle) {
    btnGoogle.addEventListener("click", async () => {
      setLoading(btnGoogle, true);
      try {
        const result = await loginGoogle();
        if (result?.user) {
          const admin = await isAdmin(result.user.email);
          if (admin) {
            APP.role = "admin";
            APP.user = result.user;
            naviguer("#dashboard");
          } else {
            toast("Accès refusé : " + result.user.email + " n\'est pas administrateur.", "error");
            await logoutGoogle();
            setLoading(btnGoogle, false);
          }
        }
      } catch (e) {
        if (e.code !== "auth/popup-closed-by-user") {
          toast("Erreur de connexion : " + e.message, "error");
        }
        setLoading(btnGoogle, false);
      }
    });
  }

  // PIN
  let pinSaisi = "";
  function updatePinDisplay() {
    const display = document.getElementById("pin-display");
    if (!display) return;
    display.textContent = pinSaisi.padEnd(4, "_");
  }

  $$(".pin-key").forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.dataset.key;
      if (key === "⌫") {
        pinSaisi = pinSaisi.slice(0, -1);
        updatePinDisplay();
        return;
      }
      if (key === "") return;
      if (pinSaisi.length >= 4) return;
      pinSaisi += key;
      updatePinDisplay();

      if (pinSaisi.length === 4) {
        const errEl = document.getElementById("pin-error");
        try {
          const equipe = await loginPin(pinSaisi);
          if (equipe) {
            APP.role = "equipier";
            APP.user = equipe;
            APP.equipeId  = equipe.id;
            APP.equipeNom = equipe.nom;
            sessionStorage.setItem("equipe", JSON.stringify(equipe));
            // Si l'équipe a plusieurs membres, demander qui se connecte
            const membres = (equipe.membres || []).filter(Boolean);
            if (membres.length > 1) {
              afficherChoixMembre(equipe, membres);
            } else {
              const seul = membres[0] || equipe.nom;
              APP.membre = seul;
              sessionStorage.setItem("membre", seul);
              naviguer("#terrain");
            }
          } else {
            errEl && errEl.classList.remove("hidden");
            pinSaisi = "";
            updatePinDisplay();
            setTimeout(() => errEl && errEl.classList.add("hidden"), 2500);
          }
        } catch(e) {
          toast("Erreur : " + e.message, "error");
          pinSaisi = "";
          updatePinDisplay();
        }
      }
    });
  });
}

function afficherChoixMembre(equipe, membres) {
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="login-wrap">

          <img src="${LOGO_SP}" alt="SP Pacy" style="width:64px;height:64px;object-fit:contain;border-radius:50%;">

        <div class="membres-choix">

// ── Parser CSV robuste (gère les guillemets et virgules dans les champs) ──
function parseCSVLine(line) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; }  // guillemet échappé ""
        else inQuotes = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(v => v.trim());
}

// Découpe le texte CSV en lignes en respectant les sauts de ligne dans les guillemets
function parseCSV(text) {
  const lignes = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') { inQuotes = !inQuotes; cur += ch; }
    else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (cur.trim()) lignes.push(cur);
      cur = '';
      if (ch === '\r' && text[i+1] === '\n') i++;
    } else cur += ch;
  }
  if (cur.trim()) lignes.push(cur);
  return lignes.map(parseCSVLine);
}

    if (APP.role === "admin") await logoutGoogle();
    sessionStorage.removeItem("equipe");
    sessionStorage.removeItem("membre");
    APP.role = null; APP.user = null; APP.equipeId = null; APP.equipeNom = null; APP.membre = null;
    try { await assurerSession(); } catch(e) {}   // garder une session pour l'accès PIN
    naviguer("#login");
  });
  bindMobileMenu();
}

function bindMobileMenu() {
  const btn = document.getElementById("btn-menu-toggle");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebar-overlay");
  if (!btn || !sidebar || !overlay) return;

  const closeMenu = () => {
    sidebar.classList.remove("sidebar--open");
    overlay.classList.add("hidden");
  };
  const openMenu = () => {
    sidebar.classList.add("sidebar--open");
    overlay.classList.remove("hidden");
  };

  btn.addEventListener("click", () => {
    sidebar.classList.contains("sidebar--open") ? closeMenu() : openMenu();
  });
  overlay.addEventListener("click", closeMenu);
  // Fermer le menu après avoir cliqué un lien de navigation
  sidebar.querySelectorAll(".sidebar-link").forEach(link => {
    link.addEventListener("click", closeMenu);
  });
}
