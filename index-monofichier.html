// Déclare une remise d'argent au trésorier
window.declarerRemise = async (especesTotal, chequesTotal, dejaRemis) => {
  const restant = (especesTotal + chequesTotal) - dejaRemis;
  const v = prompt(
    `Déclarer une remise au trésorier\n\n` +
    `Reste à remettre : ${restant.toFixed(2)} €\n\n` +
    `Saisis le montant remis en espèces, puis en chèques, séparés par un point-virgule.\n` +
    `Exemple : 120;45.50\n\n` +
    `(Laisse le second vide s'il n'y a pas de chèques : 120;)`,
    `${Math.max(0, especesTotal).toFixed(2)};${Math.max(0, chequesTotal).toFixed(2)}`
  );
  if (!v) return;

  const [e, c] = v.split(';').map(x => parseFloat((x||'').trim()) || 0);
  if (e + c <= 0) { toast("Montant invalide", "error"); return; }

  const qui = APP.membre || prompt("Qui a remis l'argent ?") || '';
  try {
    await enregistrerRemise(APP.equipeId, {
      montantEspeces: e, montantCheques: c, parQui: qui
    });
    toast(`Remise de ${formatMontant(e+c)} enregistrée ✅`, "success");
    afficherMonBilan();   // recharger le bilan
  } catch(err) { toast("Erreur : " + err.message, "error"); }
};

window.afficherMonBilan = async () => {
  let modal = document.getElementById("modal-bilan");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "modal-bilan";
    modal.className = "modal hidden";
    document.body.appendChild(modal);
  }
  modal.classList.remove("hidden");
  modal.innerHTML = `<div class="modal-inner"><div class="loader">Calcul de ton bilan…</div></div>`;

  try {
    const passages = await passagesDeLEquipe(APP.equipeId);
    const secteurs = await secteursParEquipe(APP.equipeId);
    const equipe = await lireEquipe(APP.equipeId);
    const remises = equipe?.remises || [];
    const dejaRemis = totalRemis(equipe);
    const secteurMap = Object.fromEntries(secteurs.map(s => [s.id, s.nom]));

    // ── Cumul global ──
    const dons     = passages.filter(p => p.statut === "don");
    const offerts  = passages.filter(p => p.statut === "offert");
    const refus    = passages.filter(p => p.statut === "refuse");
    const absents  = passages.filter(p => p.statut === "absent" || p.statut === "relance");
    const especes  = dons.filter(p => p.modePaiement === "especes").reduce((s,p) => s + Number(p.montant||0), 0);
    const cheques  = dons.filter(p => p.modePaiement === "cheque").reduce((s,p) => s + Number(p.montant||0), 0);
    const cartes   = dons.filter(p => p.modePaiement === "carte").reduce((s,p) => s + Number(p.montant||0), 0);
    const total    = especes + cheques + cartes;
    const calendriers = dons.length + offerts.length;

    // ── Détail par jour ──
    const parJour = {};
    for (const p of passages) {
      const j = (p.datePassage || '').slice(0, 10);
      if (!j) continue;
      if (!parJour[j]) parJour[j] = { dons:0, offerts:0, refus:0, absents:0, montant:0, secteurs:new Set() };
      const d = parJour[j];
      if (p.statut === "don")    { d.dons++;    d.montant += Number(p.montant||0); }
      if (p.statut === "offert") d.offerts++;
      if (p.statut === "refuse") d.refus++;
      if (p.statut === "absent" || p.statut === "relance") d.absents++;
      if (p.secteurId && secteurMap[p.secteurId]) d.secteurs.add(secteurMap[p.secteurId]);
    }
    const jours = Object.entries(parJour).sort((a,b) => b[0].localeCompare(a[0]));

    const fmtJour = (iso) => {
      const [a,m,j] = iso.split('-');
      return new Date(`${a}-${m}-${j}T12:00`).toLocaleDateString('fr-FR',
        { weekday:'short', day:'numeric', month:'short' });
    };

    // ── Avancement sur les secteurs ──
    let totalBoites = 0, traites = 0;
    for (const s of secteurs) {
      totalBoites += nbFoyersSecteur(s);
      traites += (s.nbFoyersVisites || 0);
    }
    const pctGlobal = totalBoites > 0 ? Math.round((traites/totalBoites)*100) : 0;

    modal.innerHTML = `
      <div class="modal-inner bilan-modal">
        <h2>📊 Mon bilan</h2>
        <p class="bilan-sous">${h(APP.equipeNom)}${APP.membre ? ` · ${h(APP.membre)}` : ''}</p>

        <div class="bilan-hero">
          <div class="bilan-hero-item">
            <span class="bh-val">${calendriers}</span>
            <span class="bh-lbl">calendrier${calendriers!==1?'s':''} placé${calendriers!==1?'s':''}</span>
          </div>
          <div class="bilan-hero-item bilan-hero-item--argent">
            <span class="bh-val">${formatMontant(total)}</span>
            <span class="bh-lbl">collecté</span>
          </div>
        </div>

        <div class="bilan-remise">
          <div class="bilan-remise-titre">💰 À remettre au trésorier</div>
          <div class="bilan-remise-lignes">
            <div><span>💵 Espèces</span><strong>${formatMontant(especes)}</strong></div>
            <div><span>📝 Chèques</span><strong>${formatMontant(cheques)}</strong></div>
            ${cartes > 0 ? `<div><span>💳 Carte (SumUp)</span><strong>${formatMontant(cartes)}</strong></div>` : ''}
            <div class="bilan-remise-total"><span>Total</span><strong>${formatMontant(total)}</strong></div>
          </div>
          ${cartes > 0 ? `<div class="bilan-note">Les paiements carte sont déjà encaissés par SumUp.</div>` : ''}
          ${(() => {
            const aRemettre = especes + cheques;
            const restant = aRemettre - dejaRemis;
            return `
            <div class="bilan-remises-suivi">
              <div class="brs-ligne"><span>Déjà remis</span><strong>${formatMontant(dejaRemis)}</strong></div>
              <div class="brs-ligne brs-ligne--reste ${restant > 0.01 ? 'brs-du' : 'brs-ok'}">
                <span>${restant > 0.01 ? 'Reste à remettre' : 'À jour ✅'}</span>
                <strong>${restant > 0.01 ? formatMontant(restant) : ''}</strong>
              </div>
              <button class="btn btn--primary btn--sm btn--full" onclick="declarerRemise(${especes.toFixed(2)}, ${cheques.toFixed(2)}, ${dejaRemis.toFixed(2)})">
                ➕ Déclarer une remise
              </button>
              ${remises.length ? `<div class="brs-histo">
                ${remises.slice().reverse().map(r => `
                  <div class="brs-item">
                    <span>${new Date(r.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span>
                    <span>${formatMontant(r.total)}</span>
                    <span class="brs-detail">${r.especes?`💵 ${formatMontant(r.especes)}`:''}${r.cheques?` 📝 ${formatMontant(r.cheques)}`:''}${r.parQui?` · ${h(r.parQui)}`:''}</span>
                  </div>
                `).join('')}
              </div>` : ''}
            </div>`;
          })()}
        </div>

        <div class="bilan-detail">
          <div class="bd-item"><strong>${dons.length}</strong> don${dons.length!==1?'s':''}</div>
          ${offerts.length ? `<div class="bd-item"><strong>${offerts.length}</strong> offert${offerts.length!==1?'s':''}</div>` : ''}
          <div class="bd-item"><strong>${refus.length}</strong> refus</div>
          <div class="bd-item"><strong>${absents.length}</strong> absent${absents.length!==1?'s':''}</div>
        </div>

        ${totalBoites > 0 ? `
        <div class="bilan-avancement">
          <div class="ba-head">
            <span>Avancement de mes secteurs</span>
            <strong>${pctGlobal}%</strong>
          </div>
          <div class="ts-barre"><div class="ts-barre-fill" style="width:${pctGlobal}%;background:${pctGlobal>=90?'#16A34A':pctGlobal>=60?'#EAB308':'#F97316'}"></div></div>
          <div class="ba-detail">${traites} / ${totalBoites} boîtes traitées · ${Math.max(0,totalBoites-traites)} restantes</div>
        </div>` : ''}

        <div class="bilan-jours">
          <h3>Détail par sortie</h3>
          ${jours.length === 0 ? '<p class="bilan-vide">Aucune sortie enregistrée.</p>' :
            jours.map(([iso, d]) => `
            <div class="bj-ligne">
              <div class="bj-date">${fmtJour(iso)}</div>
              <div class="bj-chiffres">

            </div>

      <p>${h(e.message)}</p>
      <div class="modal-actions">
        <button class="btn btn--ghost" onclick="document.getElementById('modal-bilan').classList.add('hidden')">Fermer</button>

    </div>`;

// ════════════════════════════════════════════════════════════
//  MODE « RUE EN COURS » — saisie rapide par grille de numéros
// ════════════════════════════════════════════════════════════

const COULEURS_STATUT_NUM = {
  don:     { bg: "#16A34A", label: "Don" },
  offert:  { bg: "#2563EB", label: "Offert" },
  refuse:  { bg: "#EF4444", label: "Refus" },
  absent:  { bg: "#EAB308", label: "Absent" },
  relance: { bg: "#F97316", label: "À relancer" }
};

// Normalise une adresse pour comparaison (numéro + rue)
function normAdr(s) {
  return (s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}

// Affiche le sélecteur de rue, ou la grille si une rue est active
function majModeRue(secteur, passages) {
  const box = document.getElementById("mode-rue");
  if (!box) return;

  const rues = ruesDuSecteur(secteur);
  if (rues.length === 0) { box.innerHTML = ''; return; }

  const rueActive = APP._rueActive;

  // ── Pas de rue sélectionnée : afficher le sélecteur ──
  if (!rueActive) {
    // Calculer l'avancement de chaque rue
    const avancement = {};
    for (const r of rues) {
      const { rue, foyers } = r;
      let numeros = [];
      try { numeros = numerosDeRue(secteur.commune, rue, r.restriction); } catch(e) {}
      const faits = numeros.filter(n =>
        passages.some(p => normAdr(p.adresse) === normAdr(`${n} ${rue}`))
      ).length;
      avancement[rue] = { faits, total: foyers };
    }

    box.innerHTML = `
      <button class="mr-toggle" onclick="ouvrirSelecteurRue()">
        📋 Saisie rapide par rue
        <span class="mr-toggle-sub">${rues.length} rue${rues.length>1?'s':''} dans ce secteur</span>
      </button>
      <div id="mr-selecteur" class="mr-selecteur hidden">
        <div class="mr-sel-head">
          Choisis une rue
          <button class="mr-fermer" onclick="document.getElementById('mr-selecteur').classList.add('hidden')">✕</button>
        </div>
        <input id="mr-recherche" class="input input--sm" placeholder="🔍 Filtrer les rues…" autocomplete="off">
        <div id="mr-liste" class="mr-liste">
          ${rues.map(r => {
            const rue = r.rue, foyers = r.foyers;
            const partagee = Array.isArray(r.restriction);
            const a = avancement[rue];
            const pct = a.total ? Math.round((a.faits/a.total)*100) : 0;
            const col = pct >= 100 ? '#16A34A' : pct > 0 ? '#EAB308' : 'var(--gris-bord)';
            return `<button class="mr-rue" data-rue="${h(rue)}"
                      onclick="activerRue(${ja(rue)})">
              <span class="mr-rue-nom">${h(rue)}${partagee ? ' <em class="mr-part">partagée</em>' : ''}</span>
              <span class="mr-rue-prog" style="color:${col}">${a.faits}/${a.total}</span>
            </button>`;
          }).join('')}
        </div>
      </div>
    `;

    // Filtre de recherche
    const rech = document.getElementById("mr-recherche");
    rech?.addEventListener("input", () => {
      const q = normAdr(rech.value);
      document.querySelectorAll("#mr-liste .mr-rue").forEach(b => {
        b.style.display = !q || normAdr(b.dataset.rue).includes(q) ? '' : 'none';
      });
    });
    return;
  }

  // ── Rue active : afficher la grille de numéros ──
  // Restriction éventuelle (rue partagée entre deux secteurs)
  const infoRue = rues.find(r => r.rue === rueActive);
  const restrict = infoRue ? infoRue.restriction : null;
  let numeros = [];
  try { numeros = numerosDeRue(secteur.commune, rueActive, restrict); } catch(e) {}
  if (numeros.length === 0) {
    box.innerHTML = `<div class="mr-vide">Aucun numéro connu pour « ${h(rueActive)} ».
      <button class="mr-quitter" onclick="quitterRue()">Retour</button></div>`;
    return;
  }

  // Numéros ajoutés manuellement (stockés dans le secteur → partagés et durables)
  const ajouts = lireComplements(secteur, rueActive);

  // Récupérer aussi les numéros présents dans les passages mais absents de la BAN
  const depuisPassages = passages
    .filter(p => {
      const a = (p.adresse || '').trim();
      const m = a.match(/^(\S+)\s+(.*)$/);
      return m && normAdr(m[2]) === normAdr(rueActive);
    })
    .map(p => p.adresse.trim().match(/^(\S+)\s+/)[1]);

  // Adresses masquées (fusionnées en secondaire) et inhabitées
  const normA = s => normAdr(s);
  const secondaires = new Set(adressesSecondaires(secteur).map(normA));
  const inhab = new Set((secteur.inhabitees || []).map(normA));

  // Fusionner : BAN + ajouts manuels + numéros déjà saisis, moins les secondaires
  const tousNums = [...new Set([...numeros, ...ajouts, ...depuisPassages])]
    .filter(n => !secondaires.has(normA(`${n} ${rueActive}`)))
    .sort((a, b) => {
      const na = parseInt(a), nb = parseInt(b);
      if (isNaN(na) && isNaN(nb)) return String(a).localeCompare(String(b));
      if (isNaN(na)) return 1;
      if (isNaN(nb)) return -1;
      return na - nb || String(a).localeCompare(String(b));
    });

  // Statut de chaque numéro d'après les passages enregistrés
  const statuts = {};
  for (const n of tousNums) {
    const p = passages.find(x => normAdr(x.adresse) === normAdr(`${n} ${rueActive}`));
    if (p) statuts[n] = p.statut;
  }
  const aFaire = tousNums.filter(n => !inhab.has(normA(`${n} ${rueActive}`)));
  const faits = Object.keys(statuts).filter(n => !inhab.has(normA(`${n} ${rueActive}`))).length;
  const pct = aFaire.length ? Math.round((faits / aFaire.length) * 100) : 0;

  // Séparer pairs et impairs (les deux trottoirs)
  const impairs = tousNums.filter(n => (parseInt(n) % 2) === 1);
  const pairs   = tousNums.filter(n => (parseInt(n) % 2) === 0);
  const autres  = tousNums.filter(n => isNaN(parseInt(n)));

  const grille = (liste, titre) => liste.length === 0 ? '' : `
    <div class="mr-cote">
      <div class="mr-cote-titre">${titre}</div>
      <div class="mr-nums">
        ${liste.map(n => {
          const st = statuts[n];
          const c = st ? COULEURS_STATUT_NUM[st] : null;
          const aj = ajouts.includes(n);
          const adrN = `${n} ${rueActive}`;
          const inh = inhab.has(normA(adrN));
          const fus = trouverFusion(secteur, adrN);
          const nbFus = fus ? (fus.secondaires || []).length : 0;
          const nt = lireNoteAdresse(secteur, adrN);
          const hist = (APP._histAdresses || {})[normAdr(adrN)];
          const aDonne = hist && hist.some(x => x.statut === "don" && x.montant > 0);
          return `<button class="mr-num ${st ? 'mr-num--fait' : ''} ${aj ? 'mr-num--ajout' : ''} ${inh ? 'mr-num--inhab' : ''}"
            style="${inh ? '' : c ? `background:${c.bg};border-color:${c.bg};color:#fff` : ''}"
            title="${inh ? 'Inhabitée' : c ? c.label : 'Non visité'}${aj ? ' — ajouté' : ''}${nbFus ? ` — regroupe ${nbFus+1} adresses` : ''}${nt ? ` — 📌 ${h(nt.texte)}` : ''}${aDonne ? ` — a donné ${hist[0].montant.toFixed(2)} € en ${hist[0].annee}` : ''}"
            onclick="saisirNumero('${n}','${rueActive.replace(/'/g,"\\'")}')">${n}${nbFus ? `<sup>+${nbFus}</sup>` : ''}${nt ? '<i class="mr-pin">📌</i>' : ''}${aDonne ? '<i class="mr-don">€</i>' : ''}</button>`;
        }).join('')}
      </div>
    </div>`;

  box.innerHTML = `
    <div class="mr-grille-wrap">

  // Ce numéro vient-il d'un ajout manuel ?

  const fusion = trouverFusion(secteur, adresse);
  const inhabitee = estInhabitee(secteur, adresse);
  const notePerm = lireNoteAdresse(secteur, adresse);

  let modal = document.getElementById("modal-num");

  modal.innerHTML = `
    <div class="modal-inner mn-modal">
      <h2>${adresse}</h2>
      ${existant ? `<p class="mn-existant">Déjà enregistré : <strong>${STATUT_PASSAGE_LABEL[existant.statut]}</strong>${existant.statut==='don'?` (${formatMontant(existant.montant)})`:''}</p>` : ''}
      ${fusion ? `<p class="mn-fusion">🔗 Regroupe : ${[fusion.principale, ...(fusion.secondaires||[])].join(' + ')}
        <button class="mn-lien" onclick="mnAnnulerFusion('${fusion.principale.replace(/'/g,"\\'")}')">séparer</button></p>` : ''}
      ${inhabitee ? `<p class="mn-inhab">🏚️ Marquée inhabitée — hors décompte
        <button class="mn-lien" onclick="mnInhabitee(false)">remettre</button></p>` : ''}
      <div class="mn-statuts">
        <button class="mn-btn mn-btn--don" onclick="mnChoisir('don')">💰 Don</button>
        <button class="mn-btn mn-btn--offert" onclick="mnChoisir('offert')">🎁 Offert</button>
        <button class="mn-btn mn-btn--refuse" onclick="mnChoisir('refuse')">🚫 Refus</button>
        <button class="mn-btn mn-btn--absent" onclick="mnChoisir('absent')">🔔 Absent</button>
      </div>
      ${(() => {
        const h = (APP._histAdresses || {})[normAdresse(adresse)];
        const r = resumeHistorique(h);
        if (!r || r.length === 0) return '';
        return `<p class="mn-histo">📊 Années passées : ${r.slice(0, 3).join(' · ')}</p>`;
      })()}
      ${notePerm ? `<p class="mn-note-perm">📌 ${h(notePerm.texte)}
        <button class="mn-lien" onclick="mnNote()">modifier</button></p>` : ''}
      <div class="mn-outils">
        ${!inhabitee ? `<button class="mn-outil" onclick="mnInhabitee(true)">🏚️ Inhabitée</button>` : ''}
        <button class="mn-outil" onclick="mnFusionner()">🔗 Même boîte que…</button>
        ${!notePerm ? `<button class="mn-outil" onclick="mnNote()">📌 Note</button>` : ''}
      </div>
      <div id="mn-montant-box" class="hidden">
        <label class="label">Montant (€)</label>
        <input id="mn-montant" class="input input--montant" type="number" inputmode="decimal" min="0" step="0.50" placeholder="0.00">
        <div class="mode-paiement">
          <button class="mode-btn mode-btn--active" data-mn-mode="especes" onclick="mnMode('especes')">💵 Espèces</button>
          <button class="mode-btn" data-mn-mode="cheque" onclick="mnMode('cheque')">📝 Chèque</button>
          <button class="mode-btn" data-mn-mode="carte" onclick="mnMode('carte')">💳 Carte</button>
        </div>
      </div>

        ${existant ? `<button class="btn btn--danger" onclick="mnSupprimer('${existant.id}','${secteurId}')">🗑️ Supprimer</button>` : ''}

    const btn = document.getElementById("mn-valider");

// Affiche des raccourcis après une saisie : numéros suivants de la même rue
// et bouton d'annulation de la dernière saisie.
function majRaccourcis(derniereAdresse, commune) {
  const box = document.getElementById("raccourcis-adresse");
  if (!box) return;

  const parts = [];

  // ── Annuler la dernière saisie ──
  if (APP._dernierPassage) {
    parts.push(`<button class="rac-btn rac-btn--annuler" onclick="annulerDerniereSaisie()">
                  ↩️ Annuler « ${(APP._dernierPassage.adresse || 'dernier passage').slice(0, 22)} »
                </button>`);
  }

  // ── Numéros suivants de la même rue ──
  const m = (derniereAdresse || '').trim().match(/^(\d+)\s*([a-zA-Z]?)\s+(.+)$/);
  if (m) {
    const numActuel = parseInt(m[1]);
    const rue = m[3].trim();
    // Chercher les numéros réels de cette rue dans les données BAN
    let numeros = [];
    try { numeros = numerosDeRue(commune, rue); } catch(e) {}

    let suivants = [];
    if (numeros.length > 0) {
      // Prendre les numéros existants supérieurs au courant (même parité d'abord)
      const memeParite = numeros.filter(n => {
        const v = parseInt(n);
        return v > numActuel && v % 2 === numActuel % 2;
      }).slice(0, 4);
      const autres = numeros.filter(n => {
        const v = parseInt(n);
        return v > numActuel && v % 2 !== numActuel % 2;
      }).slice(0, 2);
      suivants = [...memeParite, ...autres];
    } else {
      // Pas de données : proposer +2 / +4 (même trottoir) et +1
      suivants = [numActuel + 2, numActuel + 4, numActuel + 1].map(String);
    }

    if (suivants.length > 0) {
      parts.push(`<span class="rac-label">Suivant dans ${rue.length > 20 ? rue.slice(0,20)+'…' : rue} :</span>`);
      suivants.forEach(n => {
        const adr = `${n} ${rue}`;
        parts.push(`<button class="rac-btn rac-btn--num"
                      onclick="remplirAdresse('${adr.replace(/'/g, "\\'")}')">${n}</button>`);
      });
    }

    // Mémoriser la rue en cours pour la prochaine saisie
    APP._rueEnCours = { rue, commune };
  }

  if (parts.length === 0) { box.classList.add("hidden"); box.innerHTML = ''; return; }
  box.classList.remove("hidden");
  box.innerHTML = parts.join('');
}

// Annule (supprime) la dernière saisie enregistrée
window.annulerDerniereSaisie = async () => {
  const d = APP._dernierPassage;
  if (!d) { toast("Aucune saisie récente à annuler", "info"); return; }

  // Retrouver le passage le plus récent de ce secteur pour cette équipe
  try {
    const passages = await passagesDuSecteur(d.secteurId);
    const miens = passages
      .filter(p => p.equipeId === APP.equipeId)
      .sort((a, b) => (b.datePassage || '').localeCompare(a.datePassage || ''));
    const dernier = miens[0];
    if (!dernier) { toast("Passage introuvable", "error"); return; }

    const desc = dernier.statut === "don"
      ? `${formatMontant(dernier.montant)}`
      : STATUT_PASSAGE_LABEL[dernier.statut] || dernier.statut;
    if (!confirm(`Annuler cette saisie ?\n\n« ${dernier.adresse || 'sans adresse'} » — ${desc}`)) return;

    tracer(ACTIONS.SUPPRESSION, { avant: dernier, contexte: "annulation immédiate", auteur: auteurCourant() });
    await supprimerPassage(dernier.id, d.secteurId);
    APP._dernierPassage = null;
    document.getElementById("raccourcis-adresse")?.classList.add("hidden");
    toast("Saisie annulée", "success");
  } catch(e) {
    toast("Erreur : " + e.message, "error");
  }
};

async function renderClassement() {

  `);
  bindLogout();

  async function refresh() {
    const [stats, secteurs, passages] = await Promise.all([
      statsGlobalesTournee(), lireSecteurs(), fsGetAll(COLLECTIONS.PASSAGES)
    ]);
    const content = document.getElementById("classement-content");
    if (!content) return;
    const podium = getPodium(stats.parEquipe);
    const badgesParEquipe = calculerBadges(stats.parEquipe, secteurs, passages);

    content.innerHTML = `
      ${podium.length > 0 ? `<div class="podium-wrap">
        ${podium[1] ? renderPodiumPlace(podium[1], 2, secteurs) : '<div></div>'}
        ${podium[0] ? renderPodiumPlace(podium[0], 1, secteurs) : '<div></div>'}
        ${podium[2] ? renderPodiumPlace(podium[2], 3, secteurs) : '<div></div>'}
      </div>` : '<p class="empty-state">Aucune équipe pour le moment.</p>'}

      <div class="section-block">
        <h2>Toutes les équipes</h2>
        <div class="equipes-ranking-grid">
          ${stats.parEquipe.map((eq, i) => {
            const pct = pourcentCompletionEquipe(eq.id, secteurs);
            const palier = getPalier(pct);
            const badges = badgesParEquipe[eq.id] || [];
            return `<div class="ranking-card">
              <div class="ranking-card-top">
                <span class="ranking-pos">#${i+1}</span>
                <span class="ranking-nom">${h(eq.nom)}</span>
                <span class="ranking-palier" title="${palier.label}">${palier.icone}</span>
              </div>
              <div class="ranking-montant">${formatMontant(eq.montant)}</div>
              <div class="ranking-bar-wrap"><div class="ranking-bar" style="width:${pct}%"></div></div>
              <div class="ranking-sub">${pct}% des secteurs terminés</div>
              ${badges.length > 0
                ? `<div class="ranking-badges">${badges.map(b => `<span title="${b.nom} — ${b.description}">${b.icone}</span>`).join('')}</div>`
                : `<div class="ranking-badges ranking-badges--empty">Aucun badge pour l'instant</div>`}
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="section-block">

        <div class="badges-grid">
          ${BADGES.map(b => `<div class="badge-card">
            <div class="badge-card-icon">${b.icone}</div>
            <div class="badge-card-nom">${b.nom}</div>
            <div class="badge-card-desc">${b.description}</div>
          </div>`).join('')}
        </div>
      </div>
    `;
  }

  await refresh();
  const unsub = ecouterSecteurs(async () => { await refresh(); });
  APP.unsubs.push(unsub);
}

function renderPodiumPlace(eq, place, secteurs) {
  const hauteurs = { 1:"podium-place--1", 2:"podium-place--2", 3:"podium-place--3" };
  const medailles = { 1:"🥇", 2:"🥈", 3:"🥉" };
  const pct = pourcentCompletionEquipe(eq.id, secteurs);
  return `<div class="podium-place ${hauteurs[place]}">
    <div class="podium-medaille">${medailles[place]}</div>
    <div class="podium-nom">${h(eq.nom)}</div>
    <div class="podium-montant">${formatMontant(eq.montant)}</div>
    <div class="podium-pct">${pct}%</div>
    <div class="podium-bloc">${place}</div>
  </div>`;
}
