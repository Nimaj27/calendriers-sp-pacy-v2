<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#CC1D1D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calendriers SP">
  <title>Tournée Calendriers — SP Pacy</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>/* ============================================================
   style.css — Design mobile-first Amicale SP Pacy-sur-Eure
   Palette : rouge pompier #CC1D1D, gris ardoise #2D3142,
             blanc #FFFFFF, orange alerte #F97316, vert succès #16A34A
   ============================================================ */

/* ── Reset & variables ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Couleurs SDIS */
  --rouge:       #CC1D1D;
  --rouge-dark:  #A01515;
  --rouge-light: #FDECEA;
  --ardoise:     #2D3142;
  --ardoise-mid: #4A4E6A;
  --ardoise-light: #E8E9EF;
  --blanc:       #FFFFFF;
  --gris-fond:   #F4F5F9;
  --gris-bord:   #D1D5DB;
  --orange:      #F97316;
  --vert:        #16A34A;
  --vert-light:  #DCFCE7;
  --jaune:       #EAB308;
  --jaune-light: #FEF9C3;
  --bleu:        #2563EB;
  --bleu-light:  #DBEAFE;

  /* Spacing */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* Border radius */
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 24px;

  /* Shadow */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.14);

  /* Font */
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--gris-fond);
  color: var(--ardoise);
  line-height: 1.5;
  min-height: 100vh;
}

/* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

/* ── Utilitaires ─────────────────────────────────────────────── */
.hidden { display: none !important; }

/* ── Toasts ──────────────────────────────────────────────────── */
#toasts {
  position: fixed; bottom: var(--sp-5); right: var(--sp-5);
  z-index: 9999; display: flex; flex-direction: column; gap: var(--sp-2);
}
.toast {
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--r-md);
  font-size: .9rem; font-weight: 500;
  color: var(--blanc); max-width: 320px;
  animation: slideUp .25s ease;
  box-shadow: var(--shadow-md);
}
.toast--info    { background: var(--ardoise); }
.toast--success { background: var(--vert); }
.toast--error   { background: var(--rouge); }
@keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ── Loader ──────────────────────────────────────────────────── */
.loader {
  padding: var(--sp-8) var(--sp-5);
  text-align: center; color: var(--ardoise-mid);
  font-size: .95rem;
}

/* ── Boutons ─────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-5);
  border: none; border-radius: var(--r-md);
  font-family: var(--font); font-size: .9rem; font-weight: 600;
  cursor: pointer; transition: background .15s, transform .1s, opacity .15s;
  text-decoration: none; user-select: none; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn--primary { background: var(--rouge); color: var(--blanc); }
.btn--primary:hover:not(:disabled) { background: var(--rouge-dark); }
.btn--ghost { background: transparent; color: var(--ardoise); border: 1.5px solid var(--gris-bord); }
.btn--ghost:hover:not(:disabled) { background: var(--ardoise-light); }
.btn--danger { background: var(--rouge-light); color: var(--rouge-dark); }
.btn--danger:hover:not(:disabled) { background: #f8b4b4; }
.btn--sm { padding: var(--sp-2) var(--sp-3); font-size: .82rem; }
.btn--full { width: 100%; justify-content: center; }

/* ── Inputs ──────────────────────────────────────────────────── */
.input {
  display: block; width: 100%;
  padding: var(--sp-3) var(--sp-4);
  border: 1.5px solid var(--gris-bord);
  border-radius: var(--r-md);
  font-family: var(--font); font-size: .95rem;
  color: var(--ardoise); background: var(--blanc);
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
}
.input:focus { outline: none; border-color: var(--rouge); box-shadow: 0 0 0 3px rgba(204,29,29,.12); }
.input.textarea { resize: vertical; min-height: 80px; }
.input--sm { padding: var(--sp-2) var(--sp-3); font-size: .85rem; }
.input--color { padding: var(--sp-2); height: 42px; cursor: pointer; }
.input--montant { font-size: 1.3rem; font-weight: 700; text-align: center; }
.label { display: block; font-size: .85rem; font-weight: 600; color: var(--ardoise-mid); margin: var(--sp-4) 0 var(--sp-1); }

/* ── Badges ──────────────────────────────────────────────────── */
.badge {
  display: inline-block; padding: 2px 8px;
  border-radius: 99px; font-size: .75rem; font-weight: 600;
}
.badge--libre     { background: var(--gris-bord); color: var(--ardoise-mid); }
.badge--affecte   { background: var(--bleu-light); color: var(--bleu); }
.badge--en_cours  { background: var(--jaune-light); color: #92400E; }
.badge--termine   { background: var(--vert-light); color: #14532D; }
.badge--don       { background: var(--vert-light); color: #14532D; }
.badge--refuse    { background: var(--rouge-light); color: var(--rouge-dark); }
.badge--absent    { background: var(--jaune-light); color: #92400E; }
.badge--relance   { background: #FEF3C7; color: #92400E; }

/* ── Page Login ──────────────────────────────────────────────── */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: var(--sp-5);
  background: linear-gradient(135deg, var(--ardoise) 0%, #1a1e30 100%);
}
.login-card {
  background: var(--blanc); border-radius: var(--r-xl);
  padding: var(--sp-8); width: 100%; max-width: 400px;
  box-shadow: var(--shadow-lg);
}
.login-logo {
  display: flex; align-items: center; gap: var(--sp-4);
  margin-bottom: var(--sp-6); padding-bottom: var(--sp-6);
  border-bottom: 1.5px solid var(--ardoise-light);
}
.login-logo img { width: 52px; height: 52px; object-fit: contain; }
.login-logo-icon { font-size: 2.4rem; line-height: 1; flex-shrink: 0; }

.login-logo-title { display: block; font-size: 1.05rem; font-weight: 700; color: var(--ardoise); }
.login-logo-sub   { display: block; font-size: .8rem; color: var(--ardoise-mid); margin-top: 2px; }

/* Tabs login */
.login-tabs {
  display: flex; gap: var(--sp-2); margin-bottom: var(--sp-5);
  background: var(--gris-fond); border-radius: var(--r-md); padding: 4px;
}
.tab-btn {
  flex: 1; padding: var(--sp-2) var(--sp-3);
  background: none; border: none; border-radius: var(--r-sm);
  font-family: var(--font); font-size: .88rem; font-weight: 500;
  color: var(--ardoise-mid); cursor: pointer; transition: all .15s;
}
.tab-btn--active { background: var(--blanc); color: var(--ardoise); box-shadow: var(--shadow-sm); font-weight: 600; }
.login-hint { font-size: .88rem; color: var(--ardoise-mid); margin-bottom: var(--sp-4); }

/* PIN pad */
.pin-display {
  font-family: var(--font-mono); font-size: 2rem; font-weight: 700;
  text-align: center; letter-spacing: 1rem;
  color: var(--ardoise); padding: var(--sp-4);
  background: var(--gris-fond); border-radius: var(--r-md);
  margin-bottom: var(--sp-4);
}
.pin-pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}
.pin-key {
  padding: var(--sp-4); border: none; border-radius: var(--r-md);
  background: var(--gris-fond); font-family: var(--font);
  font-size: 1.2rem; font-weight: 600; color: var(--ardoise);
  cursor: pointer; transition: background .1s, transform .1s;
  min-height: 54px;
}
.pin-key:active { background: var(--ardoise-light); transform: scale(.95); }
.pin-key--empty { visibility: hidden; }
.error-msg { color: var(--rouge); font-size: .85rem; text-align: center; margin-top: var(--sp-2); }

/* ── Layout Admin ────────────────────────────────────────────── */
.admin-layout {
  display: flex; min-height: 100vh;
}
.sidebar {
  width: 240px; min-width: 240px;
  background: var(--ardoise); color: var(--blanc);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; height: 100vh;
  z-index: 100;
}
.sidebar-brand {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.sidebar-icon { font-size: 1.5rem; }
.sidebar-title { font-size: .9rem; font-weight: 700; line-height: 1.3; }
.sidebar-title small { font-weight: 400; opacity: .7; }
.sidebar-nav { flex: 1; padding: var(--sp-4) 0; overflow-y: auto; list-style: none; }
.sidebar-link {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5); color: rgba(255,255,255,.75);
  text-decoration: none; font-size: .9rem; font-weight: 500;
  transition: background .15s, color .15s;
}
.sidebar-link:hover { background: rgba(255,255,255,.08); color: var(--blanc); }
.sidebar-link--active { background: var(--rouge); color: var(--blanc); }
.sidebar-link-icon { font-size: 1.1rem; width: 20px; text-align: center; }
.sidebar-footer { padding: var(--sp-4) var(--sp-5); border-top: 1px solid rgba(255,255,255,.1); }
.sidebar-user { display: block; font-size: .78rem; color: rgba(255,255,255,.5); margin-bottom: var(--sp-2); word-break: break-all; }

.admin-content {
  margin-left: 240px; flex: 1;
  padding: var(--sp-6); min-height: 100vh;
}

/* ── Page header ─────────────────────────────────────────────── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--sp-6); flex-wrap: wrap; gap: var(--sp-3);
}
.page-header h1 { font-size: 1.5rem; font-weight: 700; color: var(--ardoise); }

/* ── Stat cards ──────────────────────────────────────────────── */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--sp-4); margin-bottom: var(--sp-6);
}
.stat-card {
  background: var(--blanc); border-radius: var(--r-lg);
  padding: var(--sp-5); box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--gris-bord);
}
.stat-card--primary { background: var(--rouge); color: var(--blanc); border-color: var(--rouge-dark); }
.stat-card--primary .stat-label, .stat-card--primary .stat-sub { color: rgba(255,255,255,.8); }
.stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1; margin-bottom: var(--sp-1); }
.stat-label { font-size: .85rem; font-weight: 600; color: var(--ardoise-mid); margin-bottom: var(--sp-2); }
.stat-sub   { font-size: .78rem; color: var(--ardoise-mid); }

/* Progress bar */
.progress-bar { height: 6px; background: var(--ardoise-light); border-radius: 99px; margin: var(--sp-2) 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--vert); border-radius: 99px; transition: width .4s ease; }

/* ── Section block ───────────────────────────────────────────── */
.section-block {
  background: var(--blanc); border-radius: var(--r-lg);
  padding: var(--sp-5); box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--gris-bord); margin-bottom: var(--sp-5);
}
.section-block h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: var(--sp-4); }

/* Ranking équipes */
.equipes-ranking-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: var(--sp-3);
}
.ranking-card {
  background: var(--gris-fond); border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4); border: 1.5px solid var(--ardoise-light);
}
.ranking-card-top { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.ranking-pos { font-weight: 700; color: var(--rouge); font-size: .82rem; }
.ranking-nom { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranking-montant { font-weight: 700; color: var(--vert); font-size: 1.1rem; margin-bottom: var(--sp-2); }
.ranking-bar-wrap { width: 100%; height: 6px; background: var(--ardoise-light); border-radius: 99px; overflow: hidden; margin-bottom: var(--sp-1); }
.ranking-bar { height: 100%; background: var(--rouge); border-radius: 99px; transition: width .4s; }
.ranking-sub { font-size: .75rem; color: var(--ardoise-mid); }

/* ── Table ───────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
.table {
  width: 100%; border-collapse: collapse; font-size: .9rem;
}
.table th {
  text-align: left; padding: var(--sp-3) var(--sp-4);
  background: var(--gris-fond); font-weight: 600; font-size: .82rem;
  color: var(--ardoise-mid); border-bottom: 1.5px solid var(--gris-bord);
  white-space: nowrap;
}
.table td { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--ardoise-light); vertical-align: middle; }
.table tr:last-child td { border: none; }
.table tr:hover td { background: var(--gris-fond); }
.tr--don td { border-left: 3px solid var(--vert); }
.tr--refuse td { border-left: 3px solid var(--rouge); }
.tr--absent td { border-left: 3px solid var(--jaune); }
.td-actions { display: flex; gap: var(--sp-2); white-space: nowrap; }
.pin-code { background: var(--gris-fond); padding: 2px 6px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: .9rem; }

/* ── Secteurs ────────────────────────────────────────────────── */
.commune-group { margin-bottom: var(--sp-6); }
.commune-title { font-size: .85rem; font-weight: 700; color: var(--ardoise-mid); text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--sp-3); }
.secteurs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--sp-3); }
.secteur-card {
  background: var(--blanc); border-radius: var(--r-lg);
  border: 1.5px solid var(--gris-bord); box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.secteur-card--termine { border-color: var(--vert); }
.secteur-card--en_cours { border-color: var(--jaune); }
.secteur-card-header {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
  border-bottom: 1px solid var(--ardoise-light);
}
.secteur-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.secteur-card-header strong { flex: 1; font-size: .95rem; }
.secteur-card-body { padding: var(--sp-3) var(--sp-4); }
.secteur-equipe { font-size: .88rem; color: var(--ardoise-mid); margin-bottom: var(--sp-2); }
.secteur-commune-label { font-size: .72rem; font-weight: 600; color: var(--ardoise-mid); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--sp-2); }
.secteur-montant { font-size: 1.1rem; font-weight: 700; color: var(--vert); }
.secteur-rues { font-size: .78rem; color: var(--ardoise-mid); margin-top: var(--sp-2); line-height: 1.4; }
.secteur-card-actions { display: flex; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); flex-wrap: wrap; background: var(--gris-fond); }

/* ── Modal ───────────────────────────────────────────────────── */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 500; display: flex; align-items: flex-end; justify-content: center;
  padding: var(--sp-4);
}
.modal:not(.hidden) { display: flex; }
.modal-inner {
  background: var(--blanc); border-radius: var(--r-xl) var(--r-xl) 0 0;
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  padding: var(--sp-6);
}
@media (min-width: 600px) {
  .modal { align-items: center; }
  .modal-inner { border-radius: var(--r-xl); }
}
.modal-inner h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: var(--sp-4); }
.modal-actions { display: flex; gap: var(--sp-3); margin-top: var(--sp-5); flex-wrap: wrap; }

/* ── Form card ───────────────────────────────────────────────── */
.form-card {
  background: var(--blanc); border-radius: var(--r-lg);
  border: 1.5px solid var(--gris-bord); padding: var(--sp-6);
  max-width: 560px; box-shadow: var(--shadow-sm);
}

/* ── Filter bar ──────────────────────────────────────────────── */
.filter-bar { margin-bottom: var(--sp-4); display: flex; gap: var(--sp-3); flex-wrap: wrap; }

/* ── Empty state ─────────────────────────────────────────────── */
.empty-state {
  padding: var(--sp-10) var(--sp-5); text-align: center;
  color: var(--ardoise-mid); font-size: .95rem; line-height: 1.6;
}

/* ── Relances ────────────────────────────────────────────────── */
.relances-count { font-weight: 600; margin-bottom: var(--sp-4); color: var(--rouge); }

/* ══════════════════════════════════════════════════════════════
   TERRAIN (interface Amicaliste mobile)
   ══════════════════════════════════════════════════════════════ */
.terrain-layout {
  min-height: 100vh; display: flex; flex-direction: column;
  background: var(--gris-fond);
}
.terrain-header {
  background: var(--ardoise); color: var(--blanc);
  padding: var(--sp-3) var(--sp-4);
  display: flex; align-items: center; gap: var(--sp-3);
  position: sticky; top: 0; z-index: 50;
}
.terrain-brand { font-size: .9rem; font-weight: 700; flex: 1; }
.terrain-equipe { font-size: .82rem; color: rgba(255,255,255,.7); }
.terrain-header-title { flex: 1; }
.terrain-secteur-titre { font-size: .9rem; font-weight: 700; color: var(--blanc); }
.terrain-secteur-commune { font-size: .78rem; color: rgba(255,255,255,.6); }

/* Liste secteurs terrain */
.terrain-secteurs { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.terrain-empty { padding: var(--sp-8) var(--sp-5); text-align: center; color: var(--ardoise-mid); line-height: 1.7; }
.terrain-secteur-card {
  background: var(--blanc); border-radius: var(--r-lg);
  border: 1.5px solid var(--gris-bord); padding: var(--sp-4);
  cursor: pointer; transition: box-shadow .15s, transform .1s;
  box-shadow: var(--shadow-sm);
}
.terrain-secteur-card:active { transform: scale(.98); box-shadow: var(--shadow-md); }
.terrain-secteur-header { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.terrain-secteur-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.terrain-secteur-nom { font-weight: 700; font-size: 1rem; color: var(--ardoise); }
.terrain-secteur-commune { font-size: .8rem; color: var(--ardoise-mid); }
.terrain-secteur-stats { display: flex; gap: var(--sp-4); font-size: .85rem; color: var(--ardoise-mid); margin-bottom: var(--sp-2); }
.terrain-secteur-rues { font-size: .78rem; color: var(--ardoise-mid); }

/* Formulaire passage terrain */
.passage-form {
  background: var(--blanc); border-radius: var(--r-lg);
  margin: var(--sp-4); padding: var(--sp-5);
  box-shadow: var(--shadow-md); border: 1.5px solid var(--gris-bord);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.passage-statuts { display: flex; gap: var(--sp-2); }
.statut-btn {
  flex: 1; padding: var(--sp-3) var(--sp-2);
  border: 2px solid var(--gris-bord); border-radius: var(--r-md);
  background: none; font-family: var(--font);
  font-size: .85rem; font-weight: 600; cursor: pointer;
  transition: all .15s; text-align: center;
}
.statut-btn--don:hover, .statut-btn--don.statut-btn--selected { background: var(--vert-light); border-color: var(--vert); color: #14532D; }
.statut-btn--refuse:hover, .statut-btn--refuse.statut-btn--selected { background: var(--rouge-light); border-color: var(--rouge); color: var(--rouge-dark); }
.statut-btn--absent:hover, .statut-btn--absent.statut-btn--selected { background: var(--jaune-light); border-color: var(--jaune); color: #78350F; }

.don-details, .absent-details { display: flex; flex-direction: column; gap: var(--sp-3); }
.mode-paiement { display: flex; gap: var(--sp-2); }
.mode-btn {
  flex: 1; padding: var(--sp-3);
  border: 2px solid var(--gris-bord); border-radius: var(--r-md);
  background: none; font-family: var(--font); font-size: .88rem; font-weight: 500;
  cursor: pointer; transition: all .15s;
}
.mode-btn--active { background: var(--bleu-light); border-color: var(--bleu); color: var(--bleu); font-weight: 700; }
.checkbox-label { display: flex; align-items: center; gap: var(--sp-2); font-size: .9rem; cursor: pointer; }
.checkbox-label input { width: 18px; height: 18px; cursor: pointer; }

/* Liste passages terrain */
.passages-terrain { padding: var(--sp-4); }
.passages-terrain h3 { font-size: .95rem; font-weight: 700; margin-bottom: var(--sp-3); color: var(--ardoise-mid); }
.passage-item {
  display: flex; align-items: center; gap: var(--sp-3);
  background: var(--blanc); border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4);
  border: 1.5px solid var(--gris-bord);
  margin-bottom: var(--sp-2); box-shadow: var(--shadow-sm);
}
.passage-item--don    .passage-statut-dot { background: var(--vert); }
.passage-item--refuse .passage-statut-dot { background: var(--rouge); }
.passage-item--absent .passage-statut-dot { background: var(--jaune); }
.passage-item--relance .passage-statut-dot { background: var(--orange); }
.passage-statut-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.passage-info { flex: 1; min-width: 0; }
.passage-adresse { display: block; font-size: .88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.passage-badge { font-size: .75rem; color: var(--ardoise-mid); }
.passage-montant { font-size: .88rem; font-weight: 700; color: var(--vert); margin-left: var(--sp-2); }
.passage-heure { font-size: .78rem; color: var(--ardoise-mid); white-space: nowrap; }

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width: 767px) {
  .admin-content { margin-left: 200px; padding: var(--sp-3); }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .secteurs-grid { grid-template-columns: repeat(2, 1fr); gap: var(--sp-2); }
  .page-header { flex-direction: column; align-items: flex-start; }
}

@media (min-width: 768px) {
  .terrain-layout { max-width: 600px; margin: 0 auto; }
}

/* ── Carte (Leaflet) ─────────────────────────────────────────── */
.map-legend {
  display: flex; gap: var(--sp-4); flex-wrap: wrap;
  margin-top: var(--sp-3); font-size: .82rem; color: var(--ardoise-mid);
}
.map-legend span { display: flex; align-items: center; gap: 6px; }
.map-legend i {
  display: inline-block; width: 12px; height: 12px;
  border-radius: 3px; flex-shrink: 0;
}
.leaflet-popup-content-wrapper { border-radius: var(--r-md); }

/* ── Badge réseau (hors-ligne) ──────────────────────────────── */
.network-badge {
  font-size: .72rem; font-weight: 600;
  padding: 3px 8px; border-radius: 99px;
  white-space: nowrap;
}
.network-badge--online  { background: rgba(34,197,94,.18); color: #BBF7D0; }
.network-badge--offline { background: rgba(239,68,68,.25); color: #FECACA; animation: pulse-offline 2s infinite; }
@keyframes pulse-offline { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

/* ── Menu mobile (hamburger + sidebar coulissante) ──────────── */
.mobile-topbar {
  display: none;
  align-items: center; gap: var(--sp-3);
  background: var(--ardoise); color: var(--blanc);
  padding: var(--sp-3) var(--sp-4);
  position: sticky; top: 0; z-index: 60;
}
.btn-hamburger {
  background: none; border: none; color: var(--blanc);
  font-size: 1.4rem; cursor: pointer; padding: 4px 8px;
  line-height: 1;
}
.mobile-topbar-title { font-weight: 700; font-size: 1rem; }

.sidebar-overlay {
  display: none;
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 150;
}
.sidebar-overlay:not(.hidden) { display: block; }

/* ── Menu mobile : sidebar fixe réduite (pas de hamburger) ──── */
@media (max-width: 767px) {
  .mobile-topbar { display: none; }
  .sidebar-overlay { display: none !important; }
  .sidebar {
    display: flex;
    width: 180px; min-width: 180px;
    transform: none;
  }
  .sidebar-brand { padding: var(--sp-3); gap: var(--sp-2); }
  .sidebar-brand img { width: 28px; height: 28px; }
  .sidebar-title { font-size: .78rem; }
  .sidebar-link { padding: var(--sp-2) var(--sp-3); font-size: .82rem; }
  .sidebar-link-icon { font-size: 1rem; width: 16px; }
  .sidebar-footer { padding: var(--sp-3); }
  .sidebar-user { font-size: .68rem; }
  .admin-content { margin-left: 180px; }
}

/* ── Historique multi-années ─────────────────────────────────── */
.comparaison-summary {
  display: flex; align-items: center; justify-content: space-around;
  gap: var(--sp-4); padding: var(--sp-5);
  background: var(--gris-fond); border-radius: var(--r-lg);
  margin-bottom: var(--sp-5); flex-wrap: wrap;
}
.comparaison-total { text-align: center; }
.comparaison-annee { display: block; font-size: .85rem; color: var(--ardoise-mid); font-weight: 600; margin-bottom: 4px; }
.comparaison-montant { display: block; font-size: 1.5rem; font-weight: 700; color: var(--ardoise); }
.comparaison-ecart { font-size: 1.2rem; font-weight: 700; }
.comparaison-subtitle { font-size: 1rem; font-weight: 700; margin: var(--sp-5) 0 var(--sp-3); color: var(--ardoise); }

/* ── Gamification — Podium ───────────────────────────────────── */
.podium-wrap { display:flex; align-items:flex-end; justify-content:center; gap:var(--sp-4); margin-bottom:var(--sp-6); padding:var(--sp-5) var(--sp-4) 0; }
.podium-place { display:flex; flex-direction:column; align-items:center; flex:1; max-width:200px; }
.podium-medaille { font-size:2.5rem; line-height:1; margin-bottom:var(--sp-2); }
.podium-nom { font-size:.85rem; font-weight:700; text-align:center; margin-bottom:4px; color:var(--ardoise); }
.podium-montant { font-size:1rem; font-weight:700; color:var(--vert); margin-bottom:2px; }
.podium-pct { font-size:.75rem; color:var(--ardoise-mid); margin-bottom:var(--sp-2); }
.podium-bloc { width:100%; border-radius:var(--r-md) var(--r-md) 0 0; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:900; color:rgba(255,255,255,.8); }
.podium-place--1 .podium-bloc { background:#EAB308; height:80px; }
.podium-place--2 .podium-bloc { background:#9CA3AF; height:60px; }
.podium-place--3 .podium-bloc { background:#B45309; height:40px; }
.ranking-palier { font-size:1.1rem; margin-left:auto; }
.ranking-badges { display:flex; flex-wrap:wrap; gap:4px; margin-top:var(--sp-2); font-size:1.2rem; }
.ranking-badges span { cursor:help; }
.ranking-badges--empty { font-size:.75rem; color:var(--ardoise-mid); font-style:italic; }
.badges-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:var(--sp-3); }
.badge-card { background:var(--gris-fond); border-radius:var(--r-md); padding:var(--sp-4); text-align:center; border:1.5px solid var(--ardoise-light); }
.badge-card-icon { font-size:2rem; margin-bottom:var(--sp-2); }
.badge-card-nom { font-size:.88rem; font-weight:700; margin-bottom:4px; color:var(--ardoise); }
.badge-card-desc { font-size:.75rem; color:var(--ardoise-mid); line-height:1.4; }
/* ── Vue terrain — Barre de progression équipier ─────────────── */
.terrain-progress-wrap { margin:var(--sp-3) var(--sp-4); background:var(--blanc); border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4); border:1.5px solid var(--gris-bord); }
.terrain-progress-label { display:flex; justify-content:space-between; font-size:.85rem; font-weight:600; color:var(--ardoise); margin-bottom:var(--sp-2); }
.terrain-progress-bar { height:10px; background:var(--ardoise-light); border-radius:99px; overflow:hidden; }
.terrain-progress-fill { height:100%; border-radius:99px; transition:width .5s ease; }
/* ── Historique ──────────────────────────────────────────────── */
.comparaison-summary { display:flex; align-items:center; justify-content:space-around; gap:var(--sp-4); padding:var(--sp-5); background:var(--gris-fond); border-radius:var(--r-lg); margin-bottom:var(--sp-5); flex-wrap:wrap; }
.comparaison-total { text-align:center; }
.comparaison-annee { display:block; font-size:.85rem; color:var(--ardoise-mid); font-weight:600; margin-bottom:4px; }
.comparaison-montant { display:block; font-size:1.5rem; font-weight:700; color:var(--ardoise); }
.comparaison-ecart { font-size:1.2rem; font-weight:700; }
.comparaison-subtitle { font-size:1rem; font-weight:700; margin:var(--sp-5) 0 var(--sp-3); color:var(--ardoise); }
/* ── Badge réseau ────────────────────────────────────────────── */
.network-badge { font-size:.72rem; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap; }
.network-badge--online  { background:rgba(34,197,94,.18); color:#BBF7D0; }
.network-badge--offline { background:rgba(239,68,68,.25); color:#FECACA; animation:pulse-offline 2s infinite; }
@keyframes pulse-offline { 0%,100%{opacity:1} 50%{opacity:.6} }

/* ── Correction d'un passage (terrain) ──────────────────────── */
.passage-edit-btn {
  background: none; border: none;
  font-size: 1rem; cursor: pointer;
  padding: 4px 6px; border-radius: var(--r-sm);
  opacity: .6; transition: opacity .15s, background .15s;
  flex-shrink: 0;
}
.passage-edit-btn:hover { opacity: 1; background: var(--gris-fond); }
.passage-edit-btn:active { transform: scale(.9); }
#modal-correction .modal-inner { max-height: 88vh; }
#modal-correction .modal-actions { flex-wrap: wrap; }

/* ── Section alerte (secteurs bloqués) ─────────────────────── */
.section-block--alerte {
  border-left: 4px solid var(--orange);
  background: #FFFBEB;
}
.section-block--alerte h2 { color: #92400E; }

/* ── Reconnaissance vocale ───────────────────────────────────── */
.btn-vocal {
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
  width: 100%; padding: var(--sp-4);
  background: linear-gradient(135deg, var(--ardoise) 0%, #1a1e30 100%);
  color: var(--blanc); border: none; border-radius: var(--r-md);
  font-family: var(--font); font-size: .95rem; font-weight: 600;
  cursor: pointer; transition: transform .1s, box-shadow .2s;
}
.btn-vocal:active { transform: scale(.98); }
.btn-vocal-icon { font-size: 1.3rem; line-height: 1; }
.btn-vocal--active {
  background: linear-gradient(135deg, var(--rouge) 0%, var(--rouge-dark) 100%);
  animation: pulse-vocal 1.4s infinite;
}
.btn-vocal--active .btn-vocal-icon { animation: bounce-mic .8s infinite; }
@keyframes pulse-vocal {
  0%,100% { box-shadow: 0 0 0 0 rgba(204,29,29,.5); }
  50%     { box-shadow: 0 0 0 12px rgba(204,29,29,0); }
}
@keyframes bounce-mic {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.2); }
}
.vocal-feedback {
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  font-size: .85rem; line-height: 1.4;
}
.vocal-feedback--listening { background: var(--ardoise-light); color: var(--ardoise); font-style: italic; }
.vocal-feedback--result    { background: var(--vert-light); color: #14532D; font-weight: 500; }
.vocal-feedback--error     { background: var(--rouge-light); color: var(--rouge-dark); }

/* ── Notifications (résumé quotidien) ────────────────────────── */
.notif-etat {
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  font-size: .85rem; line-height: 1.4; margin-bottom: var(--sp-4);
}
.notif-etat--on      { background: var(--vert-light); color: #14532D; font-weight: 500; }
.notif-etat--off     { background: var(--rouge-light); color: var(--rouge-dark); }
.notif-etat--pending { background: var(--jaune-light); color: #92400E; }

/* ── Mode binôme : choix du membre ───────────────────────────── */
.membres-choix { display: flex; flex-direction: column; gap: var(--sp-3); }
.membre-btn {
  padding: var(--sp-4); border: 2px solid var(--gris-bord);
  border-radius: var(--r-md); background: var(--blanc);
  font-family: var(--font); font-size: 1rem; font-weight: 600;
  color: var(--ardoise); cursor: pointer;
  transition: all .15s; text-align: center;
}
.membre-btn:hover  { border-color: var(--rouge); background: var(--rouge-light); }
.membre-btn:active { transform: scale(.98); }

/* ── Auteur d'une saisie (mode binôme) ──────────────────────── */
.passage-meta { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
.passage-auteur {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--ardoise); color: var(--blanc);
  font-size: .65rem; font-weight: 700; letter-spacing: .02em;
  cursor: help; flex-shrink: 0;
}

/* ── Boutons assistance (géoloc + vocal) ─────────────────────── */
.assist-btns { display: flex; gap: var(--sp-2); }
.btn-assist {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; padding: var(--sp-3);
  border: none; border-radius: var(--r-md); cursor: pointer;
  font-family: var(--font); font-size: .82rem; font-weight: 600;
  color: var(--blanc); transition: transform .1s;
}
.btn-assist:active { transform: scale(.97); }
.btn-assist-icon { font-size: 1.4rem; line-height: 1; }
.btn-assist--geo   { background: linear-gradient(135deg, #1D4ED8 0%, #1E3A8A 100%); }
.btn-assist--vocal { background: linear-gradient(135deg, var(--ardoise) 0%, #1a1e30 100%); }
.btn-assist--vocal.btn-vocal--active {
  background: linear-gradient(135deg, var(--rouge) 0%, var(--rouge-dark) 100%);
  animation: pulse-vocal 1.4s infinite;
}

/* ── Suggestions de géolocalisation ──────────────────────────── */
.geoloc-suggestions {
  background: var(--blanc); border: 1.5px solid var(--bleu);
  border-radius: var(--r-md); padding: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2);
}
.geoloc-suggestions--loading,
.geoloc-suggestions--vide,
.geoloc-suggestions--erreur {
  font-size: .85rem; line-height: 1.4; text-align: center;
  padding: var(--sp-4); border-color: var(--gris-bord); color: var(--ardoise-mid);
}
.geoloc-suggestions--erreur { border-color: var(--rouge); background: var(--rouge-light); color: var(--rouge-dark); }
.geoloc-header { font-size: .78rem; font-weight: 600; color: var(--bleu); margin-bottom: 2px; }
.geoloc-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  background: var(--gris-fond); border: 1.5px solid transparent;
  border-radius: var(--r-md); cursor: pointer;
  font-family: var(--font); text-align: left; width: 100%;
  transition: all .12s;
}
.geoloc-item:hover  { border-color: var(--bleu); background: var(--bleu-light); }
.geoloc-item:active { transform: scale(.98); }
.geoloc-adresse { font-size: .9rem; font-weight: 600; color: var(--ardoise); }
.geoloc-dist {
  font-size: .78rem; font-weight: 700; color: var(--bleu);
  background: var(--blanc); padding: 2px 8px; border-radius: 99px;
  flex-shrink: 0;
}
.geoloc-fermer {
  background: none; border: none; color: var(--ardoise-mid);
  font-size: .8rem; cursor: pointer; padding: var(--sp-2);
  text-decoration: underline;
}

/* ── Relances — vue admin regroupée ─────────────────────────── */
.relance-secteur {
  background: var(--blanc); border: 1.5px solid var(--gris-bord);
  border-left: 4px solid var(--orange); border-radius: var(--r-md);
  margin-bottom: var(--sp-4); overflow: hidden;
}
.relance-secteur-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  background: #FFFBEB; border-bottom: 1px solid var(--ardoise-light);
  flex-wrap: wrap;
}
.relance-commune {
  font-size: .78rem; color: var(--ardoise-mid); margin-left: var(--sp-2);
  text-transform: uppercase; letter-spacing: .04em;
}
.relance-meta { display: flex; align-items: center; gap: var(--sp-3); font-size: .82rem; color: var(--ardoise-mid); }
.relance-badge {
  background: var(--orange); color: var(--blanc);
  padding: 2px 10px; border-radius: 99px; font-weight: 700; font-size: .75rem;
}
.relance-rue { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--gris-fond); }
.relance-rue:last-child { border-bottom: none; }
.relance-rue-nom { font-size: .85rem; font-weight: 600; color: var(--ardoise); margin-bottom: var(--sp-2); }
.relance-numeros { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.relance-num {
  position: relative;
  min-width: 42px; padding: var(--sp-2) var(--sp-3);
  background: var(--jaune-light); border: 1.5px solid var(--jaune);
  border-radius: var(--r-sm); cursor: pointer;
  font-family: var(--font); font-size: .88rem; font-weight: 700; color: #78350F;
  transition: all .12s;
}
.relance-num:hover  { background: var(--jaune); color: var(--blanc); }
.relance-num:active { transform: scale(.94); }
.relance-vieux {
  position: absolute; top: -5px; right: -5px;
  background: var(--rouge); color: var(--blanc);
  width: 16px; height: 16px; border-radius: 50%;
  font-size: .65rem; line-height: 16px; text-align: center; font-weight: 900;
}
.relance-notes { font-size: .75rem; color: var(--ardoise-mid); margin-top: var(--sp-2); font-style: italic; }
.relance-aide { font-size: .8rem; color: var(--ardoise-mid); margin-top: var(--sp-4); line-height: 1.5; }

/* ── Relances — vue terrain équipier ───────────────────────── */
.terrain-relances {
  margin: 0 var(--sp-4) var(--sp-4);
  background: #FFFBEB; border: 1.5px solid var(--jaune);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
}
.terrain-relances-head {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: .88rem; font-weight: 700; color: #92400E;
  margin-bottom: var(--sp-3);
}
.terrain-relances-count {
  background: var(--orange); color: var(--blanc);
  padding: 1px 8px; border-radius: 99px; font-size: .75rem;
}
.terrain-relances-liste { display: flex; flex-direction: column; gap: var(--sp-2); }
.terrain-relance-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); width: 100%;
  padding: var(--sp-3); background: var(--blanc);
  border: 1.5px solid var(--jaune); border-radius: var(--r-sm);
  cursor: pointer; font-family: var(--font); text-align: left;
  transition: all .12s;
}
.terrain-relance-item:active { transform: scale(.98); background: var(--jaune-light); }
.terrain-relance-adr { font-size: .88rem; font-weight: 600; color: var(--ardoise); }
.terrain-relance-jours {
  font-size: .72rem; font-weight: 700; color: #92400E;
  background: var(--jaune-light); padding: 2px 7px; border-radius: 99px;
  flex-shrink: 0;
}
.terrain-relances-aide { font-size: .72rem; color: var(--ardoise-mid); margin-top: var(--sp-2); font-style: italic; }

/* ── Relances côté terrain équipier ─────────────────────────── */
.terrain-relances-wrap {
  margin: 0 var(--sp-4) var(--sp-3);
  background: #FFFBEB; border: 1.5px solid var(--jaune);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
}
.terrain-relances-head {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: .9rem; font-weight: 700; color: #92400E;
  margin-bottom: var(--sp-3);
}
.terrain-relances-count {
  background: var(--jaune); color: #78350F;
  font-size: .75rem; font-weight: 700;
  padding: 1px 8px; border-radius: 99px;
}
.terrain-relance-secteur { margin-bottom: var(--sp-3); }
.terrain-relance-secteur:last-of-type { margin-bottom: 0; }
.terrain-relance-secteur-nom {
  font-size: .78rem; font-weight: 700; color: var(--ardoise-mid);
  text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--sp-2);
}
.terrain-relance-rue {
  display: flex; align-items: flex-start; gap: var(--sp-2);
  flex-wrap: wrap; margin-bottom: var(--sp-2);
}
.terrain-relance-rue-nom {
  font-size: .85rem; color: var(--ardoise); flex: 1 1 100%;
}
.terrain-relance-nums { display: flex; flex-wrap: wrap; gap: 4px; }
.terrain-relance-num {
  min-width: 36px; padding: 5px 8px;
  background: var(--blanc); border: 1.5px solid var(--jaune);
  border-radius: var(--r-sm); cursor: pointer;
  font-family: var(--font); font-size: .82rem; font-weight: 700;
  color: #92400E; transition: all .12s;
}
.terrain-relance-num:hover  { background: var(--jaune); color: var(--blanc); }
.terrain-relance-num:active { transform: scale(.92); }
.terrain-relance-aide {
  font-size: .72rem; color: var(--ardoise-mid); font-style: italic;
  margin-top: var(--sp-2); padding-top: var(--sp-2);
  border-top: 1px solid rgba(234,179,8,.3);
}

/* ── Raccourcis de saisie (fluidité terrain) ────────────────── */
.raccourcis-adresse {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
  padding: var(--sp-2) 0;
}
.rac-label {
  font-size: .74rem; color: var(--ardoise-mid); font-weight: 600;
  flex: 1 1 100%; margin-bottom: 2px;
}
.rac-btn {
  border: 1.5px solid var(--gris-bord); border-radius: var(--r-sm);
  background: var(--blanc); cursor: pointer;
  font-family: var(--font); font-weight: 700;
  transition: all .12s;
}
.rac-btn:active { transform: scale(.92); }
.rac-btn--num {
  min-width: 40px; padding: 7px 10px;
  font-size: .9rem; color: var(--bleu); border-color: var(--bleu);
}
.rac-btn--num:hover { background: var(--bleu); color: var(--blanc); }
.rac-btn--annuler {
  flex: 1 1 100%; padding: 7px var(--sp-3);
  font-size: .78rem; font-weight: 600;
  color: var(--rouge-dark); border-color: var(--rouge-light);
  background: var(--rouge-light); text-align: left;
}
.rac-btn--annuler:hover { background: #f8b4b4; }

/* ── Bandeau de stats terrain (boîtes restantes + totaux) ───── */
.terrain-stats {
  margin: 0 var(--sp-4) var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.ts-compteur {
  background: var(--blanc); border: 1.5px solid var(--gris-bord);
  border-radius: var(--r-md); padding: var(--sp-4);
  text-align: center;
}
.ts-compteur-chiffre {
  font-size: 2.6rem; font-weight: 800; line-height: 1;
  letter-spacing: -.02em;
}
.ts-compteur-label {
  font-size: .82rem; font-weight: 600; color: var(--ardoise-mid);
  margin-top: 2px; margin-bottom: var(--sp-3);
}
.ts-barre {
  height: 8px; background: var(--ardoise-light);
  border-radius: 99px; overflow: hidden;
}
.ts-barre-fill { height: 100%; border-radius: 99px; transition: width .45s ease; }
.ts-compteur-detail {
  font-size: .74rem; color: var(--ardoise-mid); margin-top: var(--sp-2);
}
.ts-chiffres {
  display: flex; gap: var(--sp-2);
  background: var(--blanc); border: 1.5px solid var(--gris-bord);
  border-radius: var(--r-md); padding: var(--sp-3);
}
.ts-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; text-align: center;
}
.ts-item + .ts-item { border-left: 1px solid var(--ardoise-light); }
.ts-val { font-size: 1.05rem; font-weight: 700; color: var(--ardoise); }
.ts-item--montant .ts-val { color: var(--vert); }
.ts-lbl { font-size: .68rem; color: var(--ardoise-mid); line-height: 1.2; }

/* ── Compteur sur les cartes de secteur (accueil équipier) ──── */
.terrain-secteur-reste { margin-top: var(--sp-2); }
.tsr-barre {
  height: 5px; background: var(--ardoise-light);
  border-radius: 99px; overflow: hidden; margin-bottom: 4px;
}
.tsr-fill { height: 100%; border-radius: 99px; transition: width .4s; }
.tsr-txt { font-size: .74rem; color: var(--ardoise-mid); }

/* ── Statut "Offert" ────────────────────────────────────────── */
.passage-statuts--4 { flex-wrap: wrap; }
.passage-statuts--4 .statut-btn { flex: 1 1 calc(50% - 4px); font-size: .82rem; }
.statut-btn--offert:hover, .statut-btn--offert.statut-btn--selected {
  background: var(--bleu-light); border-color: var(--bleu); color: var(--bleu);
}
.badge--offert { background: var(--bleu-light); color: var(--bleu); }
.passage-item--offert .passage-statut-dot { background: var(--bleu); }
.tr--offert td { border-left: 3px solid var(--bleu); }

/* ── Compteur de calendriers en poche ───────────────────────── */
.ts-stock {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--bleu-light); border: 1.5px solid var(--bleu);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
}
.ts-stock-icon { font-size: 1.2rem; }
.ts-stock-val { font-size: 1.4rem; font-weight: 800; color: var(--bleu); }
.ts-stock-lbl { font-size: .82rem; color: var(--bleu); font-weight: 600; flex: 1; }
.ts-stock-edit {
  background: none; border: none; cursor: pointer;
  font-size: .95rem; opacity: .6; padding: 4px;
}
.ts-stock-edit:hover { opacity: 1; }
.ts-stock-init {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
  width: 100%; padding: var(--sp-3) var(--sp-4);
  background: var(--blanc); border: 1.5px dashed var(--gris-bord);
  border-radius: var(--r-md); cursor: pointer;
  font-family: var(--font); font-size: .85rem; color: var(--ardoise-mid);
}
.ts-stock-init span { font-weight: 700; color: var(--bleu); }
.ts-stock-init:hover { border-color: var(--bleu); background: var(--bleu-light); }
.ts-val small { font-size: .7rem; color: var(--bleu); font-weight: 700; }

/* ── Mon bilan (équipier) ───────────────────────────────────── */
.bilan-modal { max-width: 480px; }
.bilan-sous { font-size: .85rem; color: var(--ardoise-mid); margin: -8px 0 var(--sp-4); }
.bilan-hero {
  display: flex; gap: var(--sp-3); margin-bottom: var(--sp-4);
}
.bilan-hero-item {
  flex: 1; text-align: center; padding: var(--sp-4);
  background: var(--ardoise); color: var(--blanc);
  border-radius: var(--r-md);
}
.bilan-hero-item--argent { background: var(--vert); }
.bh-val { display: block; font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
.bh-lbl { display: block; font-size: .72rem; opacity: .85; margin-top: 2px; }

.bilan-remise {
  background: var(--jaune-light); border: 1.5px solid var(--jaune);
  border-radius: var(--r-md); padding: var(--sp-4); margin-bottom: var(--sp-4);
}
.bilan-remise-titre { font-size: .88rem; font-weight: 700; color: #78350F; margin-bottom: var(--sp-3); }
.bilan-remise-lignes { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.bilan-remise-lignes > div { display: flex; justify-content: space-between; color: #78350F; }
.bilan-remise-total {
  border-top: 1.5px solid var(--jaune); padding-top: 6px; margin-top: 2px;
  font-size: 1rem; font-weight: 700;
}
.bilan-note { font-size: .72rem; color: #92400E; margin-top: var(--sp-2); font-style: italic; }

.bilan-detail {
  display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4);
}
.bd-item {
  flex: 1 1 auto; padding: var(--sp-2) var(--sp-3);
  background: var(--gris-fond); border-radius: var(--r-sm);
  font-size: .8rem; color: var(--ardoise-mid); text-align: center;
}
.bd-item strong { color: var(--ardoise); font-size: .95rem; }

.bilan-avancement {
  background: var(--gris-fond); border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-4);
}
.ba-head { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: var(--sp-2); }
.ba-head strong { color: var(--ardoise); }
.ba-detail { font-size: .74rem; color: var(--ardoise-mid); margin-top: var(--sp-2); }

.bilan-jours h3 { font-size: .95rem; font-weight: 700; margin-bottom: var(--sp-3); }
.bj-ligne {
  padding: var(--sp-3) 0; border-bottom: 1px solid var(--ardoise-light);
}
.bj-ligne:last-child { border: none; }
.bj-date { font-size: .88rem; font-weight: 700; color: var(--ardoise); text-transform: capitalize; }
.bj-chiffres { display: flex; gap: var(--sp-3); margin: 3px 0; }
.bj-cal  { font-size: .88rem; font-weight: 700; color: var(--bleu); }
.bj-mont { font-size: .88rem; font-weight: 700; color: var(--vert); }
.bj-secteurs { font-size: .74rem; color: var(--ardoise-mid); }
.bj-detail { font-size: .7rem; color: var(--ardoise-mid); margin-top: 2px; }
.bilan-vide { font-size: .85rem; color: var(--ardoise-mid); font-style: italic; }

/* ── Mode « rue en cours » ──────────────────────────────────── */
.mode-rue { margin: 0 var(--sp-4) var(--sp-3); }

.mr-toggle {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  width: 100%; padding: var(--sp-3);
  background: var(--blanc); border: 1.5px dashed var(--bleu);
  border-radius: var(--r-md); cursor: pointer;
  font-family: var(--font); font-size: .9rem; font-weight: 700; color: var(--bleu);
}
.mr-toggle:hover { background: var(--bleu-light); border-style: solid; }
.mr-toggle-sub { font-size: .72rem; font-weight: 400; color: var(--ardoise-mid); }

.mr-selecteur {
  background: var(--blanc); border: 1.5px solid var(--bleu);
  border-radius: var(--r-md); padding: var(--sp-3); margin-top: var(--sp-2);
}
.mr-sel-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .85rem; font-weight: 700; color: var(--ardoise); margin-bottom: var(--sp-2);
}
.mr-fermer, .mr-quitter {
  background: none; border: 1.5px solid var(--gris-bord); border-radius: var(--r-sm);
  cursor: pointer; font-family: var(--font); font-size: .74rem; font-weight: 600;
  color: var(--ardoise-mid); padding: 4px 9px;
}
.mr-quitter:hover, .mr-fermer:hover { background: var(--gris-fond); }
.mr-liste { display: flex; flex-direction: column; gap: 3px; max-height: 260px; overflow-y: auto; margin-top: var(--sp-2); }
.mr-rue {
  display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3); background: var(--gris-fond);
  border: 1.5px solid transparent; border-radius: var(--r-sm);
  cursor: pointer; font-family: var(--font); text-align: left; width: 100%;
}
.mr-rue:hover { border-color: var(--bleu); background: var(--bleu-light); }
.mr-rue-nom { font-size: .84rem; color: var(--ardoise); }
.mr-rue-prog { font-size: .76rem; font-weight: 700; flex-shrink: 0; }

.mr-grille-wrap {
  background: var(--blanc); border: 1.5px solid var(--bleu);
  border-radius: var(--r-md); padding: var(--sp-4);
}
.mr-grille-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: var(--sp-2); margin-bottom: var(--sp-2);
}
.mr-grille-rue { font-size: .95rem; font-weight: 700; color: var(--ardoise); }
.mr-grille-prog { font-size: .74rem; color: var(--ardoise-mid); }

.mr-cote { margin-top: var(--sp-3); }
.mr-cote-titre {
  font-size: .72rem; font-weight: 700; color: var(--ardoise-mid);
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: var(--sp-2);
}
.mr-nums { display: flex; flex-wrap: wrap; gap: 5px; }
.mr-num {
  min-width: 44px; min-height: 40px; padding: 7px 6px;
  background: var(--blanc); border: 1.5px solid var(--gris-bord);
  border-radius: var(--r-sm); cursor: pointer;
  font-family: var(--font); font-size: .88rem; font-weight: 700;
  color: var(--ardoise); transition: transform .1s;
}
.mr-num:active { transform: scale(.9); }
.mr-num--fait { box-shadow: 0 1px 3px rgba(0,0,0,.15); }

.mr-legende {
  display: flex; flex-wrap: wrap; gap: var(--sp-3);
  margin-top: var(--sp-4); padding-top: var(--sp-3);
  border-top: 1px solid var(--ardoise-light);
  font-size: .74rem; color: var(--ardoise-mid);
}
.mr-leg { display: flex; align-items: center; gap: 5px; }
.mr-leg i { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
.mr-vide { font-size: .85rem; color: var(--ardoise-mid); text-align: center; padding: var(--sp-4); }

/* ── Modale de saisie d'un numéro ───────────────────────────── */
.mn-modal { max-width: 380px; }
.mn-existant {
  font-size: .82rem; padding: var(--sp-2) var(--sp-3);
  background: var(--jaune-light); color: #78350F;
  border-radius: var(--r-sm); margin-bottom: var(--sp-3);
}
.mn-statuts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.mn-btn {
  padding: var(--sp-4) var(--sp-2); border: 2px solid var(--gris-bord);
  border-radius: var(--r-md); background: var(--blanc); cursor: pointer;
  font-family: var(--font); font-size: .88rem; font-weight: 700; color: var(--ardoise);
  transition: all .12s;
}
.mn-btn:active { transform: scale(.96); }
.mn-btn--don.mn-btn--sel    { background:#16A34A; border-color:#16A34A; color:#fff; }
.mn-btn--offert.mn-btn--sel { background:#2563EB; border-color:#2563EB; color:#fff; }
.mn-btn--refuse.mn-btn--sel { background:#EF4444; border-color:#EF4444; color:#fff; }
.mn-btn--absent.mn-btn--sel { background:#EAB308; border-color:#EAB308; color:#fff; }

/* ── Ajout manuel de numéros (lieux-dits) ───────────────────── */
.mr-ajouter {
  width: 100%; margin-top: var(--sp-3); padding: var(--sp-3);
  background: var(--blanc); border: 1.5px dashed var(--gris-bord);
  border-radius: var(--r-md); cursor: pointer;
  font-family: var(--font); font-size: .82rem; font-weight: 600;
  color: var(--ardoise-mid);
}
.mr-ajouter:hover { border-color: var(--bleu); color: var(--bleu); background: var(--bleu-light); }
.mr-num--ajout { border-style: dashed; }
.mr-num--ajout.mr-num--fait { border-style: solid; box-shadow: 0 0 0 2px rgba(37,99,235,.25); }

/* ── Fusion d'adresses & inhabitée ──────────────────────────── */
.mr-num--inhab {
  background: repeating-linear-gradient(45deg, #f4f5f9, #f4f5f9 4px, #e5e7eb 4px, #e5e7eb 8px) !important;
  color: var(--ardoise-mid) !important;
  border-color: var(--gris-bord) !important;
  text-decoration: line-through;
  opacity: .75;
}
.mr-num sup {
  font-size: .58rem; font-weight: 800;
  vertical-align: super; margin-left: 1px;
}
.mn-fusion, .mn-inhab {
  font-size: .78rem; line-height: 1.45;
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm);
  margin-bottom: var(--sp-3);
}
.mn-fusion { background: var(--bleu-light); color: var(--bleu); }
.mn-inhab  { background: var(--gris-fond); color: var(--ardoise-mid); }
.mn-lien {
  background: none; border: none; cursor: pointer;
  font-family: var(--font); font-size: .72rem; font-weight: 700;
  text-decoration: underline; color: inherit; padding: 0 0 0 4px;
}
.mn-outils {
  display: flex; gap: var(--sp-2); flex-wrap: wrap;
  margin-bottom: var(--sp-3); padding-top: var(--sp-2);
  border-top: 1px solid var(--ardoise-light);
}
.mn-outil {
  flex: 1 1 auto; padding: var(--sp-2) var(--sp-3);
  background: var(--gris-fond); border: 1.5px solid var(--gris-bord);
  border-radius: var(--r-sm); cursor: pointer;
  font-family: var(--font); font-size: .76rem; font-weight: 600;
  color: var(--ardoise-mid); white-space: nowrap;
}
.mn-outil:hover { border-color: var(--bleu); color: var(--bleu); background: var(--bleu-light); }

/* ── Notes persistantes par adresse ─────────────────────────── */
.mr-pin { font-size: .55rem; vertical-align: super; margin-left: 1px; font-style: normal; }
.mn-note-perm {
  font-size: .8rem; line-height: 1.45;
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm);
  background: var(--jaune-light); color: #78350F;
  margin-bottom: var(--sp-3);
}

/* ── Suivi des remises ──────────────────────────────────────── */
.bilan-remises-suivi {
  margin-top: var(--sp-3); padding-top: var(--sp-3);
  border-top: 1.5px solid var(--jaune);
  display: flex; flex-direction: column; gap: 6px;
}
.brs-ligne { display: flex; justify-content: space-between; font-size: .85rem; color: #78350F; }
.brs-ligne--reste { font-weight: 700; font-size: .95rem; }
.brs-du { color: var(--rouge-dark); }
.brs-ok { color: #14532D; }
.brs-histo {
  margin-top: var(--sp-2); padding-top: var(--sp-2);
  border-top: 1px dashed rgba(234,179,8,.5);
  display: flex; flex-direction: column; gap: 4px;
}
.brs-item {
  display: grid; grid-template-columns: auto auto 1fr; gap: var(--sp-2);
  font-size: .74rem; color: #92400E; align-items: baseline;
}
.brs-item > span:nth-child(2) { font-weight: 700; }
.brs-detail { font-size: .68rem; opacity: .8; }

.btn-remis {
  display: flex; flex-direction: column; align-items: flex-start;
  background: var(--vert-light); border: 1.5px solid var(--vert);
  border-radius: var(--r-sm); padding: 3px 8px; cursor: pointer;
  font-family: var(--font); font-size: .82rem; font-weight: 700; color: #14532D;
}
.btn-remis small { font-size: .62rem; font-weight: 400; opacity: .8; }
.btn-remis:hover { background: var(--vert); color: var(--blanc); }

.vr-resume {
  display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4);
}
.vr-resume > div {
  flex: 1; text-align: center; padding: var(--sp-3);
  background: var(--gris-fond); border-radius: var(--r-md);
}
.vr-resume span { display: block; font-size: .7rem; color: var(--ardoise-mid); }
.vr-resume strong { display: block; font-size: 1.05rem; margin-top: 2px; }
.vr-du  { background: var(--rouge-light) !important; color: var(--rouge-dark); }
.vr-ok  { background: var(--vert-light) !important; color: #14532D; }
.mr-part { font-size:.66rem; font-style:normal; font-weight:600; color:var(--bleu);
  background:var(--bleu-light); padding:1px 5px; border-radius:99px; }

/* ── Détection GPS du secteur ───────────────────────────────── */
.btn-detect {
  width: calc(100% - 32px); margin: 0 var(--sp-4) var(--sp-3);
  padding: var(--sp-3);
  background: linear-gradient(135deg, #1D4ED8 0%, #1E3A8A 100%);
  color: var(--blanc); border: none; border-radius: var(--r-md);
  cursor: pointer; font-family: var(--font);
  font-size: .9rem; font-weight: 700;
}
.btn-detect:active { transform: scale(.98); }
.detect-resultat {
  margin: 0 var(--sp-4) var(--sp-3); padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md); border: 1.5px solid var(--gris-bord);
  background: var(--blanc); font-size: .85rem;
}
.detect-resultat--loading { text-align: center; color: var(--ardoise-mid); font-style: italic; }
.detect-resultat--ok    { border-color: var(--vert); background: var(--vert-light); }
.detect-resultat--multi { border-color: var(--bleu); background: var(--bleu-light); }
.detect-resultat--vide  { color: var(--ardoise-mid); text-align: center; }
.detect-resultat--erreur{ border-color: var(--rouge); background: var(--rouge-light); color: var(--rouge-dark); }
.dr-titre { font-weight: 700; margin-bottom: 2px; }
.dr-sous  { font-size: .76rem; color: var(--ardoise-mid); margin-bottom: var(--sp-2); }

/* ── Invitation à installer l'application ───────────────────── */
.install-banniere {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 9000;
  background: var(--blanc); border: 1.5px solid var(--gris-bord);
  border-radius: var(--r-lg); box-shadow: 0 8px 28px rgba(0,0,0,.22);
  padding: var(--sp-4);
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  animation: ib-monte .3s ease;
  max-width: 560px; margin: 0 auto;
}
@keyframes ib-monte { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.ib-corps { display: flex; align-items: center; gap: var(--sp-3); flex: 1 1 240px; }
.ib-icone { width: 46px; height: 46px; border-radius: 11px; flex-shrink: 0; }
.ib-txt { display: flex; flex-direction: column; gap: 2px; }
.ib-txt strong { font-size: .92rem; color: var(--ardoise); }
.ib-txt span   { font-size: .76rem; color: var(--ardoise-mid); line-height: 1.35; }
.ib-txt b { color: var(--ardoise); }
.ib-actions { display: flex; gap: var(--sp-2); align-items: center; }
.ib-installer {
  padding: 9px 18px; background: var(--rouge); color: var(--blanc);
  border: none; border-radius: var(--r-md); cursor: pointer;
  font-family: var(--font); font-size: .85rem; font-weight: 700;
}
.ib-installer:active { transform: scale(.96); }
.ib-fermer {
  padding: 9px 12px; background: none; border: none; cursor: pointer;
  font-family: var(--font); font-size: .78rem; color: var(--ardoise-mid);
  text-decoration: underline;
}

/* ── Bandeau de mise à jour ─────────────────────────────────── */
.maj-banniere {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9500;
  background: linear-gradient(135deg, #16A34A 0%, #047857 100%);
  color: var(--blanc); padding: var(--sp-3) var(--sp-4);
  display: flex; align-items: center; justify-content: space-between;

  <script type="module">
// ============================================================
// firebase.js — Configuration et initialisation Firebase
// Amicale SP Pacy-sur-Eure — Tournée Calendriers
// ============================================================

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCj7etN5gV8CckkOBiFaKn38D_onZCIE2A",
  authDomain:        "calendrier-pacy.firebaseapp.com",
  projectId:         "calendrier-pacy",
  storageBucket:     "calendrier-pacy.firebasestorage.app",
  messagingSenderId: "767402684897",
  appId:             "1:767402684897:web:134c456b1de29b2dace2a0"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  getFirestore, initializeFirestore, persistentLocalCache, persistentSingleTabManager,
  collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  query, where, orderBy, onSnapshot, serverTimestamp, increment,
  enableNetwork, disableNetwork, writeBatch
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import {
  getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

let db;
try {
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({
      tabManager: persistentSingleTabManager({ forceOwnership: false })
    })
  });
} catch (e) {
  console.warn("Persistence hors-ligne indisponible:", e?.message);
  db = getFirestore(app);
}

const COLLECTIONS = {
  CONFIG:   "config",
  EQUIPES:  "equipes",
  SECTEURS: "secteurs",
  PASSAGES: "passages",
  ADMINS:   "admins",
  PINS:     "pins",     // { pin } → { equipeId } : le code est l'identifiant du document
  JOURNAL:  "journal"   // traçabilité des corrections et suppressions
};

const fsCollection = (name)          => collection(db, name);
const fsDoc        = (path, ...id)   => doc(db, path, ...id);
const fsAdd        = (col, data)     => addDoc(collection(db, col), { ...data, createdAt: serverTimestamp() });
const fsSet        = (col, id, data) => setDoc(doc(db, col, id), { ...data, updatedAt: serverTimestamp() }, { merge: true });
const fsUpdate     = (col, id, data) => updateDoc(doc(db, col, id), { ...data, updatedAt: serverTimestamp() });
const fsDelete     = (col, id)       => deleteDoc(doc(db, col, id));
const fsGet        = async (col, id) => { const s = await getDoc(doc(db, col, id)); return s.exists() ? { id: s.id, ...s.data() } : null; };
const fsGetAll     = async (col)     => { const s = await getDocs(collection(db, col)); return s.docs.map(d => ({ id: d.id, ...d.data() })); };
const fsQuery      = async (col, ...constraints) => {
  const s = await getDocs(query(collection(db, col), ...constraints));
  return s.docs.map(d => ({ id: d.id, ...d.data() }));
};
const fsListen     = (col, cb, ...constraints) => {
  const q = constraints.length ? query(collection(db, col), ...constraints) : collection(db, col);
  return onSnapshot(q, snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
};
const fsListenDoc  = (col, id, cb) =>
  onSnapshot(doc(db, col, id), snap => cb(snap.exists() ? { id: snap.id, ...snap.data() } : null));

// ── Session technique ────────────────────────────────────────
// Les règles Firestore exigent une session. Les équipiers (code PIN) n'ont
// pas de compte : on leur ouvre une session anonyme Firebase, ce qui permet
// aux règles de refuser tout accès direct à l'API hors de l'application.
let _sessionEnCours = null;
async function assurerSession() {
  if (auth.currentUser) return auth.currentUser;
  if (_sessionEnCours) return _sessionEnCours;
  _sessionEnCours = signInAnonymously(auth)
    .then(r => { _sessionEnCours = null; return r.user; })
    .catch(e => {
      _sessionEnCours = null;
      console.error("Session anonyme refusée :", e?.code || e);
      throw e;
    });
  return _sessionEnCours;
}

const estAnonyme = () => !!auth.currentUser?.isAnonymous;

const loginGoogle      = () => signInWithPopup(auth, googleProvider);
const getLoginRedirect = () => Promise.resolve(null);
const logoutGoogle     = () => signOut(auth);
const onAuth           = (cb) => onAuthStateChanged(auth, cb);

async function isAdmin(email) {
  if (!email) return false;
  const snap = await getDoc(doc(db, COLLECTIONS.ADMINS, String(email).trim().toLowerCase()));
  return snap.exists();
}

// Connexion par code PIN.
// Le PIN sert d'identifiant de document dans /pins : il faut donc connaître
// le code exact pour obtenir la moindre information. La collection n'est pas
// énumérable (règle "list" réservée aux administrateurs).
async function loginPin(pin) {
  const ref = await fsGet(COLLECTIONS.PINS, String(pin));
  if (!ref || !ref.equipeId) {
    // Repli sur l'ancien stockage, le temps que la migration soit faite
    const legacy = await fsQuery(COLLECTIONS.EQUIPES, where("pin", "==", pin));
    return legacy.length ? legacy[0] : null;
  }
  const equipe = await fsGet(COLLECTIONS.EQUIPES, ref.equipeId);
  return equipe || null;
}

const _networkListeners = [];
let _isOnline = navigator.onLine;
window.addEventListener("online",  () => { _isOnline = true;  _networkListeners.forEach(cb => cb(true)); });
window.addEventListener("offline", () => { _isOnline = false; _networkListeners.forEach(cb => cb(false)); });
function isOnline() { return _isOnline; }
function onNetworkChange(cb) {
  _networkListeners.push(cb);
  return () => { const idx = _networkListeners.indexOf(cb); if (idx > -1) _networkListeners.splice(idx, 1); };
}


// secteurs.js — Gestion des secteurs géographiques

const STATUT_SECTEUR = { LIBRE:"libre", AFFECTE:"affecte", EN_COURS:"en_cours", TERMINE:"termine" };
const STATUT_LABEL   = { libre:"Non affecté", affecte:"Affecté", en_cours:"En cours", termine:"Terminé" };

async function creerSecteur({ nom, commune, description="", rues=[], couleur="#EF4444" }) {
  if (!nom || !commune) throw new Error("Nom et commune obligatoires");
  return fsAdd(COLLECTIONS.SECTEURS, { nom, commune, description, rues, couleur, statut:STATUT_SECTEUR.LIBRE, equipeId:null, equipNom:null, totalCollecte:0, nbFoyersVisites:0, nbFoyersAbsents:0, nbFoyersTotal:0, dateDebut:null, dateFin:null });
}
async function mettreAJourSecteur(id, data) { return fsUpdate(COLLECTIONS.SECTEURS, id, data); }
async function supprimerSecteur(id) { return fsDelete(COLLECTIONS.SECTEURS, id); }
async function affecterEquipe(secteurId, equipeId, equipeNom) {
  return fsUpdate(COLLECTIONS.SECTEURS, secteurId, { equipeId, equipNom: equipeNom, statut: STATUT_SECTEUR.AFFECTE });
}
async function desaffecterEquipe(secteurId) {
  return fsUpdate(COLLECTIONS.SECTEURS, secteurId, { equipeId: null, equipNom: null, statut: STATUT_SECTEUR.LIBRE });
}
async function cloturerSecteur(id) { return fsUpdate(COLLECTIONS.SECTEURS, id, { statut: STATUT_SECTEUR.TERMINE, dateFin: new Date().toISOString() }); }
async function demarrerSecteur(id) { return fsUpdate(COLLECTIONS.SECTEURS, id, { statut: STATUT_SECTEUR.EN_COURS, dateDebut: new Date().toISOString() }); }
async function lireSecteurs() { return fsGetAll(COLLECTIONS.SECTEURS); }
async function secteursParEquipe(equipeId) {
  return fsQuery(COLLECTIONS.SECTEURS, where("equipeId", "==", equipeId));
}
async function lireSecteur(id) { return fsGet(COLLECTIONS.SECTEURS, id); }
function ecouterSecteurs(callback) {
  return fsListen(COLLECTIONS.SECTEURS, (secteurs) => {
    secteurs.sort((a, b) => (a.commune + a.nom).localeCompare(b.commune + b.nom));
    callback(secteurs);
  });
}
function ecouterSecteursEquipe(equipeId, callback) {
  return fsListen(COLLECTIONS.SECTEURS, callback, where("equipeId", "==", equipeId));
}
async function recalculerTotauxSecteur(secteurId) {
  const passages = await fsQuery(COLLECTIONS.PASSAGES, where("secteurId", "==", secteurId));
  let totalCollecte=0, nbFoyersVisites=0, nbFoyersAbsents=0, nbCalendriers=0;
  for (const p of passages) {
    // Boîtes "traitées" : don, offert et refus (l'absent reste à revoir)
    if (p.statut==="don")    { totalCollecte += Number(p.montant||0); nbFoyersVisites++; nbCalendriers++; }
    if (p.statut==="offert") { nbFoyersVisites++; nbCalendriers++; }
    if (p.statut==="refuse") { nbFoyersVisites++; }
    if (p.statut==="absent" || p.statut==="relance") { nbFoyersAbsents++; }
  }
  const totaux = { totalCollecte, nbFoyersVisites, nbFoyersAbsents, nbCalendriers, nbFoyersTotal: passages.length };
  await fsUpdate(COLLECTIONS.SECTEURS, secteurId, totaux);
  return totaux;
}
async function statsGlobales() {
  const secteurs = await lireSecteurs();
  return {
    total: secteurs.length,
    libre: secteurs.filter(s=>s.statut===STATUT_SECTEUR.LIBRE).length,
    affecte: secteurs.filter(s=>s.statut===STATUT_SECTEUR.AFFECTE).length,
    en_cours: secteurs.filter(s=>s.statut===STATUT_SECTEUR.EN_COURS).length,
    termine: secteurs.filter(s=>s.statut===STATUT_SECTEUR.TERMINE).length,
    totalCollecte: secteurs.reduce((sum, s) => sum + (s.totalCollecte||0), 0)
  };
}

// ── Compléments d'adresses par rue (lieux-dits, BAN incomplète) ──
// Stockés dans le secteur : partagés entre équipiers et conservés d'une année sur l'autre
// Format : { "nom de rue normalisé": ["12", "12bis", "Ferme"] }

function normRue(s) {
  return (s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}

async function ajouterComplements(secteurId, rue, numeros) {
  const secteur = await fsGet(COLLECTIONS.SECTEURS, secteurId);
  if (!secteur) throw new Error("Secteur introuvable");
  const comp = secteur.ruesComplements || {};
  const clef = normRue(rue);
  const actuels = comp[clef] || [];
  let ajoutes = 0;
  for (const n of numeros) {
    const v = String(n).trim();
    if (v && !actuels.includes(v)) { actuels.push(v); ajoutes++; }
  }
  comp[clef] = actuels;
  await fsUpdate(COLLECTIONS.SECTEURS, secteurId, { ruesComplements: comp });
  return ajoutes;
}

async function retirerComplement(secteurId, rue, numero) {
  const secteur = await fsGet(COLLECTIONS.SECTEURS, secteurId);
  if (!secteur) throw new Error("Secteur introuvable");
  const comp = secteur.ruesComplements || {};
  const clef = normRue(rue);
  comp[clef] = (comp[clef] || []).filter(x => x !== String(numero));
  if (comp[clef].length === 0) delete comp[clef];
  await fsUpdate(COLLECTIONS.SECTEURS, secteurId, { ruesComplements: comp });
}

// Lit les compléments d'une rue depuis un objet secteur déjà chargé
function lireComplements(secteur, rue) {
  if (!secteur || !secteur.ruesComplements) return [];
  return secteur.ruesComplements[normRue(rue)] || [];
}

// ── Fusions d'adresses (une seule boîte pour plusieurs adresses) ──
// Format : [{ principale: "11 Rue du Moulin", secondaires: ["13 Rue du Moulin", "2 Rue des Soupirs"] }]
// Définitives : conservées d'une tournée à l'autre.

async function fusionnerAdresses(secteurId, principale, secondaires) {
  const secteur = await fsGet(COLLECTIONS.SECTEURS, secteurId);
  if (!secteur) throw new Error("Secteur introuvable");
  const fusions = secteur.fusions || [];

  const norm = s => (s||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');

  // Retirer ces adresses d'éventuelles fusions existantes
  const toutes = [principale, ...secondaires].map(norm);
  let nettoyees = fusions
    .filter(f => !toutes.includes(norm(f.principale)))
    .map(f => ({
      ...f,
      secondaires: (f.secondaires||[]).filter(s => !toutes.includes(norm(s)))
    }))
    .filter(f => f.secondaires.length > 0);

  nettoyees.push({ principale, secondaires: [...new Set(secondaires)] });
  await fsUpdate(COLLECTIONS.SECTEURS, secteurId, { fusions: nettoyees });
  return nettoyees.length;
}

async function annulerFusion(secteurId, principale) {
  const secteur = await fsGet(COLLECTIONS.SECTEURS, secteurId);
  if (!secteur) throw new Error("Secteur introuvable");
  const norm = s => (s||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const fusions = (secteur.fusions || []).filter(f => norm(f.principale) !== norm(principale));
  await fsUpdate(COLLECTIONS.SECTEURS, secteurId, { fusions });
}

// Renvoie la liste plate de toutes les adresses secondaires (à masquer des grilles)
function adressesSecondaires(secteur) {
  if (!secteur || !secteur.fusions) return [];
  return secteur.fusions.flatMap(f => f.secondaires || []);
}

// Trouve la fusion dont fait partie une adresse (comme principale ou secondaire)
function trouverFusion(secteur, adresse) {
  if (!secteur || !secteur.fusions) return null;
  const norm = s => (s||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const a = norm(adresse);
  return secteur.fusions.find(f =>
    norm(f.principale) === a || (f.secondaires||[]).some(s => norm(s) === a)) || null;
}

// ── Adresses marquées inhabitées (retirées du décompte, définitif) ──
async function marquerInhabitee(secteurId, adresse, inhabitee = true) {
  const secteur = await fsGet(COLLECTIONS.SECTEURS, secteurId);
  if (!secteur) throw new Error("Secteur introuvable");
  const norm = s => (s||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  let liste = secteur.inhabitees || [];
  if (inhabitee) {
    if (!liste.some(x => norm(x) === norm(adresse))) liste.push(adresse);
  } else {
    liste = liste.filter(x => norm(x) !== norm(adresse));
  }
  await fsUpdate(COLLECTIONS.SECTEURS, secteurId, { inhabitees: liste });
}

function estInhabitee(secteur, adresse) {
  if (!secteur || !secteur.inhabitees) return false;
  const norm = s => (s||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  return secteur.inhabitees.some(x => norm(x) === norm(adresse));
}

// ── Notes persistantes par adresse ──────────────────────────────
// Conservées d'une tournée à l'autre : "chien méchant", "sonner fort", etc.
// Stockées dans le secteur : { "adresse normalisée": { texte, adresse, maj } }

async function enregistrerNoteAdresse(secteurId, adresse, texte) {
  const secteur = await fsGet(COLLECTIONS.SECTEURS, secteurId);
  if (!secteur) throw new Error("Secteur introuvable");
  const notes = secteur.notesAdresses || {};
  const clef = normRue(adresse);
  if (texte && texte.trim()) {
    notes[clef] = { texte: texte.trim(), adresse, maj: new Date().toISOString() };
  } else {
    delete notes[clef];
  }
  await fsUpdate(COLLECTIONS.SECTEURS, secteurId, { notesAdresses: notes });
}

function lireNoteAdresse(secteur, adresse) {
  if (!secteur || !secteur.notesAdresses) return null;
  return secteur.notesAdresses[normRue(adresse)] || null;
}

function toutesLesNotes(secteur) {
  if (!secteur || !secteur.notesAdresses) return [];
  return Object.values(secteur.notesAdresses)
    .sort((a, b) => (a.adresse || '').localeCompare(b.adresse || '', 'fr'));
}

// ── Suivi des remises au trésorier ──────────────────────────────
// Enregistré au niveau de l'équipe : liste des remises effectuées

async function enregistrerRemise(equipeId, { montantEspeces = 0, montantCheques = 0, note = "", parQui = "" }) {
  const equipe = await fsGet(COLLECTIONS.EQUIPES, equipeId);
  if (!equipe) throw new Error("Équipe introuvable");
  const remises = equipe.remises || [];
  remises.push({
    id: `r${Date.now()}`,
    date: new Date().toISOString(),

async function supprimerRemise(equipeId, remiseId) {

function totalRemis(equipe) {
