async function renderSecteurs() {
  if (APP.role !== "admin") { naviguer("#login"); return; }
  stopUnsubs();

  document.getElementById("main").innerHTML = layoutAdmin("#secteurs", `
    <div class="page-header">
      <h1>Secteurs géographiques</h1>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="btn-vider-secteurs" class="btn btn--danger">🗑️ Tout supprimer</button>
        <button id="btn-import-csv" class="btn btn--ghost">📥 Importer CSV</button>
        <button id="btn-add-secteur" class="btn btn--primary">+ Nouveau secteur</button>
      </div>
    </div>
    <div class="filter-bar">
      <input id="search-secteur" class="input input--sm" placeholder="🔍 Rechercher une commune ou un secteur…" style="max-width:320px;">
    </div>
    <div id="secteurs-list"><div class="loader">Chargement…</div></div>
    <div id="modal-secteur" class="modal hidden"></div>
    <input type="file" id="input-csv" accept=".csv" class="hidden">
  `);
  bindLogout();

  let _secteursCache = [];

  document.getElementById("search-secteur")?.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q
      ? _secteursCache.filter(s =>
          s.commune.toLowerCase().includes(q) || s.nom.toLowerCase().includes(q))
      : _secteursCache;
    renderSecteursList(filtered);
  });

  document.getElementById("btn-add-secteur")?.addEventListener("click", () => showSecteurModal());

  document.getElementById("btn-import-csv")?.addEventListener("click", () => {
    document.getElementById("input-csv").click();
  });

  document.getElementById("btn-vider-secteurs")?.addEventListener("click", async () => {
    const secteurs = await lireSecteurs();
    if (secteurs.length === 0) { toast("Aucun secteur à supprimer", "info"); return; }

    if (!confirm(
      `⚠️ SUPPRIMER TOUS LES SECTEURS ?\n\n` +
      `${secteurs.length} secteur(s) vont être définitivement supprimés.\n` +
      `Les passages enregistrés ne seront plus rattachés à aucun secteur.\n\n` +
      `Cette action est IRRÉVERSIBLE.`
    )) return;

    const saisie = prompt(
      `Dernière confirmation.\n\nTape SUPPRIMER (en majuscules) pour confirmer la suppression des ${secteurs.length} secteurs :`
    );
    if (saisie !== "SUPPRIMER") { toast("Suppression annulée", "info"); return; }

    const btn = document.getElementById("btn-vider-secteurs");
    setLoading(btn, true);
    let ok = 0, ko = 0;
    for (const s of secteurs) {
      try { await supprimerSecteur(s.id); ok++; }
      catch(e) { console.error("Erreur suppression", s.nom, e); ko++; }
    }
    setLoading(btn, false);
    toast(`${ok} secteur(s) supprimé(s)${ko ? `, ${ko} erreur(s)` : ''}`, ko ? "error" : "success");
  });

  document.getElementById("input-csv")?.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const rows2d = parseCSV(text);
    if (rows2d.length < 2) { toast("CSV vide ou illisible", "error"); return; }
    const headers = rows2d[0];
    let created = 0, errors = 0;

    for (let i = 1; i < rows2d.length; i++) {
      const values = rows2d[i];
      const row = {};
      headers.forEach((h, idx) => row[h] = (values[idx] || '').trim());

      if (!row.nom || !row.commune) continue;

      try {
        await creerSecteur({
          nom: row.nom,
          commune: row.commune,
          description: row.description || '',
          rues: row.rues ? row.rues.split(';').map(r => r.trim()).filter(Boolean) : [],
          couleur: row.couleur || '#EF4444'
        });
        created++;
      } catch(err) {
        console.error('Erreur import ligne', i, err);
        errors++;
      }
    }
    toast(`Import terminé : ${created} secteur(s) créé(s)${errors ? `, ${errors} erreur(s)` : ''}`, errors ? "error" : "success");
    e.target.value = '';
  });

  const unsub = ecouterSecteurs((secteurs) => {
    _secteursCache = secteurs;
    const q = document.getElementById("search-secteur")?.value.trim().toLowerCase() || '';
    const filtered = q
      ? secteurs.filter(s => s.commune.toLowerCase().includes(q) || s.nom.toLowerCase().includes(q))
      : secteurs;
    renderSecteursList(filtered);
  });
  APP.unsubs.push(unsub);
}

function renderSecteursList(secteurs) {
  const list = document.getElementById("secteurs-list");
  if (!list) return;
  if (secteurs.length === 0) {
    const hasSearch = document.getElementById("search-secteur")?.value.trim();
    list.innerHTML = hasSearch
      ? `<p class="empty-state">Aucun secteur ne correspond à « ${hasSearch} ».</p>`
      : `<p class="empty-state">Aucun secteur. Commence par en créer un.</p>`;
    return;
  }
  const sorted = [...secteurs].sort((a, b) => (a.commune + a.nom).localeCompare(b.commune + b.nom));
  list.innerHTML = `
    <div class="secteurs-grid">
      ${sorted.map(s => `
        <div class="secteur-card secteur-card--${s.statut}" data-id="${s.id}">
          <div class="secteur-card-header">
            <span class="secteur-dot" style="background:${s.couleur || '#EF4444'}"></span>
            <strong>${h(s.nom)}</strong>
            <span class="badge badge--${s.statut}">${STATUT_LABEL[s.statut]}</span>
          </div>
          <div class="secteur-card-body">
            <div class="secteur-commune-label">${h(s.commune)}</div>
            <div class="secteur-equipe">${s.equipNom ? '👥 ' + h(s.equipNom) : '— Non affecté'}</div>
            <div class="secteur-montant">${formatMontant(s.totalCollecte)}</div>
            ${s.rues?.length ? `<div class="secteur-rues">${h(s.rues.join(', '))}</div>` : ''}
          </div>
          <div class="secteur-card-actions">
            <button class="btn btn--sm btn--ghost" onclick="ficheDeRoute('${s.id}')" title="Fiche de route imprimable">🖨️</button>
            <button class="btn btn--sm btn--ghost" onclick="editSecteur('${s.id}')">✏️ Modifier</button>
            <button class="btn btn--sm btn--ghost" onclick="affecterSecteur('${s.id}')">👥 Affecter</button>
            ${s.statut !== 'termine' ? `<button class="btn btn--sm btn--ghost" onclick="clotureSecteur('${s.id}')">✅ Clôturer</button>` : ''}
            <button class="btn btn--sm btn--danger" onclick="deleteSecteur('${s.id}')">🗑️</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

window.ficheDeRoute = async (secteurId) => {
  const secteur = await lireSecteur(secteurId);
  if (!secteur) { toast("Secteur introuvable", "error"); return; }

  const passages = await passagesDuSecteur(secteurId);
  const rues  = ruesDuSecteur(secteur);
  const notes = toutesLesNotes(secteur);
  const nrm = s => (s||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const secondaires = new Set(adressesSecondaires(secteur).map(nrm));
  const inhab       = new Set((secteur.inhabitees||[]).map(nrm));
  const noteParAdr  = {};
  notes.forEach(n => { noteParAdr[nrm(n.adresse)] = n.texte; });

  let totalFoyers = 0, dejaFaits = 0;
  const blocs = rues.map(r => {
    let nums = [];
    try { nums = numerosDeRue(secteur.commune, r.rue, r.restriction); } catch(e) {}
    const comp = lireComplements(secteur, r.rue);
    nums = [...new Set([...nums, ...comp])]
      .filter(n => !secondaires.has(nrm(`${n} ${r.rue}`)))
      .sort((a,b) => (parseInt(a)||9999) - (parseInt(b)||9999));
    nums.forEach(n => {
      const c = nrm(`${n} ${r.rue}`);
      if (!inhab.has(c)) totalFoyers++;
      if (passages.some(p => nrm(p.adresse) === c)) dejaFaits++;

async function renderEquipes() {
  if (APP.role !== "admin") { naviguer("#login"); return; }
  stopUnsubs();

  document.getElementById("main").innerHTML = layoutAdmin("#equipes", `
    <div class="page-header">
      <h1>Équipes</h1>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="btn-auto-affecter" class="btn btn--ghost">🔗 Affecter par nom</button>
        <button id="btn-vider-equipes" class="btn btn--danger">🗑️ Tout supprimer</button>
        <button id="btn-import-csv-equipe" class="btn btn--ghost">📥 Importer CSV</button>
        <button id="btn-add-equipe" class="btn btn--primary">+ Nouvelle équipe</button>
      </div>
    </div>
    <div id="equipes-list"><div class="loader">Chargement…</div></div>
    <div id="modal-equipe" class="modal hidden"></div>
    <input type="file" id="input-csv-equipe" accept=".csv" class="hidden">
  `);
  bindLogout();

  document.getElementById("btn-add-equipe")?.addEventListener("click", () => showEquipeModal());

  document.getElementById("btn-auto-affecter")?.addEventListener("click", async () => {
    if (!confirm("Affecter automatiquement chaque secteur à l'équipe portant son nom (ex: secteur \"Chambray\" → équipe \"Équipe Chambray\") ?\n\nLes secteurs déjà affectés à une autre équipe seront écrasés s'il y a correspondance.")) return;

    const btn = document.getElementById("btn-auto-affecter");
    setLoading(btn, true);
    try {
      const [equipes, secteurs] = await Promise.all([lireEquipes(), lireSecteurs()]);

      // Normalise un nom pour matcher : minuscules, sans accents, sans "équipe "
      const normalize = (s) => s
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/^equipe\s+/i, "")
        .trim();

      const equipesParNom = {};
      equipes.forEach(eq => { equipesParNom[normalize(eq.nom)] = eq; });

      let affectes = 0, sansMatch = 0;
      for (const s of secteurs) {
        const match = equipesParNom[normalize(s.nom)];
        if (match) {
          await affecterEquipe(s.id, match.id, match.nom);
          affectes++;
        } else {
          sansMatch++;
        }
      }
      toast(`Affectation automatique : ${affectes} secteur(s) affecté(s)${sansMatch ? `, ${sansMatch} sans correspondance` : ''}`, "success");
    } catch(e) {
      toast("Erreur : " + e.message, "error");
    }
    setLoading(btn, false);
  });

  document.getElementById("btn-import-csv-equipe")?.addEventListener("click", () => {
    document.getElementById("input-csv-equipe").click();
  });

  document.getElementById("btn-vider-equipes")?.addEventListener("click", async () => {
    const equipes = await lireEquipes();
    if (equipes.length === 0) { toast("Aucune équipe à supprimer", "info"); return; }

    if (!confirm(
      `⚠️ SUPPRIMER TOUTES LES ÉQUIPES ?\n\n` +
      `${equipes.length} équipe(s) vont être définitivement supprimées.\n` +
      `Les secteurs affectés perdront leur équipe.\n\n` +
      `Cette action est IRRÉVERSIBLE.`
    )) return;

    const saisie = prompt(
      `Dernière confirmation.\n\nTape SUPPRIMER (en majuscules) pour confirmer la suppression des ${equipes.length} équipes :`
    );
    if (saisie !== "SUPPRIMER") { toast("Suppression annulée", "info"); return; }

    const btn = document.getElementById("btn-vider-equipes");
    setLoading(btn, true);
    let ok = 0, ko = 0;
    for (const e of equipes) {
      try { await supprimerEquipe(e.id); ok++; }
      catch(err) { console.error("Erreur suppression", e.nom, err); ko++; }
    }
    setLoading(btn, false);
    toast(`${ok} équipe(s) supprimée(s)${ko ? `, ${ko} erreur(s)` : ''}`, ko ? "error" : "success");
  });

  document.getElementById("input-csv-equipe")?.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const rows2d = parseCSV(text);
    if (rows2d.length < 2) { toast("CSV vide ou illisible", "error"); return; }
    const headers = rows2d[0];
    let created = 0, errors = 0;

    for (let i = 1; i < rows2d.length; i++) {
      const values = rows2d[i];
      const row = {};
      headers.forEach((h, idx) => row[h] = (values[idx] || '').trim());

      if (!row.nom || !row.pin) continue;

      try {
        await creerEquipe({
          nom: row.nom,
          pin: row.pin,
          membres: row.membres ? row.membres.split(';').map(m => m.trim()).filter(Boolean) : []
        });
        created++;
      } catch(err) {
        console.error('Erreur import ligne', i, err);
        errors++;
      }
    }
    toast(`Import terminé : ${created} équipe(s) créée(s)${errors ? `, ${errors} erreur(s)` : ''}`, errors ? "error" : "success");
    e.target.value = '';
  });

  const unsub = ecouterEquipes(async (equipes) => {
    // Les PIN vivent dans une collection séparée : on les rattache pour l'affichage
    let pins = {};
    try { pins = await lirePins(); } catch(e) {}
    renderEquipesList(equipes.map(e => ({ ...e, pin: pins[e.id] || e.pin || null })));
  });
  APP.unsubs.push(unsub);
}

  if (!list) return;
  if (equipes.length === 0) {
    list.innerHTML = `<p class="empty-state">Aucune équipe. Commence par en créer une.</p>`;
    return;
  }
  list.innerHTML = `
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Équipe</th><th>PIN</th><th>Membres</th><th>Remis</th><th>Actions</th></tr></thead>
        <tbody>
          ${equipes.map(e => {
            const remis = totalRemis(e);
            const nbR = (e.remises || []).length;
            return `
            <tr>
              <td><strong>${h(e.nom)}</strong></td>
              <td>${e.pin ? `<code class="pin-code">${e.pin}</code>`
                : '<span style="color:var(--orange);font-size:.75rem">à migrer</span>'}</td>
              <td>${h((e.membres || []).join(', ') || '—')}</td>
              <td>${remis > 0
                ? `<button class="btn-remis" onclick="voirRemises('${e.id}')">${formatMontant(remis)}<small>${nbR} remise${nbR>1?'s':''}</small></button>`
                : '<span style="color:var(--ardoise-mid);font-size:.8rem">—</span>'}</td>
              <td class="td-actions">
                <button class="btn btn--sm btn--ghost" onclick="editEquipe('${e.id}')">✏️</button>
                <button class="btn btn--sm btn--danger" onclick="deleteEquipe('${e.id}')">🗑️</button>
              </td>
            </tr>
          `;}).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function renderPassages() {
  if (APP.role !== "admin") { naviguer("#login"); return; }
  stopUnsubs();

  const secteurs = await lireSecteurs();

  document.getElementById("main").innerHTML = layoutAdmin("#passages", `
    <div class="page-header"><h1>Passages</h1></div>
    <div class="filter-bar">
      <select id="filter-secteur" class="input input--sm">
        <option value="">Tous les secteurs</option>
        ${secteurs.map(s => `<option value="${s.id}">${h(s.commune)} – ${h(s.nom)}</option>`).join('')}
      </select>
    </div>
    <div id="passages-list"><div class="loader">Chargement…</div></div>
  `);
  bindLogout();

  async function loadPassages() {
    const secteurId = document.getElementById("filter-secteur")?.value;
    let passages;
    if (secteurId) {
      passages = await passagesDuSecteur(secteurId);
    } else {
      passages = await fsGetAll(COLLECTIONS.PASSAGES);
      passages.sort((a,b) => (b.datePassage || "").localeCompare(a.datePassage || ""));
    }

// Regroupe les passages à relancer par secteur puis par rue
function grouperRelances(passages, secteurMap) {
  const parSecteur = {};
  for (const p of passages) {
    const s = secteurMap[p.secteurId] || {};
    const cle = p.secteurId || 'inconnu';
    if (!parSecteur[cle]) {
      parSecteur[cle] = {
        secteurId: p.secteurId,
        secteur: s.nom || 'Secteur inconnu',
        commune: s.commune || '',
        equipe: p.equipeNom || s.equipNom || '—',
        rues: {}, total: 0
      };
    }
    const g = parSecteur[cle];
    // Extraire la rue de l'adresse (« 12 Rue de la Mairie » → « Rue de la Mairie »)
    const adr = (p.adresse || '').trim();
    const m = adr.match(/^(\d+\s*[a-zA-Z]?)\s+(.+)$/);
    const numero = m ? m[1].trim() : (adr || '?');
    const rue    = m ? m[2].trim() : (adr ? '(rue non précisée)' : '(adresse non précisée)');

    if (!g.rues[rue]) g.rues[rue] = { rue, numeros: [], notes: [], passages: [] };
    g.rues[rue].numeros.push(numero);
    if (p.note) g.rues[rue].notes.push(p.note);
    g.rues[rue].passages.push(p);
    g.total++;
  }
  return Object.values(parSecteur)
    .map(g => ({
      ...g,
      rues: Object.values(g.rues).sort((a,b) => a.rue.localeCompare(b.rue))
                 .map(r => ({ ...r,
                   numeros: r.numeros.sort((a,b) => (parseInt(a)||9999)-(parseInt(b)||9999)) }))
    }))
    .sort((a,b) => b.total - a.total);
}

async function chargerRelances() {
  const list = document.getElementById("relances-list");
  if (!list) return;
  list.innerHTML = `<div class="loader">Chargement…</div>`;

  const [passages, secteurs] = await Promise.all([foyersARelancer(), lireSecteurs()]);
  const secteurMap = Object.fromEntries(secteurs.map(s => [s.id, s]));

  if (passages.length === 0) {
    list.innerHTML = `<p class="empty-state">🎉 Aucun foyer à relancer !</p>`;
    return;
  }

  const groupes = grouperRelances(passages, secteurMap);
  const maintenant = Date.now();

  list.innerHTML = `
    <p class="relances-count">${passages.length} foyer(s) à relancer · ${groupes.length} secteur(s) concerné(s)</p>
    ${groupes.map(g => `

          </div>
        </div>
        ${g.rues.map(r => `
          <div class="relance-rue">
            <div class="relance-rue-nom">${h(r.rue)}</div>
            <div class="relance-numeros">
              ${r.passages.map(p => {
                const j = p.datePassage ? Math.floor((maintenant - new Date(p.datePassage).getTime())/86400000) : null;
                const adr = (p.adresse||'').trim();
                const m = adr.match(/^(\d+\s*[a-zA-Z]?)\s+/);
                const num = m ? m[1].trim() : (adr || '?');
                return `<button class="relance-num" title="${adr}${j!==null?` — absent depuis ${j} j`:''}${p.note?` — ${h(p.note)}`:''}"
                          onclick="traiterRelance('${p.id}','${p.secteurId}')">

          </div>
        `).join('')}
      </div>
    `).join('')}
    <p class="relance-aide">Touche un numéro pour enregistrer le résultat de la relance. Le <strong>!</strong> signale une absence de plus de 7 jours.</p>
  `;
}

    }

};

}

async function renderStatistiques() {
  if (APP.role !== "admin") { naviguer("#login"); return; }
  stopUnsubs();

  document.getElementById("main").innerHTML = layoutAdmin("#statistiques", `
    <div class="page-header">
      <h1>📈 Statistiques</h1>
      <button id="btn-export-stats" class="btn btn--ghost">⬇️ Exporter</button>
    </div>
    <p style="font-size:.85rem;color:var(--ardoise-mid);margin-bottom:16px;line-height:1.5;">
      Analyse de la tournée en cours. Ces chiffres servent à calibrer les objectifs et les horaires de sortie de l'an prochain.
    </p>
    <div id="stats-content"><div class="loader">Calcul en cours…</div></div>
  `);
  bindLogout();

  let lignesSecteur = [];

  try {
    const [passages, secteurs] = await Promise.all([
      fsGetAll(COLLECTIONS.PASSAGES),
      lireSecteurs()
    ]);
    const el = document.getElementById("stats-content");

    if (passages.length === 0) {
      el.innerHTML = `<p class="empty-state">Aucun passage enregistré pour le moment.<br>
        <small>Les statistiques apparaîtront dès les premières saisies.</small></p>`;
      return;
    }

    const secteurMap = Object.fromEntries(secteurs.map(s => [s.id, s]));

    // ── Par secteur ──
    const parSecteur = {};
    for (const s of secteurs) {
      parSecteur[s.id] = {
        nom: s.nom, commune: s.commune,
        boites: nbFoyersSecteur(s),
        dons: 0, offerts: 0, refus: 0, absents: 0, montant: 0
      };
    }
    // Répartition horaire et par montant
    const parHeure = {};
    const parMontant = {};

    for (const p of passages) {
      const d = parSecteur[p.secteurId];
      if (d) {
        if (p.statut === "don")    { d.dons++;    d.montant += Number(p.montant || 0); }
        if (p.statut === "offert")   d.offerts++;
        if (p.statut === "refuse")   d.refus++;
        if (p.statut === "absent" || p.statut === "relance") d.absents++;
      }
      // Créneau horaire
      if (p.datePassage) {
        const h = new Date(p.datePassage).getHours();
        if (!parHeure[h]) parHeure[h] = { passages: 0, dons: 0, montant: 0 };
        parHeure[h].passages++;
        if (p.statut === "don") { parHeure[h].dons++; parHeure[h].montant += Number(p.montant || 0); }
      }
      // Montants les plus fréquents
      if (p.statut === "don" && p.montant > 0) {
        const m = Math.round(Number(p.montant));
        parMontant[m] = (parMontant[m] || 0) + 1;
      }
    }

    lignesSecteur = Object.values(parSecteur)
      .filter(d => d.dons + d.offerts + d.refus + d.absents > 0)
      .map(d => {
        const visites = d.dons + d.offerts + d.refus;
        const total = visites + d.absents;
        const calendriers = d.dons + d.offerts;
        return {
          ...d, visites, total, calendriers,
          tauxPlacement: d.boites > 0 ? (calendriers / d.boites) * 100 : null,
          tauxRefus: visites > 0 ? (d.refus / visites) * 100 : 0,
          tauxAbsence: total > 0 ? (d.absents / total) * 100 : 0,
          donMoyen: d.dons > 0 ? d.montant / d.dons : 0,
          avancement: d.boites > 0 ? (visites / d.boites) * 100 : null
        };
      })
      .sort((a, b) => b.montant - a.montant);

    // ── Chiffres globaux ──
    const gDons = lignesSecteur.reduce((s, d) => s + d.dons, 0);
    const gMontant = lignesSecteur.reduce((s, d) => s + d.montant, 0);
    const gVisites = lignesSecteur.reduce((s, d) => s + d.visites, 0);
    const gRefus = lignesSecteur.reduce((s, d) => s + d.refus, 0);
    const donMoyenGlobal = gDons > 0 ? gMontant / gDons : 0;
    const tauxRefusGlobal = gVisites > 0 ? (gRefus / gVisites) * 100 : 0;

    // ── Créneaux horaires ──
    const heures = Object.entries(parHeure)
      .map(([h, d]) => ({
        heure: Number(h), ...d,
        taux: d.passages > 0 ? (d.dons / d.passages) * 100 : 0,
        moyenne: d.dons > 0 ? d.montant / d.dons : 0
      }))
      .sort((a, b) => a.heure - b.heure);
    const maxPassages = Math.max(1, ...heures.map(h => h.passages));

    // ── Montants les plus donnés ──
    const montants = Object.entries(parMontant)
      .map(([m, n]) => ({ montant: Number(m), nb: n }))
      .sort((a, b) => b.nb - a.nb).slice(0, 8);
    const maxNb = Math.max(1, ...montants.map(m => m.nb));

    const coulTaux = (t) => t >= 45 ? "#16A34A" : t >= 30 ? "#EAB308" : t >= 20 ? "#F97316" : "#EF4444";

    el.innerHTML = `
      <div class="stats-grid" style="margin-bottom:20px;">
        <div class="stat-card stat-card--primary">
          <div class="stat-value">${formatMontant(donMoyenGlobal)}</div>
          <div class="stat-label">Don moyen</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${tauxRefusGlobal.toFixed(0)}%</div>
          <div class="stat-label">Taux de refus</div>
          <div class="stat-sub">${gRefus} refus sur ${gVisites} portes ouvertes</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${gDons}</div>
          <div class="stat-label">Dons enregistrés</div>
        </div>
      </div>

      <div class="section-block">
        <h2>Performance par secteur</h2>
        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>Secteur</th><th>Avancement</th><th>Taux de placement</th>
              <th>Don moyen</th><th>Refus</th><th>Absences</th><th>Collecté</th>
            </tr></thead>
            <tbody>
              ${lignesSecteur.map(d => `
                <tr>
                  <td><strong>${h(d.nom)}</strong>${d.commune !== d.nom ? `<br><small style="color:var(--ardoise-mid)">${h(d.commune)}</small>` : ''}</td>
                  <td>${d.avancement !== null ? `${d.avancement.toFixed(0)}%<br><small style="color:var(--ardoise-mid)">${d.visites}/${d.boites}</small>` : '—'}</td>
                  <td>${d.tauxPlacement !== null
                        ? `<strong style="color:${coulTaux(d.tauxPlacement)}">${d.tauxPlacement.toFixed(0)}%</strong><br><small style="color:var(--ardoise-mid)">${d.calendriers} cal.</small>`
                        : `${d.calendriers} cal.`}</td>
                  <td>${d.dons > 0 ? formatMontant(d.donMoyen) : '—'}</td>
                  <td>${d.tauxRefus.toFixed(0)}%<br><small style="color:var(--ardoise-mid)">${d.refus}</small></td>
                  <td>${d.tauxAbsence.toFixed(0)}%<br><small style="color:var(--ardoise-mid)">${d.absents}</small></td>
                  <td><strong>${formatMontant(d.montant)}</strong></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <p style="font-size:.76rem;color:var(--ardoise-mid);margin-top:8px;">
          Le <strong>taux de placement</strong> rapporte les calendriers distribués au nombre total de boîtes du secteur.
          C'est l'indicateur à utiliser pour fixer les objectifs de l'an prochain.
        </p>
      </div>

      ${heures.length > 0 ? `
      <div class="section-block">
        <h2>Créneaux horaires</h2>
        <div class="st-heures">
          ${heures.map(h => `
            <div class="st-heure">
              <div class="st-h-barre-zone">
                <div class="st-h-taux">${h.taux.toFixed(0)}%</div>
                <div class="st-h-barre" style="height:${Math.round((h.passages/maxPassages)*100)}%;background:${coulTaux(h.taux)}"></div>
              </div>
              <div class="st-h-label">${h.heure}h</div>
              <div class="st-h-nb">${h.passages}</div>
            </div>`).join('')}
        </div>
        <p style="font-size:.76rem;color:var(--ardoise-mid);margin-top:8px;">
          Hauteur = nombre de passages · Couleur et pourcentage = part de dons obtenus.
          Les créneaux verts sont les plus productifs.
        </p>
      </div>` : ''}

      ${montants.length > 0 ? `
      <div class="section-block">
        <h2>Montants les plus donnés</h2>
        <div class="st-montants">
          ${montants.map(m => `
            <div class="st-montant">
              <div class="st-m-val">${m.montant} €</div>
              <div class="st-m-barre-zone">
                <div class="st-m-barre" style="width:${Math.round((m.nb/maxNb)*100)}%"></div>
              </div>
              <div class="st-m-nb">${m.nb}×</div>
            </div>`).join('')}
        </div>
      </div>` : ''}
    `;

    document.getElementById("btn-export-stats")?.addEventListener("click", () => {
      let csv = "Secteur;Commune;Boîtes;Visitées;Avancement (%);Calendriers;Taux placement (%);Dons;Don moyen (€);Refus;Taux refus (%);Absents;Taux absence (%);Collecté (€)\n";
      for (const d of lignesSecteur) {
        csv += [d.nom, d.commune, d.boites, d.visites].map(celluleCSV).join(';') + ';' 
             + `"${d.avancement !== null ? d.avancement.toFixed(1) : ''}";"${d.calendriers}";`
             + `"${d.tauxPlacement !== null ? d.tauxPlacement.toFixed(1) : ''}";"${d.dons}";`
             + `"${d.donMoyen.toFixed(2)}";"${d.refus}";"${d.tauxRefus.toFixed(1)}";`
             + `"${d.absents}";"${d.tauxAbsence.toFixed(1)}";"${d.montant.toFixed(2)}"\n`;
      }
      csv += "\n\nCRÉNEAUX HORAIRES\nHeure;Passages;Dons;Taux de dons (%);Don moyen (€)\n";
      for (const h of heures) {
        csv += `"${h.heure}h";"${h.passages}";"${h.dons}";"${h.taux.toFixed(1)}";"${h.moyenne.toFixed(2)}"\n`;
      }
      telechargerCSV(csv, `statistiques-${dateLocaleISO()}.csv`);
      toast("Statistiques exportées", "success");
    });

  } catch(e) {
    document.getElementById("stats-content").innerHTML =
      `<p class="empty-state">Erreur : ${h(e.message)}</p>`;
  }
}

async function renderJournal() {
  if (APP.role !== "admin") { naviguer("#login"); return; }
  stopUnsubs();

  document.getElementById("main").innerHTML = layoutAdmin("#journal", `
    <div class="page-header">
      <h1>📜 Journal des modifications</h1>
      <button id="btn-export-journal" class="btn btn--ghost">⬇️ Exporter</button>
    </div>
    <p style="font-size:.85rem;color:var(--ardoise-mid);margin-bottom:16px;line-height:1.5;">
      Trace des corrections et suppressions de passages. Utile en cas d'écart constaté au moment des comptes.
    </p>
    <div class="filter-bar">
      <input id="jr-recherche" class="input input--sm" placeholder="🔍 Filtrer par personne, adresse…" style="max-width:300px;">
      <select id="jr-type" class="input input--sm" style="max-width:200px;">
        <option value="">Toutes les actions</option>
        <option value="modification">Corrections</option>
        <option value="suppression">Suppressions</option>
      </select>
    </div>
    <div id="journal-content"><div class="loader">Chargement…</div></div>
  `);
  bindLogout();

  let entrees = [];

  function afficher() {
    const q = (document.getElementById("jr-recherche")?.value || "").toLowerCase().trim();
    const type = document.getElementById("jr-type")?.value || "";
    const filtrees = entrees.filter(e => {
      if (type && e.action !== type) return false;
      if (!q) return true;
      return [e.parQui, e.equipeNom, e.avant, e.apres, e.contexte]
        .filter(Boolean).join(" ").toLowerCase().includes(q);
    });

    const el = document.getElementById("journal-content");
    if (!el) return;

    if (entrees.length === 0) {
      el.innerHTML = `<p class="empty-state">Aucune modification enregistrée.<br>
        <small>Les corrections et suppressions apparaîtront ici.</small></p>`;
      return;
    }

    const ecart = ecartCumule(filtrees);
    const nbSupp = filtrees.filter(e => e.action === "suppression").length;
    const nbMod  = filtrees.filter(e => e.action === "modification").length;

    el.innerHTML = `
      <div class="stats-grid" style="margin-bottom:16px;">
        <div class="stat-card"><div class="stat-value">${nbMod}</div><div class="stat-label">Correction${nbMod>1?'s':''}</div></div>
        <div class="stat-card"><div class="stat-value">${nbSupp}</div><div class="stat-label">Suppression${nbSupp>1?'s':''}</div></div>
        <div class="stat-card ${Math.abs(ecart) > 0.009 ? 'stat-card--alerte' : ''}">
          <div class="stat-value" style="color:${ecart < -0.009 ? 'var(--rouge)' : ecart > 0.009 ? 'var(--vert)' : 'var(--ardoise)'}">
            ${ecart >= 0 ? '+' : ''}${formatMontant(ecart)}
          </div>
          <div class="stat-label">Écart cumulé</div>
          <div class="stat-sub">effet des corrections sur les montants</div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Quand</th><th>Qui</th><th>Action</th><th>Avant</th><th>Après</th><th>Écart</th></tr></thead>
          <tbody>
            ${filtrees.map(e => {
              const d = e.date ? new Date(e.date) : null;
              const ec = (e.montantApres || 0) - (e.montantAvant || 0);
              return `<tr class="${e.action === 'suppression' ? 'jr-supp' : ''}">
                <td style="white-space:nowrap">
                  ${d ? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) : '—'}
                  <br><small style="color:var(--ardoise-mid)">${d ? d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : ''}</small>
                </td>
                <td>${h(e.parQui || '—')}${e.equipeNom ? `<br><small style="color:var(--ardoise-mid)">${h(e.equipeNom)}</small>` : ''}</td>
                <td><span class="jr-badge jr-badge--${e.action}">${ACTION_LABEL[e.action] || e.action}</span>
                    ${e.contexte ? `<br><small style="color:var(--ardoise-mid)">${e.contexte}</small>` : ''}</td>
                <td style="font-size:.82rem">${e.avant || '—'}</td>
                <td style="font-size:.82rem">${e.apres || '<em style="color:var(--rouge)">supprimé</em>'}</td>
                <td style="font-weight:700;color:${ec < -0.009 ? 'var(--rouge)' : ec > 0.009 ? 'var(--vert)' : 'var(--ardoise-mid)'}">
                  ${Math.abs(ec) > 0.009 ? (ec > 0 ? '+' : '') + formatMontant(ec) : '—'}
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      ${filtrees.length === 0 ? '<p class="empty-state">Aucun résultat pour ce filtre.</p>' : ''}
    `;
  }

  try {
    entrees = await lireJournal({ limite: 400 });
    afficher();
  } catch(e) {
    document.getElementById("journal-content").innerHTML =
      `<p class="empty-state">Erreur de chargement : ${h(e.message)}</p>`;
  }

  document.getElementById("jr-recherche")?.addEventListener("input", afficher);
  document.getElementById("jr-type")?.addEventListener("change", afficher);

  document.getElementById("btn-export-journal")?.addEventListener("click", () => {
    let csv = "Date;Heure;Qui;Équipe;Action;Contexte;Avant;Après;Écart (€)\n";
    for (const e of entrees) {
      const d = e.date ? new Date(e.date) : null;
      const ec = (e.montantApres || 0) - (e.montantAvant || 0);
      csv += `"${d ? d.toLocaleDateString('fr-FR') : ''}";"${d ? d.toLocaleTimeString('fr-FR') : ''}";`
            + [e.parQui || '', e.equipeNom || '', ACTION_LABEL[e.action] || e.action].map(celluleCSV).join(';') + ';' 
           + `"${e.contexte || ''}";"${e.avant || ''}";"${e.apres || ''}";"${ec.toFixed(2)}"\n`;
    }
    telechargerCSV(csv, `journal-modifications-${dateLocaleISO()}.csv`);
    toast("Journal exporté", "success");
  });
}

        Ce réglage est propre à cet appareil.
      </p>

      <div id="notif-etat" class="notif-etat"></div>

      <label class="label">Heure d'envoi</label>
      <input id="cfg-heure-resume" class="input" type="number" min="0" max="23" style="max-width:120px;">

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">
        <button id="btn-activer-notifs" class="btn btn--primary">🔔 Activer les notifications</button>
        <button id="btn-tester-notif" class="btn btn--ghost">📤 Tester maintenant</button>
      </div>
    </div>` : ''}
  `);
  bindLogout();

  // ── Réglages notifications (en attente de validation du bureau) ──
  if (FEATURE_NOTIFS_RESUME) {
  const inputHeure = document.getElementById("cfg-heure-resume");
  if (inputHeure) inputHeure.value = getHeureResume();

  function majEtatNotifs() {
    const el = document.getElementById("notif-etat");
    const btnActiver = document.getElementById("btn-activer-notifs");
    if (!el) return;
    const perm = notifsPermission();
    if (perm === "unsupported") {
      el.className = "notif-etat notif-etat--off";
      el.textContent = "⚠️ Ce navigateur ne supporte pas les notifications.";
      btnActiver && (btnActiver.style.display = "none");
    } else if (perm === "granted") {
      el.className = "notif-etat notif-etat--on";
      el.textContent = `✅ Notifications activées — résumé prévu à ${getHeureResume()}h` +
        (resumeDejaEnvoyeAujourdhui() ? " (déjà envoyé aujourd'hui)" : "");
      btnActiver && (btnActiver.style.display = "none");
    } else if (perm === "denied") {
      el.className = "notif-etat notif-etat--off";
      el.textContent = "🚫 Notifications bloquées. Autorise-les dans les réglages du navigateur pour ce site.";
      btnActiver && (btnActiver.style.display = "none");
    } else {
      el.className = "notif-etat notif-etat--pending";
      el.textContent = "Notifications pas encore activées sur cet appareil.";
      btnActiver && (btnActiver.style.display = "");
    }
  }
  majEtatNotifs();

  inputHeure?.addEventListener("change", () => {
    const h = setHeureResume(inputHeure.value);
    inputHeure.value = h;
    toast(`Résumé quotidien réglé à ${h}h`, "success");
    majEtatNotifs();
  });

  document.getElementById("btn-activer-notifs")?.addEventListener("click", async () => {
    try {
      const perm = await demanderPermissionNotifs();
      if (perm === "granted") {
        toast("Notifications activées ✅", "success");
        demarrerPlanificateurResume();
      } else {
        toast("Permission refusée", "error");
      }
      majEtatNotifs();
    } catch(e) { toast(e.message, "error"); }
  });

  document.getElementById("btn-tester-notif")?.addEventListener("click", async () => {
    const btn = document.getElementById("btn-tester-notif");
    setLoading(btn, true);
    try {
      const resume = await envoyerResumeMaintenant(chargerDonneesResume, LOGO_SP);
      toast("Notification envoyée : " + resume.titre, "success");
      majEtatNotifs();
    } catch(e) { toast("Erreur : " + e.message, "error"); }
    setLoading(btn, false);
  });
  } // fin FEATURE_NOTIFS_RESUME

  // État de la migration des PIN
  (async () => {
    const el = document.getElementById("migration-etat");
    if (!el) return;
    try {
      const [equipes, pins] = await Promise.all([lireEquipes(), lirePins()]);
      const restants = equipes.filter(e => e.pin).length;
      const migres = Object.keys(pins).length;
      if (restants === 0 && migres > 0) {
        el.className = "notif-etat notif-etat--on";
        el.textContent = `✅ ${migres} code(s) déjà sécurisé(s).`;
        const b = document.getElementById("btn-migrer-pins");
        if (b) b.style.display = "none";
      } else {
        el.className = "notif-etat notif-etat--pending";
        el.textContent = `${restants} code(s) encore stocké(s) en clair dans les équipes.`;
      }
    } catch(e) {
      el.className = "notif-etat notif-etat--off";
      el.textContent = "Impossible de vérifier l'état : " + e.message;
    }
  })();

  document.getElementById("btn-migrer-pins")?.addEventListener("click", async () => {
    if (!confirm("Déplacer les codes PIN vers le stockage sécurisé ?\n\n" +
                 "Les codes restent les mêmes, les équipiers ne verront aucun changement.\n" +
                 "Pense à avoir téléchargé une sauvegarde avant.")) return;
    const btn = document.getElementById("btn-migrer-pins");
    setLoading(btn, true);
    try {
      const r = await migrerPins();
      toast(`${r.deplaces} code(s) sécurisé(s)${r.conflits ? ` · ${r.conflits} conflit(s)` : ''}`,
            r.conflits ? "error" : "success");
      naviguer("#config");
    } catch(e) {
      toast("Erreur : " + e.message, "error");
      setLoading(btn, false);
    }
  });

  // Nombre de passages actuellement enregistrés
  (async () => {
    const el = document.getElementById("effacer-etat");
    if (!el) return;
    try {
      const p = await fsGetAll(COLLECTIONS.PASSAGES);
      if (p.length === 0) {
        el.className = "notif-etat notif-etat--on";
        el.textContent = "Aucun passage enregistré, rien à effacer.";
        const b = document.getElementById("btn-effacer-passages");
        if (b) b.disabled = true;
      } else {
        const montant = p.filter(x => x.statut === "don")
                         .reduce((s, x) => s + Number(x.montant || 0), 0);
        el.className = "notif-etat notif-etat--pending";
        let nj = 0;
        try { nj = (await lireJournal({ limite: 9999 })).length; } catch(e) {}
        el.textContent = `${p.length} passage(s) enregistré(s), pour ${formatMontant(montant)} collecté(s).`
                       + (nj ? ` Journal : ${nj} trace(s).` : '');
      }
    } catch(e) {
      el.className = "notif-etat notif-etat--off";
      el.textContent = "Impossible de compter les passages : " + e.message;
    }
  })();

  document.getElementById("btn-effacer-passages")?.addEventListener("click", async () => {
    const passages = await fsGetAll(COLLECTIONS.PASSAGES);
    if (passages.length === 0) { toast("Aucun passage à effacer", "info"); return; }

    const montant = passages.filter(x => x.statut === "don")
                            .reduce((s, x) => s + Number(x.montant || 0), 0);

    const avecJournal = document.getElementById("eff-journal")?.checked || false;

    if (!confirm(
      `⚠️ EFFACER TOUS LES PASSAGES ?\n\n` +
      `${passages.length} passage(s) et ${formatMontant(montant)} de collecte vont être définitivement supprimés.\n` +
      (avecJournal ? `Le journal des modifications sera également vidé.\n` : '') +
      `Les secteurs et les équipes seront conservés.\n\n` +
      `Pense à avoir téléchargé une sauvegarde.`
    )) return;

    const saisie = prompt(
      `Dernière confirmation.\n\nTape EFFACER (en majuscules) pour supprimer les ${passages.length} passages :`
    );
    if (saisie !== "EFFACER") { toast("Effacement annulé", "info"); return; }

    const btn = document.getElementById("btn-effacer-passages");
    setLoading(btn, true);
    try {
      const r = await effacerTousLesPassages();
      let msgJournal = '';
      if (avecJournal) {
        try {
          const nj = await viderJournal();
          msgJournal = ` · ${nj} trace(s) de journal effacée(s)`;
        } catch(e) { msgJournal = ' · journal non vidé'; }
      }
      toast(`${r.supprimes} passage(s) effacé(s)${r.erreurs ? ` · ${r.erreurs} erreur(s)` : ''} · ${r.secteurs} secteur(s) remis à zéro${msgJournal}`,
            r.erreurs ? "error" : "success");
      naviguer("#config");
    } catch(e) {
      toast("Erreur : " + e.message, "error");
      setLoading(btn, false);
    }
  });

  document.getElementById("btn-sauvegarde")?.addEventListener("click", async () => {
    const btn = document.getElementById("btn-sauvegarde");
    setLoading(btn, true);
    try {
      const [secteurs, equipes, passages, saisons, cfg] = await Promise.all([
        fsGetAll(COLLECTIONS.SECTEURS),
        fsGetAll(COLLECTIONS.EQUIPES),
        fsGetAll(COLLECTIONS.PASSAGES),
        exporterHistoriqueComplet(),
        lireConfig()
      ]);
      let pins = {};
      try { pins = await lirePins(); } catch(e) {}
      const dump = {
        genere: new Date().toISOString(),
        version: 1,
        parQui: APP.user?.email || '',
        config: cfg || {},
        secteurs,
        equipes: equipes.map(e => ({ ...e, pin: pins[e.id] || e.pin || null })),
        passages,
        historique_saisons: saisons
      };
      const blob = new Blob([JSON.stringify(dump, null, 1)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `sauvegarde-calendriers-${dateLocaleISO()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast(`Sauvegarde : ${secteurs.length} secteurs · ${equipes.length} équipes · ${passages.length} passages`, "success");
    } catch(e) {
      toast("Erreur : " + e.message, "error");
    }
    setLoading(btn, false);
  });

  document.getElementById("btn-save-config")?.addEventListener("click", async () => {
    const admins = [...new Set(document.getElementById("cfg-admins").value
      .split('\n').map(e => e.trim().toLowerCase()).filter(Boolean))];
    try {
      await sauvegarderConfig({
        annee:           Number(document.getElementById("cfg-annee").value),
        dateDebut:       document.getElementById("cfg-debut").value,
        dateFin:         document.getElementById("cfg-fin").value,
        objectif:        Number(document.getElementById("cfg-objectif").value),
        messageEquipiers: document.getElementById("cfg-message").value.trim(),
        admins
      });
      // Synchronisation réelle de /admins : ajout ET révocation des anciens comptes.
      const existants = await fsGetAll(COLLECTIONS.ADMINS);
      const autorises = new Set(admins);
      for (const ancien of existants) {
        if (!autorises.has(String(ancien.id).toLowerCase())) await fsDelete(COLLECTIONS.ADMINS, ancien.id);
      }
      for (const email of admins) {
        await fsSet(COLLECTIONS.ADMINS, email, { email, grantedAt: new Date().toISOString() });
      }
      toast("Configuration sauvegardée ✅", "success");
    } catch(e) { toast(e.message, "error"); }
  });
}

// ── Bloc « Mes foyers à relancer » sur la vue terrain ──
async function chargerRelancesEquipe(secteurs) {
  const box = document.getElementById("terrain-relances");
  if (!box) return;
  try {
    const tous = await foyersARelancer();
    const mesSecteurs = new Set(secteurs.map(s => s.id));
    const miens = tous.filter(p => mesSecteurs.has(p.secteurId));
    if (miens.length === 0) { box.innerHTML = ''; return; }

    const secteurMap = Object.fromEntries(secteurs.map(s => [s.id, s]));
    const maintenant = Date.now();

    // Grouper par secteur puis par rue
    const parSecteur = {};
    for (const p of miens) {
      const sid = p.secteurId;
      if (!parSecteur[sid]) parSecteur[sid] = { nom: (secteurMap[sid]||{}).nom || '?', rues: {} };
      const adr = (p.adresse || '').trim();
      const m = adr.match(/^(\d+\s*[a-zA-Z]?)\s+(.*)$/);
      const rue = m ? m[2].trim() : (adr || 'Adresse non précisée');
      const num = m ? m[1].trim() : (adr || '?');
      if (!parSecteur[sid].rues[rue]) parSecteur[sid].rues[rue] = [];
      const j = p.datePassage ? Math.floor((maintenant - new Date(p.datePassage).getTime())/86400000) : null;
      parSecteur[sid].rues[rue].push({ num, id: p.id, sid, jours: j, note: p.note || '' });
    }

    box.innerHTML = `
      <div class="terrain-relances-wrap">
        <div class="terrain-relances-head">
          🔔 Mes foyers à relancer
          <span class="terrain-relances-count">${miens.length}</span>
        </div>
        ${Object.values(parSecteur).map(s => `
          <div class="terrain-relance-secteur">
            <div class="terrain-relance-secteur-nom">${h(s.nom)}</div>
            ${Object.entries(s.rues).map(([rue, nums]) => `
              <div class="terrain-relance-rue">
                <span class="terrain-relance-rue-nom">${h(rue)}</span>
                <span class="terrain-relance-nums">
                  ${nums.map(n => `<button class="terrain-relance-num"
                      title="${n.jours !== null ? `absent depuis ${n.jours} j` : ''}${n.note ? ' — '+h(n.note) : ''}"
                      onclick="traiterRelance('${n.id}','${n.sid}')">${n.num}${n.jours !== null && n.jours >= 7 ? '!' : ''}</button>`).join('')}
                </span>
              </div>
            `).join('')}
          </div>
        `).join('')}
        <div class="terrain-relance-aide">Touche un numéro quand tu y repasses pour enregistrer le résultat.</div>
      </div>
    `;
  } catch(e) {
    console.warn("Relances équipe:", e);
    box.innerHTML = '';
  }
}


// ── Détection GPS du secteur où se trouve l'équipier ──────────────
function bindDetectionSecteur(secteurs) {
  const btn = document.getElementById("btn-detect-secteur");
  const box = document.getElementById("detect-resultat");
  if (!btn || !box) return;

  btn.addEventListener("click", async () => {
    setLoading(btn, true);
    box.classList.remove("hidden");
    box.className = "detect-resultat detect-resultat--loading";
    box.innerHTML = "📡 Recherche de ta position…";

    try {
      const pos = await positionActuelle();
      const r = await secteurALaPosition(pos.lat, pos.lon, secteurs);

      if (r.secteur) {
        const s = r.secteur;
        box.className = "detect-resultat detect-resultat--ok";
        box.innerHTML = `
          <div class="dr-titre">📍 Tu es dans <strong>${h(s.nom)}</strong></div>
          <div class="dr-sous">${h(s.commune)} · position à ±${pos.precision} m</div>
          <button class="btn btn--primary btn--sm btn--full" onclick="naviguerTerrain('${s.id}')">
            Ouvrir ce secteur →
          </button>`;
      } else if (r.candidats && r.candidats.length) {
        box.className = "detect-resultat detect-resultat--multi";
        box.innerHTML = `
          <div class="dr-titre">📍 Tu es sur ${h(r.candidats[0].commune)}</div>
          <div class="dr-sous">Plusieurs de tes secteurs s'y trouvent — choisis :</div>
          ${r.candidats.map(s => `
            <button class="btn btn--ghost btn--sm btn--full" style="margin-top:4px"
              onclick="naviguerTerrain('${s.id}')">${h(s.nom)}</button>`).join('')}`;
      } else {
        box.className = "detect-resultat detect-resultat--vide";
        box.innerHTML = `Tu n'es dans aucun de tes secteurs (position à ±${pos.precision} m).<br>
          <small>Choisis manuellement dans la liste.</small>`;
      }
    } catch(e) {
      box.className = "detect-resultat detect-resultat--erreur";
      box.innerHTML = `⚠️ ${h(e.message)}`;
    }
    setLoading(btn, false);
  });
}

function renderTerrainSecteurs(secteurs) {
  const content = document.getElementById("terrain-content");
  if (!content) return;
  if (secteurs.length === 0) {
    content.innerHTML = `<p class="empty-state terrain-empty">Aucun secteur assigné à ton équipe pour le moment.<br>L'Amicale t'en attribuera prochainement.</p>`;
    return;
  }
  const nbTotal = secteurs.length;
  const nbTermines = secteurs.filter(s => s.statut === "termine").length;
  const pct = Math.round((nbTermines / nbTotal) * 100);
  const palier = getPalier(pct);
  const couleurBar = pct === 100 ? "#EAB308" : pct >= 75 ? "#F59E0B" : pct >= 50 ? "#9CA3AF" : pct >= 25 ? "#B45309" : "#EF4444";
  content.innerHTML = `
    <div class="terrain-progress-wrap">
      <div class="terrain-progress-label">
        <span>${palier.icone} Ma progression — ${palier.label}</span>
        <span style="color:${couleurBar};font-weight:700;">${pct}%</span>
      </div>
      <div class="terrain-progress-bar">
        <div class="terrain-progress-fill" style="width:${pct}%;background:${couleurBar};"></div>
      </div>
      <div style="font-size:.78rem;color:var(--ardoise-mid);margin-top:6px;">${nbTermines} / ${nbTotal} secteur(s) terminé(s)</div>
    </div>
    <div id="terrain-relances"></div>
    ${geolocDisponible() && secteurs.length > 1 ? `
    <button id="btn-detect-secteur" class="btn-detect">
      📍 Dans quel secteur suis-je ?
    </button>
    <div id="detect-resultat" class="detect-resultat hidden"></div>` : ''}
    <div class="terrain-secteurs">
      ${secteurs.map(s => `
        <div class="terrain-secteur-card" onclick="naviguerTerrain('${s.id}')">
          <div class="terrain-secteur-header">
            <span class="terrain-secteur-dot" style="background:${s.couleur || '#EF4444'}"></span>
            <div>
              <div class="terrain-secteur-nom">${h(s.nom)}</div>
              <div class="terrain-secteur-commune">${h(s.commune)}</div>
            </div>
            <span class="badge badge--${s.statut}">${STATUT_LABEL[s.statut]}</span>
          </div>
          <div class="terrain-secteur-stats">
            <span>💰 ${formatMontant(s.totalCollecte)}</span>
            <span>✅ ${s.nbFoyersVisites || 0} traités</span>
            <span>🔔 ${s.nbFoyersAbsents || 0} absents</span>
          </div>
          ${(() => {
            const tot = nbFoyersSecteur(s);
            if (!tot) return '';
            const rest = Math.max(0, tot - (s.nbFoyersVisites || 0));
            const p = Math.round(((s.nbFoyersVisites||0) / tot) * 100);
            const col = p >= 90 ? '#16A34A' : p >= 60 ? '#EAB308' : p >= 30 ? '#F97316' : '#EF4444';
            return `<div class="terrain-secteur-reste">
              <div class="tsr-barre"><div class="tsr-fill" style="width:${p}%;background:${col}"></div></div>
              <span class="tsr-txt"><strong style="color:${col}">${rest}</strong> boîte${rest!==1?'s':''} restante${rest!==1?'s':''} sur ${tot}</span>
            </div>`;
          })()}
          ${s.rues?.length ? `<div class="terrain-secteur-rues">${s.rues.join(' · ')}</div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

          <button class="statut-btn statut-btn--don"   data-statut="don"    onclick="selectStatut('don')">💰 Don</button>
          <button class="statut-btn statut-btn--offert" data-statut="offert" onclick="selectStatut('offert')">🎁 Offert</button>
          <button class="statut-btn statut-btn--refuse" data-statut="refuse" onclick="selectStatut('refuse')">🚫 Refus</button>
          <button class="statut-btn statut-btn--absent" data-statut="absent" onclick="selectStatut('absent')">🔔 Absent</button>
        </div>

        <div id="don-details" class="don-details hidden">
          <input id="p-montant" class="input input--montant" type="number" inputmode="decimal"
                 min="0" step="0.50" placeholder="Montant (€)">
          <div class="mode-paiement">
            <button class="mode-btn mode-btn--active" data-mode="especes" onclick="selectMode('especes')">💵 Espèces</button>
            <button class="mode-btn" data-mode="cheque" onclick="selectMode('cheque')">📝 Chèque</button>
            <button class="mode-btn" data-mode="carte" onclick="selectMode('carte')">💳 Carte</button>
          </div>
          <input id="p-donateur" class="input" placeholder="Nom donateur (optionnel)">
        </div>

        <div id="absent-details" class="absent-details hidden">
          <label class="checkbox-label">
            <input type="checkbox" id="p-relance"> À relancer
          </label>
        </div>

        <input id="p-note" class="input" placeholder="Note (optionnel)">
        <button id="btn-saisir" class="btn btn--primary btn--full" disabled>Enregistrer le passage</button>
      </div>

      <!-- Foyers à relancer sur ce secteur -->
      <div id="terrain-relances" class="terrain-relances hidden"></div>

      <!-- Liste des passages du secteur -->
      <div class="passages-terrain">
        <h3>Passages enregistrés</h3>
        <div id="passages-terrain-list"><div class="loader">…</div></div>
      </div>
    </div>
  `;

  // Mini carte du secteur
  initCarte("terrain-secteur-map", { zoom: 13, scrollWheelZoom: false }).then(map => {
    afficherSecteurUnique(map, secteur);
  });

  const unsubNet = bindNetworkBadge();
  APP.unsubs.push(unsubNet);

  // Restaurer les raccourcis depuis le dernier passage de l'équipe sur ce secteur
  (async () => {
    try {
      const passages = await passagesDuSecteur(secteurId);
      const dernier = passages
        .filter(p => p.equipeId === APP.equipeId && p.adresse)
        .sort((a,b) => (b.datePassage||'').localeCompare(a.datePassage||''))[0];
      if (dernier) {
        APP._dernierPassage = { secteurId, adresse: dernier.adresse };
        majRaccourcis(dernier.adresse, secteur.commune);
      }
    } catch(e) {}
  })();

  let statutSelectionne = null;
  let modeSelectionne   = "especes";

  window.selectStatut = (statut) => {
    statutSelectionne = statut;
    $$(".statut-btn").forEach(b => b.classList.toggle("statut-btn--selected", b.dataset.statut === statut));
    const donDetails    = document.getElementById("don-details");
    const absentDetails = document.getElementById("absent-details");
    donDetails && (statut === "don" ? donDetails.classList.remove("hidden") : donDetails.classList.add("hidden"));
    absentDetails && (statut === "absent" ? absentDetails.classList.remove("hidden") : absentDetails.classList.add("hidden"));
    document.getElementById("btn-saisir").disabled = false;
  };

  window.selectMode = (mode) => {
    modeSelectionne = mode;
    $$(".mode-btn").forEach(b => b.classList.toggle("mode-btn--active", b.dataset.mode === mode));
  };

  // ── Géolocalisation : proposer les adresses les plus proches ──
  const btnGeo = document.getElementById("btn-geoloc");
  const boxSugg = document.getElementById("geoloc-suggestions");

  if (!geolocDisponible()) {
    btnGeo && (btnGeo.style.display = "none");
  } else {
    btnGeo?.addEventListener("click", async () => {
      setLoading(btnGeo, true);
      boxSugg.classList.remove("hidden");
      boxSugg.className = "geoloc-suggestions geoloc-suggestions--loading";
      boxSugg.innerHTML = "📡 Recherche de ta position…";

      try {
        const pos = await positionActuelle();
        // Chercher d'abord dans la commune du secteur, puis élargir si rien
        let proches = adressesProches(pos.lat, pos.lon, { commune: secteur.commune, limite: 3 });
        if (proches.length === 0) {
          proches = adressesProches(pos.lat, pos.lon, { limite: 3, rayonMax: 500 });
        }

        if (proches.length === 0) {
          boxSugg.className = "geoloc-suggestions geoloc-suggestions--vide";
          boxSugg.innerHTML = `Aucune adresse connue à proximité (position ±${pos.precision} m).<br>
                               <small>Saisis l'adresse manuellement.</small>`;
        } else {
          boxSugg.className = "geoloc-suggestions";
          boxSugg.innerHTML = `
            <div class="geoloc-header">📍 Position détectée (±${pos.precision} m)</div>
            ${proches.map((a, i) => `
              <button class="geoloc-item" data-adresse="${h(a.adresse)}">
                <span class="geoloc-adresse">${h(a.adresse)}</span>
                <span class="geoloc-dist">${a.distance} m</span>
              </button>
            `).join('')}
            <button class="geoloc-fermer" onclick="document.getElementById('geoloc-suggestions').classList.add('hidden')">Fermer</button>
          `;
          boxSugg.querySelectorAll(".geoloc-item").forEach(btn => {
            btn.addEventListener("click", () => {
              const champ = document.getElementById("p-adresse");
              if (champ) champ.value = btn.dataset.adresse;
              boxSugg.classList.add("hidden");
              toast("Adresse renseignée ✅", "success");
            });
          });
        }
      } catch (e) {
        boxSugg.className = "geoloc-suggestions geoloc-suggestions--erreur";
        boxSugg.innerHTML = `⚠️ ${h(e.message)}`;
      }
      setLoading(btnGeo, false);
    });
  }

  // ── Reconnaissance vocale ──────────────────────────────────
  const btnVocal = document.getElementById("btn-vocal");
  const feedback = document.getElementById("vocal-feedback");

  if (!vocalDisponible()) {
    btnVocal && (btnVocal.style.display = "none");
  } else {
    let reconnaissance = null;
    btnVocal?.addEventListener("click", () => {
      // Si déjà en écoute, on arrête
      if (reconnaissance) { try { reconnaissance.abort(); } catch(e){} reconnaissance = null; return; }

      reconnaissance = ecouterVocal({
        onStateChange: (enEcoute) => {
          btnVocal.classList.toggle("btn-vocal--active", enEcoute);
          btnVocal.querySelector(".btn-vocal-label").textContent = enEcoute ? "J'écoute…" : "Dicter le passage";
          if (enEcoute && feedback) {
            feedback.classList.remove("hidden");
            feedback.className = "vocal-feedback vocal-feedback--listening";
            feedback.textContent = "🎙️ Parle maintenant… ex : « don 20 euros espèces »";
          }
          if (!enEcoute) reconnaissance = null;
        },
        onResult: (analyse, texte) => {
          if (feedback) {
            feedback.className = "vocal-feedback vocal-feedback--result";
            feedback.textContent = `« ${texte} »`;
          }

          // Pré-remplir le formulaire
          if (analyse.adresse) {
            const champAdresse = document.getElementById("p-adresse");
            if (champAdresse) champAdresse.value = analyse.adresse;
          }
          if (analyse.statut) {
            window.selectStatut(analyse.statut);
          }
          if (analyse.statut === "don") {
            if (analyse.montant) {
              const champMontant = document.getElementById("p-montant");
              if (champMontant) champMontant.value = analyse.montant;
            }
            if (analyse.mode) window.selectMode(analyse.mode);
          }
          if (analyse.aRelancer) {
            const cbRelance = document.getElementById("p-relance");
            if (cbRelance) cbRelance.checked = true;
          }

          // Résumé de ce qui a été compris
          const parts = [];
          if (analyse.adresse) parts.push(`📍 ${analyse.adresse}`);
          if (analyse.statut === "don") {
            parts.push(`💰 ${analyse.montant ? formatMontant(analyse.montant) : "montant à préciser"}`);
            if (analyse.mode) parts.push(analyse.mode === "cheque" ? "📝 chèque" : analyse.mode === "carte" ? "💳 carte" : "💵 espèces");
          } else if (analyse.statut === "refuse") parts.push("🚫 refus");
          else if (analyse.statut === "absent") parts.push(analyse.aRelancer ? "🔔 absent, à relancer" : "🔔 absent");

          if (parts.length > 0) {
            toast("Compris : " + parts.join(" · "), "success");
          } else {
            toast("Je n'ai pas compris, complète manuellement", "info");
          }
        },
        onError: (msg) => {
          if (feedback) {
            feedback.className = "vocal-feedback vocal-feedback--error";
            feedback.textContent = "⚠️ " + msg;
          }
          toast(msg, "error");
        }
      });
    });
  }

  document.getElementById("btn-saisir")?.addEventListener("click", async () => {
    if (!statutSelectionne) return;
    const adresse   = document.getElementById("p-adresse")?.value.trim();
    const note      = document.getElementById("p-note")?.value.trim();
    const montant   = parseFloat(document.getElementById("p-montant")?.value || "0");
    const donateur  = document.getElementById("p-donateur")?.value.trim();
    const aRelancer = document.getElementById("p-relance")?.checked;

    if (statutSelectionne === "don" && (!montant || montant <= 0)) {
      toast("Saisis le montant du don", "error"); return;
    }

    // ── Anti-doublon (mode binôme/trinôme) ──
    if (adresse) {
      const doublon = await verifierDoublonAdresse(secteurId, adresse);
      if (doublon) {
        const qui = doublon.saisiPar || doublon.equipeNom || "quelqu'un";
        const quand = doublon.datePassage ? doublon.datePassage.slice(11, 16) : "";
        const detail = doublon.statut === "don"
          ? `${formatMontant(doublon.montant)}`
          : STATUT_PASSAGE_LABEL[doublon.statut] || doublon.statut;
        const ok = confirm(
          `⚠️ Adresse déjà enregistrée\n\n` +
          `« ${doublon.adresse} » a été noté par ${qui}${quand ? ` à ${quand}` : ""} (${detail}).\n\n` +
          `Enregistrer quand même ?`
        );
        if (!ok) return;
      }
    }

    const btn = document.getElementById("btn-saisir");
    setLoading(btn, true);
    try {
      await ajouterPassage({
        secteurId,
        equipeId:  APP.equipeId,
        equipeNom: APP.equipeNom,
        adresse,
        statut: aRelancer ? STATUT_PASSAGE.RELANCE : statutSelectionne,
        montant,
        modePaiement: statutSelectionne === "don" ? modeSelectionne : null,
        nomDonateur: donateur,
        note,
        saisiPar: APP.membre || ""
      });

      // Mémoriser la dernière saisie (pour annulation et raccourcis)
      APP._dernierPassage = { secteurId, adresse };

      // Reset form
      document.getElementById("p-adresse").value  = "";
      document.getElementById("p-montant") && (document.getElementById("p-montant").value = "");
      document.getElementById("p-donateur") && (document.getElementById("p-donateur").value = "");
      document.getElementById("p-note").value = "";
      document.getElementById("p-relance") && (document.getElementById("p-relance").checked = false);
      statutSelectionne = null;
      $$(".statut-btn").forEach(b => b.classList.remove("statut-btn--selected"));
      document.getElementById("don-details")?.classList.add("hidden");
      document.getElementById("absent-details")?.classList.add("hidden");
      btn.disabled = true;
      toast("Passage enregistré ✅", "success");

      // Proposer les raccourcis pour le foyer suivant
      majRaccourcis(adresse, secteur.commune);
    } catch(e) { toast(e.message, "error"); }
    setLoading(btn, false);
  });

  // Écoute temps réel
  // Historique des années passées, chargé une seule fois par session
  if (!APP._histAdresses) {
    chargerHistoriqueAdresses()
      .then(idx => { APP._histAdresses = idx; rafraichirModeRue(); })
      .catch(() => { APP._histAdresses = {}; });
  }

  // Écoute du secteur lui-même : compléments d'adresses ajoutés par un binôme
  APP._secteurCourant = secteur;
  const unsubSect = fsListenDoc(COLLECTIONS.SECTEURS, secteurId, (s) => {
    if (s) {
      APP._secteurCourant = s;
      // Redessiner la grille si une rue est active
      if (APP._rueActive) rafraichirModeRue();
    }
  });
  APP.unsubs.push(unsubSect);

  const unsub = ecouterPassagesSecteur(secteurId, (passages) => {
    // ── Bandeau de statistiques du secteur ──
    majStatsTerrain(secteur, passages);
    // ── Mode « rue en cours » ── (secteur rafraîchi si compléments modifiés)
    majModeRue(APP._secteurCourant || secteur, passages);

    // ── Bloc « Mes foyers à relancer » sur ce secteur ──
    const boxRel = document.getElementById("terrain-relances");
    if (boxRel) {
      const aRelancer = passages.filter(p => p.aRelancer);
      if (aRelancer.length === 0) {
        boxRel.classList.add("hidden");
      } else {
        boxRel.classList.remove("hidden");
        const maintenant = Date.now();
        boxRel.innerHTML = `
          <div class="terrain-relances-head">
            🔔 À relancer sur ce secteur
            <span class="terrain-relances-count">${aRelancer.length}</span>
          </div>
          <div class="terrain-relances-liste">
            ${aRelancer
              .sort((a,b) => (a.adresse||'').localeCompare(b.adresse||'', 'fr', {numeric:true}))
              .map(p => {
                const j = p.datePassage ? Math.floor((maintenant - new Date(p.datePassage).getTime())/86400000) : null;
                return `<button class="terrain-relance-item" onclick="corrigerPassage('${p.id}','${secteurId}')">
                  <span class="terrain-relance-adr">${h(p.adresse || '(sans adresse)')}</span>
                  ${j !== null ? `<span class="terrain-relance-jours">${j} j</span>` : ''}
                </button>`;
              }).join('')}
          </div>
          <div class="terrain-relances-aide">Touche une adresse pour mettre à jour après ton passage.</div>
        `;
      }
    }

    const list = document.getElementById("passages-terrain-list");
    if (!list) return;
    if (passages.length === 0) { list.innerHTML = `<p class="empty-state">Aucun passage encore.</p>`; return; }
    list.innerHTML = passages.map(p => `
      <div class="passage-item passage-item--${p.statut}">
        <span class="passage-statut-dot"></span>
        <div class="passage-info">
          <span class="passage-adresse">${h(p.adresse || '(adresse non précisée)')}</span>
          <span class="passage-badge">${STATUT_PASSAGE_LABEL[p.statut] || p.statut}</span>
          ${p.statut === 'don' ? `<span class="passage-montant">${formatMontant(p.montant)} ${p.modePaiement === 'cheque' ? '📝' : p.modePaiement === 'carte' ? '💳' : '💵'}</span>` : p.statut === 'offert' ? `<span class="passage-montant" style="color:var(--bleu)">🎁 offert</span>` : ''}
        </div>
        <span class="passage-meta">
          ${p.saisiPar ? `<span class="passage-auteur" title="Saisi par ${p.saisiPar}">${p.saisiPar.slice(0,2).toUpperCase()}</span>` : ''}
          <span class="passage-heure">${heureLocale(p.datePassage)}</span>
        </span>
        <button class="passage-edit-btn" onclick="corrigerPassage('${p.id}', '${secteurId}')" title="Corriger">✏️</button>
      </div>
    `).join('');
  });
  APP.unsubs.push(unsub);
}


// ════════════════════════════════════════════════════════════
//  CORRECTION D'UN PASSAGE (côté équipier terrain)
// ════════════════════════════════════════════════════════════

window.corrigerPassage = async (passageId, secteurId) => {
  const passages = await passagesDuSecteur(secteurId);
  const p = passages.find(x => x.id === passageId);
  if (!p) { toast("Passage introuvable", "error"); return; }

  // Créer le conteneur modal s'il n'existe pas
  let modal = document.getElementById("modal-correction");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "modal-correction";
    modal.className = "modal hidden";
    document.body.appendChild(modal);
  }

  const heure = (p.datePassage || '').slice(11, 16);
  modal.innerHTML = `
    <div class="modal-inner">
      <h2>Corriger le passage</h2>
      <p class="login-hint">Saisi à ${heure} — ${h(p.adresse || 'adresse non précisée')}</p>
      ${(() => {
        const h = (APP._histAdresses || {})[normAdresse(p.adresse || '')];
        const r = resumeHistorique(h);
        if (!r || r.length === 0) return '';
        return `<p class="mn-histo">📊 Années passées : ${r.slice(0, 3).join(' · ')}</p>`;
      })()}

      <label class="label">Adresse</label>
      <input id="cp-adresse" class="input" value="${h(p.adresse || '')}" placeholder="Adresse / numéro">

      <label class="label">Statut</label>
      <div class="passage-statuts" style="margin-bottom:8px;">
        <button class="statut-btn statut-btn--don ${p.statut === 'don' ? 'statut-btn--selected' : ''}" data-cp-statut="don" onclick="cpSelectStatut('don')">💰 Don</button>
        <button class="statut-btn statut-btn--offert ${p.statut === 'offert' ? 'statut-btn--selected' : ''}" data-cp-statut="offert" onclick="cpSelectStatut('offert')">🎁 Offert</button>
        <button class="statut-btn statut-btn--refuse ${p.statut === 'refuse' ? 'statut-btn--selected' : ''}" data-cp-statut="refuse" onclick="cpSelectStatut('refuse')">🚫 Refus</button>
        <button class="statut-btn statut-btn--absent ${(p.statut === 'absent' || p.statut === 'relance') ? 'statut-btn--selected' : ''}" data-cp-statut="absent" onclick="cpSelectStatut('absent')">🔔 Absent</button>
      </div>

      <div id="cp-don-details" class="don-details ${p.statut === 'don' ? '' : 'hidden'}">
        <label class="label">Montant (€)</label>
        <input id="cp-montant" class="input input--montant" type="number" inputmode="decimal" min="0" step="0.50" value="${p.montant || ''}">
        <div class="mode-paiement">
          <button class="mode-btn ${p.modePaiement === 'especes' || !p.modePaiement ? 'mode-btn--active' : ''}" data-cp-mode="especes" onclick="cpSelectMode('especes')">💵 Espèces</button>
          <button class="mode-btn ${p.modePaiement === 'cheque' ? 'mode-btn--active' : ''}" data-cp-mode="cheque" onclick="cpSelectMode('cheque')">📝 Chèque</button>
          <button class="mode-btn ${p.modePaiement === 'carte' ? 'mode-btn--active' : ''}" data-cp-mode="carte" onclick="cpSelectMode('carte')">💳 Carte</button>
        </div>
        <label class="label">Nom donateur</label>
        <input id="cp-donateur" class="input" value="${h(p.nomDonateur || '')}" placeholder="Optionnel">
      </div>

      <div id="cp-absent-details" class="absent-details ${(p.statut === 'absent' || p.statut === 'relance') ? '' : 'hidden'}">
        <label class="checkbox-label">
          <input type="checkbox" id="cp-relance" ${p.aRelancer ? 'checked' : ''}> À relancer
        </label>
      </div>

      <label class="label">Note</label>
      <input id="cp-note" class="input" value="${h(p.note || '')}" placeholder="Optionnel">

      <div class="modal-actions">
        <button id="cp-save" class="btn btn--primary">💾 Enregistrer</button>
        <button id="cp-delete" class="btn btn--danger">🗑️ Supprimer</button>
        <button class="btn btn--ghost" onclick="fermerCorrection()">Annuler</button>
      </div>
    </div>
  `;
  modal.classList.remove("hidden");

  // État local de la correction
  window._cpStatut = (p.statut === 'relance') ? 'absent' : p.statut;
  window._cpMode   = p.modePaiement || 'especes';

  document.getElementById("cp-save")?.addEventListener("click", async () => {
    const btn = document.getElementById("cp-save");
    setLoading(btn, true);
    try {
      const adresse   = document.getElementById("cp-adresse").value.trim();
      const note      = document.getElementById("cp-note").value.trim();
      const montant   = parseFloat(document.getElementById("cp-montant")?.value || "0");
      const donateur  = document.getElementById("cp-donateur")?.value.trim() || "";
      const aRelancer = document.getElementById("cp-relance")?.checked || false;
      const statut    = window._cpStatut;

      if (statut === "don" && (!montant || montant <= 0)) {
        toast("Saisis un montant valide", "error");
        setLoading(btn, false);
        return;
      }

      const statutFinal = (statut === "absent" && aRelancer) ? "relance" : statut;

      const apres = {
        adresse,
        statut: statutFinal,
        montant: statut === "don" ? Number(montant) : 0,
        modePaiement: statut === "don" ? window._cpMode : null,
        nomDonateur: statut === "don" ? donateur : "",
        note,
        aRelancer: statut === "absent" ? aRelancer : false,
        secteurId
      };
      await modifierPassage(passageId, apres);
      tracer(ACTIONS.MODIFICATION, { avant: p, apres, auteur: auteurCourant() });

      toast("Passage corrigé ✅", "success");
      fermerCorrection();
    } catch(e) {
      toast("Erreur : " + e.message, "error");
      setLoading(btn, false);
    }
  });

  document.getElementById("cp-delete")?.addEventListener("click", async () => {
    if (!confirm("Supprimer définitivement ce passage ? Les totaux du secteur seront recalculés.")) return;
    const btn = document.getElementById("cp-delete");
    setLoading(btn, true);
    try {
      tracer(ACTIONS.SUPPRESSION, { avant: p, contexte: "correction terrain", auteur: auteurCourant() });
      await supprimerPassage(passageId, secteurId);
      toast("Passage supprimé", "success");
      fermerCorrection();
    } catch(e) {
      toast("Erreur : " + e.message, "error");
      setLoading(btn, false);
    }
  });
};

window.cpSelectStatut = (statut) => {
  window._cpStatut = statut;
  document.querySelectorAll("[data-cp-statut]").forEach(b => {
    b.classList.toggle("statut-btn--selected", b.dataset.cpStatut === statut);
  });
  const don = document.getElementById("cp-don-details");
  const abs = document.getElementById("cp-absent-details");
  don && (statut === "don" ? don.classList.remove("hidden") : don.classList.add("hidden"));
  abs && (statut === "absent" ? abs.classList.remove("hidden") : abs.classList.add("hidden"));
};

window.cpSelectMode = (mode) => {
  window._cpMode = mode;
  document.querySelectorAll("[data-cp-mode]").forEach(b => {
    b.classList.toggle("mode-btn--active", b.dataset.cpMode === mode);
  });
};

window.fermerCorrection = () => {
  document.getElementById("modal-correction")?.classList.add("hidden");
};


// ════════════════════════════════════════════════════════════
//  RÉSUMÉ QUOTIDIEN (notifications locales)
// ════════════════════════════════════════════════════════════

// Charge les données nécessaires au résumé
async function chargerDonneesResume() {
  const [stats, passages] = await Promise.all([
    statsGlobalesTournee(),
    fsGetAll(COLLECTIONS.PASSAGES)
  ]);
  return { stats, passages };
}

// Démarre (ou redémarre) le planificateur du résumé quotidien
let _arretPlanificateur = null;
function demarrerPlanificateurResume() {
  if (!FEATURE_NOTIFS_RESUME) return;

// Définit le nombre de calendriers emportés par l'équipe (stocké localement)
window.definirStock = () => {
  const actuel = localStorage.getItem(`stock_${APP.equipeId}`) || '';
  const v = prompt("Combien de calendriers as-tu emportés ?\n\n(Laisse vide pour désactiver le compteur)", actuel);
  if (v === null) return;
  const n = parseInt(v);
  if (!v.trim()) {
    localStorage.removeItem(`stock_${APP.equipeId}`);
    toast("Compteur de calendriers désactivé", "info");
  } else if (isNaN(n) || n < 0) {
    toast("Nombre invalide", "error"); return;
  } else {
    localStorage.setItem(`stock_${APP.equipeId}`, String(n));
    toast(`Stock défini à ${n} calendriers`, "success");
  }
  // Rafraîchir l'affichage
  const sid = sessionStorage.getItem("secteurActif");
  if (sid) naviguer("#terrain-passages");
};

// ── Bandeau de stats du secteur (boîtes restantes + totaux du jour) ──
function majStatsTerrain(secteur, passages) {
  const box = document.getElementById("terrain-stats");
  if (!box) return;

  // Total de boîtes = BAN + compléments manuels − adresses fusionnées − inhabitées
  let totalBoites = nbFoyersSecteur(secteur);
  const comp = secteur.ruesComplements || {};
  totalBoites += Object.values(comp).reduce((s, arr) => s + (arr || []).length, 0);
  totalBoites -= adressesSecondaires(secteur).length;
  totalBoites -= (secteur.inhabitees || []).length;
  totalBoites = Math.max(0, totalBoites);
  const aujourdhui = dateLocaleISO();

  // Traités = dons + refus (les absents restent « à faire »)
  const traites  = passages.filter(p => p.statut === "don" || p.statut === "offert" || p.statut === "refuse").length;
  const absents  = passages.filter(p => p.statut === "absent" || p.statut === "relance").length;
  const restantes = totalBoites > 0 ? Math.max(0, totalBoites - traites) : null;

  // Totaux du jour (toutes équipes sur ce secteur)
  const duJour = passages.filter(p => (p.datePassage || '').slice(0, 10) === aujourdhui);
  const donsJour = duJour.filter(p => p.statut === "don");
  const offertsJour = duJour.filter(p => p.statut === "offert");
  const montantJour = donsJour.reduce((s, p) => s + Number(p.montant || 0), 0);

  // Total cumulé du secteur
  const montantTotal = passages.filter(p => p.statut === "don")
                               .reduce((s, p) => s + Number(p.montant || 0), 0);

  const pct = totalBoites > 0 ? Math.round((traites / totalBoites) * 100) : 0;
  const couleur = pct >= 90 ? "#16A34A" : pct >= 60 ? "#EAB308" : pct >= 30 ? "#F97316" : "#EF4444";

  // Calendriers distribués (dons + offerts) et stock en poche
  const distribues = passages.filter(p => p.statut === "don" || p.statut === "offert").length;
  const stockInit = Number(localStorage.getItem(`stock_${APP.equipeId}`) || 0);
  const enPoche = stockInit > 0 ? Math.max(0, stockInit - distribues) : null;

  box.innerHTML = `
    ${enPoche !== null ? `
    <div class="ts-stock">
      <span class="ts-stock-icon">📅</span>
      <span class="ts-stock-val">${enPoche}</span>
      <span class="ts-stock-lbl">calendrier${enPoche !== 1 ? 's' : ''} en poche</span>
      <button class="ts-stock-edit" onclick="definirStock()" title="Modifier le stock">✏️</button>
    </div>` : `
    <button class="ts-stock-init" onclick="definirStock()">
      📅 Combien de calendriers as-tu ? <span>Renseigner</span>
    </button>`}
    ${restantes !== null ? `
    <div class="ts-compteur">
      <div class="ts-compteur-chiffre" style="color:${couleur}">${restantes}</div>
      <div class="ts-compteur-label">boîte${restantes !== 1 ? 's' : ''} restante${restantes !== 1 ? 's' : ''}</div>
      <div class="ts-barre"><div class="ts-barre-fill" style="width:${pct}%;background:${couleur}"></div></div>
      <div class="ts-compteur-detail">${traites} / ${totalBoites} traitée${traites !== 1 ? 's' : ''}${absents > 0 ? ` · ${absents} absent${absents > 1 ? 's' : ''} à revoir` : ''}</div>
    </div>` : ''}
    <div class="ts-chiffres">
      <div class="ts-item">
        <span class="ts-val">${donsJour.length}${offertsJour.length > 0 ? `<small>+${offertsJour.length}🎁</small>` : ''}</span>
        <span class="ts-lbl">don${donsJour.length !== 1 ? 's' : ''} aujourd'hui</span>
      </div>
      <div class="ts-item ts-item--montant">
        <span class="ts-val">${formatMontant(montantJour)}</span>
        <span class="ts-lbl">collecté aujourd'hui</span>
      </div>
      <div class="ts-item">
        <span class="ts-val">${formatMontant(montantTotal)}</span>
        <span class="ts-lbl">total du secteur</span>
      </div>
    </div>
  `;
}
